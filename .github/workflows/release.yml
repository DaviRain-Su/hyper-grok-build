name: Release

# On tag push v*, build the single-file `hyper` binary for the five supported
# targets, package per-target archives named
# hyper-<version>-<target-triple>.{tar.gz|zip} (binary + bundled runtime skills +
# LICENSE + NOTICE + THIRD-PARTY-NOTICES), generate SHA256SUMS, and publish as a
# GitHub Release. install.sh / install.ps1 resolve these exact asset names.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Fail before packaging if debug metadata accidentally inflates a distribution
  # binary again. Current stripped targets are below 200 MiB; 256 MiB leaves
  # headroom for normal dependency growth while catching the r2 Linux regression.
  MAX_RELEASE_BINARY_BYTES: "268435456"
  # audiopus_sys builds bundled Opus from an older CMake project. New CMake
  # releases reject that project's historical policy floor unless this is set.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"
  # Linux gnu artifacts are linked against this glibc floor via cargo-zigbuild
  # (not the runner's host libc). 2.17 ≈ RHEL 7 / Ubuntu 16.04 / manylinux2014,
  # so the same x86_64-unknown-linux-gnu tarball runs on old and new distros.
  # GitHub-hosted ubuntu-16.04 runners are long gone; building on ubuntu-24.04
  # *without* zigbuild would require GLIBC_2.39 (pidfd_*, __isoc23_*).
  LINUX_GLIBC_FLOOR: "2.17"
  # Zig is only used as the C compiler / linker for Linux release builds.
  ZIG_VERSION: "0.14.1"

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          # macos-14 runners are arm64; the x86_64 slice is a cross-compile
          # against the same SDK (macos-13 Intel runners are deprecated).
          - target: x86_64-apple-darwin
            os: macos-14
          # glibc dynamic binaries — proven release path (jemalloc + sqlite-vec).
          # Host stays on ubuntu-24.04 for a modern toolchain; cargo-zigbuild
          # retargets the link to LINUX_GLIBC_FLOOR so we do not inherit 2.39.
          # musl static builds remain blocked until sqlite-vec is vendored
          # without global CFLAGS (target-wide -Du_int* poisons jemalloc-sys).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      # Node 24 majors: silence "Node.js 20 is deprecated" runner warnings.
      - uses: actions/checkout@v5

      - name: Check tag matches VERSION file
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file ($file_version)" >&2
            exit 1
          fi
          # GROK_VERSION is compiled into x-grok-client-version. xAI returns
          # HTTP 426 when the client is below their floor (currently 0.1.202).
          # Refuse to stamp a release that production will hard-reject.
          min_wire="0.1.202"
          if ! printf '%s\n' "$min_wire" "$tag_version" | sort -V -C; then
            echo "VERSION/tag $tag_version is below xAI wire minimum $min_wire" >&2
            echo "Use the monorepo lockstep version (e.g. 0.2.109), not a marketing 0.1.x." >&2
            exit 1
          fi
          echo "GROK_VERSION=$tag_version" >> "$GITHUB_ENV"

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Check CMake for bundled Opus
        run: cmake --version

      - name: Add build target
        run: rustup target add ${{ matrix.target }}

      # Linux only: pin the dynamic symbol floor independent of the runner libc.
      - name: Install Zig (Linux glibc floor)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install dotslash (protoc launcher)
        run: cargo install dotslash --locked

      # Windows cannot exec the Unix dotslash launcher at bin/protoc (os error
      # 193). Install a real protoc.exe and point $PROTOC at it so
      # xai-proto-build skips the wrapper entirely.
      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile protoc.zip
          Expand-Archive protoc.zip -DestinationPath "$env:USERPROFILE\protoc" -Force
          $protoc = Join-Path $env:USERPROFILE "protoc\bin\protoc.exe"
          if (-not (Test-Path $protoc)) { throw "protoc.exe missing at $protoc" }
          & $protoc --version
          Add-Content $env:GITHUB_PATH (Join-Path $env:USERPROFILE "protoc\bin")
          Add-Content $env:GITHUB_ENV "PROTOC=$protoc"

      # Bundle ripgrep into the Windows binary via existing build.rs override
      # paths (Windows auto-download is skipped without these).
      - name: Fetch pinned ripgrep for Windows bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          RG_VER=14.1.1
          mkdir -p tmp/rg
          curl -fsSL -o tmp/rg.zip \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VER}/ripgrep-${RG_VER}-x86_64-pc-windows-msvc.zip"
          # zip layout: ripgrep-<ver>-.../rg.exe
          python3 - <<'PY'
          import zipfile, pathlib
          z = zipfile.ZipFile("tmp/rg.zip")
          for name in z.namelist():
              if name.endswith("rg.exe"):
                  pathlib.Path("tmp/rg").mkdir(parents=True, exist_ok=True)
                  pathlib.Path("tmp/rg/rg.exe").write_bytes(z.read(name))
                  print(f"extracted {name}")
                  break
          else:
              raise SystemExit("rg.exe not found in zip")
          PY
          test -f tmp/rg/rg.exe
          echo "GROK_TOOLS_BUNDLE_RG_PATH=${GITHUB_WORKSPACE}/tmp/rg/rg.exe" >> "$GITHUB_ENV"
          echo "GROK_SHELL_BUNDLE_RG_PATH=${GITHUB_WORKSPACE}/tmp/rg/rg.exe" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          # Include the glibc floor so a floor bump does not reuse stale native
          # objects linked against a different libc abilist.
          key: ${{ matrix.target }}-glibc-${{ env.LINUX_GLIBC_FLOOR }}

      - name: Build hyper (release-dist)
        env:
          GROK_VERSION: ${{ env.GROK_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          common=(--profile release-dist -p xai-grok-pager-bin --features community-build --locked)
          if [ "${{ runner.os }}" = "Linux" ]; then
            # cargo-zigbuild accepts `<triple>.<glibc>`; artifacts still land under
            # target/<triple>/release-dist/ (suffix is only a link-floor selector).
            cargo zigbuild "${common[@]}" \
              --target "${{ matrix.target }}.${LINUX_GLIBC_FLOOR}"
          else
            cargo build "${common[@]}" --target "${{ matrix.target }}"
          fi

      - name: Verify stripped release binary
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          src=""
          for cand in \
            "target/${{ matrix.target }}/release-dist/hyper${suffix}" \
            "target/${{ matrix.target }}/release-dist/xai-grok-pager${suffix}"
          do
            if [ -f "$cand" ]; then src="$cand"; break; fi
          done
          [ -n "$src" ] || { echo "release binary not found under release-dist/" >&2; exit 1; }

          bytes="$(wc -c < "$src" | tr -d '[:space:]')"
          echo "release binary: $src ($bytes bytes; limit $MAX_RELEASE_BINARY_BYTES)"
          if [ "$bytes" -gt "$MAX_RELEASE_BINARY_BYTES" ]; then
            echo "release binary exceeds the 256 MiB distribution limit; check debug/strip settings" >&2
            exit 1
          fi

          if [ "${{ runner.os }}" = "Linux" ]; then
            sections="$RUNNER_TEMP/hyper-sections.txt"
            readelf -SW "$src" > "$sections"
            if grep -Eq '\.(z)?debug_|\.gnu_debuglink' "$sections"; then
              echo "Linux release binary still contains debug sections" >&2
              exit 1
            fi

            # Guard against accidental host-glibc linkage (e.g. falling back to
            # plain `cargo build` on ubuntu-24.04 would reintroduce 2.39).
            max_glibc="$(
              objdump -T "$src" 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
                | sed 's/^GLIBC_//' \
                | sort -V \
                | tail -1
            )"
            if [ -z "$max_glibc" ]; then
              echo "could not determine GLIBC symbol versions from $src" >&2
              exit 1
            fi
            echo "Linux max GLIBC symbol version: $max_glibc (floor target ${LINUX_GLIBC_FLOOR})"
            # Fail if max_glibc > LINUX_GLIBC_FLOOR (sort -V: a b sorted => a <= b).
            if ! printf '%s\n' "$max_glibc" "${LINUX_GLIBC_FLOOR}" | sort -V -C; then
              echo "release binary requires GLIBC_${max_glibc} > ${LINUX_GLIBC_FLOOR}" >&2
              echo "zigbuild glibc floor was not applied; refuse to publish" >&2
              objdump -T "$src" 2>/dev/null | grep 'GLIBC_' | sort -u | tail -30 >&2 || true
              exit 1
            fi
          fi

      - name: Package archive (tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="hyper-${version}-${{ matrix.target }}.tar.gz"
          staging="$(mktemp -d)"
          # Cargo may emit either `hyper` (preferred) or the upstream
          # `xai-grok-pager` name depending on the local [[bin]] entry —
          # normalize to `hyper` for installers.
          src=""
          for cand in \
            "target/${{ matrix.target }}/release-dist/hyper" \
            "target/${{ matrix.target }}/release-dist/xai-grok-pager"
          do
            if [ -f "$cand" ]; then src="$cand"; break; fi
          done
          [ -n "$src" ] || { echo "release binary not found under release-dist/" >&2; ls -la "target/${{ matrix.target }}/release-dist/" >&2; exit 1; }
          cp "$src" "$staging/hyper"
          chmod 0755 "$staging/hyper"
          cp LICENSE "$staging/"
          cp -R bundled "$staging/"
          find "$staging/bundled" -type d -name __pycache__ -prune -exec rm -rf {} +
          find "$staging/bundled" -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          [ -f NOTICE ] && cp NOTICE "$staging/"
          for f in THIRD-PARTY-NOTICES THIRD-PARTY-NOTICES.md; do
            [ -f "$f" ] && cp "$f" "$staging/"
          done
          tar -C "$staging" -czf "$archive" .
          shasum -a 256 "$archive" || sha256sum "$archive"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Package archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $archive = "hyper-$version-${{ matrix.target }}.zip"
          $staging = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "staging")
          $candidates = @(
            "target/${{ matrix.target }}/release-dist/hyper.exe",
            "target/${{ matrix.target }}/release-dist/xai-grok-pager.exe"
          )
          $src = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $src) {
            Get-ChildItem "target/${{ matrix.target }}/release-dist/" | Format-Table
            throw "release binary not found under release-dist/"
          }
          Copy-Item $src (Join-Path $staging "hyper.exe")
          Copy-Item LICENSE $staging
          Copy-Item bundled $staging -Recurse
          Get-ChildItem (Join-Path $staging "bundled") -Directory -Recurse -Filter "__pycache__" |
            Remove-Item -Recurse -Force
          Get-ChildItem (Join-Path $staging "bundled") -File -Recurse -Include "*.pyc", "*.pyo" |
            Remove-Item -Force
          if (Test-Path NOTICE) { Copy-Item NOTICE $staging }
          foreach ($f in @("THIRD-PARTY-NOTICES", "THIRD-PARTY-NOTICES.md")) {
            if (Test-Path $f) { Copy-Item $f $staging }
          }
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $archive
          Get-FileHash -Algorithm SHA256 $archive
          Add-Content -Path $env:GITHUB_ENV -Value "ARCHIVE=$archive"

      # Reuse the same archive classifier/extractor as the community updater so
      # CI cannot ship a layout installers or `hyper update` would reject.
      - name: Build release-archive contract verifier
        shell: bash
        run: |
          cargo build -p xai-grok-update --features community-build \
            --bin hyper-verify-release-archive --locked

      - name: Verify packaged archive contract
        shell: bash
        run: |
          set -euo pipefail
          verifier="target/debug/hyper-verify-release-archive"
          if [ "${{ runner.os }}" = "Windows" ]; then
            verifier="target/debug/hyper-verify-release-archive.exe"
          fi
          digest="$(
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$ARCHIVE" | cut -d' ' -f1
            else
              shasum -a 256 "$ARCHIVE" | cut -d' ' -f1
            fi
          )"
          binary_entry="hyper"
          if [ "${{ runner.os }}" = "Windows" ]; then binary_entry="hyper.exe"; fi
          "$verifier" \
            --archive "$ARCHIVE" \
            --sha256 "$digest" \
            --binary-entry "$binary_entry" \
            --bundle-root bundled

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  # Note: the Windows install.ps1 integration job was removed — it cold-compiled
  # the full shell graph on GHA windows-2022, often hung/cancelled for hours, and
  # blocked publish. Windows CLI artifacts still come from matrix build target
  # x86_64-pc-windows-msvc (hyper-*-x86_64-pc-windows-msvc.zip). install.ps1
  # remains in-repo for end users; run test_install_ps1 locally if needed.

  # macOS install.sh contract: exercises bsdtar listing/parser branch against
  # the same community fixtures (full install, binary-only, injection rollback,
  # double-slash / SUMS rejection). Complements Linux GNU tar CI.
  install-sh-macos:
    name: install.sh (macos-14)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Install dotslash (protoc launcher)
        run: cargo install dotslash --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: install-sh-macos
          shared-key: install-sh-macos
      - name: Show tar flavor
        run: |
          tar --version 2>&1 | head -3 || true
          which tar
      - name: Run install.sh / community contract tests
        run: |
          cargo test -p xai-grok-update \
            --features community-build,community-update-test-hooks \
            --test test_community_update --locked -- --nocapture

  # Linux install.sh contract (GNU tar) — same test binary as macOS so both
  # TAR_FLAVOR branches are live-exercised before publish.
  install-sh-linux:
    name: install.sh (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Install dotslash (protoc launcher)
        run: cargo install dotslash --locked
      - uses: Swatinem/rust-cache@v2
        with:
          key: install-sh-linux
          shared-key: install-sh-linux
      - name: Show tar flavor
        run: tar --version | head -3
      - name: Run install.sh / community contract tests
        run: |
          cargo test -p xai-grok-update \
            --features community-build,community-update-test-hooks \
            --test test_community_update --locked -- --nocapture

  # Desktop (comet) local-link bundles: gpui UI + hyper agent binary for
  # native Linux/macOS hosts. Reuses the per-target hyper archive from `build`
  # so we do not recompile the agent. Layout:
  #   bin/comet  bin/hyper  README.txt
  # Asset name: hyper-desktop-<version>-<target-triple>.tar.gz
  desktop:
    name: desktop (${{ matrix.target }})
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5

      - name: Version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "GROK_VERSION=$version" >> "$GITHUB_ENV"
          echo "HYPER_ARCHIVE=hyper-${version}-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"
          echo "DESKTOP_ARCHIVE=hyper-desktop-${version}-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"

      - name: Install toolchain (desktop/comet)
        working-directory: desktop/comet
        run: rustup show

      - name: Install Linux GUI build deps (gpui)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxkbcommon-x11-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev libvulkan-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/comet -> target
          key: desktop-${{ matrix.target }}

      - name: Download hyper archive for this target
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.HYPER_ARCHIVE }}
          path: hyper-art

      - name: Extract hyper binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/bin
          tar -xzf "hyper-art/${HYPER_ARCHIVE}" -C hyper-art
          # Release tarball may put hyper at root or under .
          if [ -f hyper-art/hyper ]; then
            cp hyper-art/hyper staging/bin/hyper
          else
            found="$(find hyper-art -type f -name hyper | head -1)"
            [ -n "$found" ] || { echo "hyper binary missing in archive"; ls -laR hyper-art; exit 1; }
            cp "$found" staging/bin/hyper
          fi
          chmod 0755 staging/bin/hyper
          ./staging/bin/hyper --version || true

      - name: Build comet (release)
        working-directory: desktop/comet
        run: cargo build -p comet --release --locked

      - name: Package desktop archive
        shell: bash
        run: |
          set -euo pipefail
          comet_bin="desktop/comet/target/release/comet"
          test -f "$comet_bin" || { echo "missing $comet_bin"; ls -la desktop/comet/target/release/ 2>/dev/null || true; exit 1; }
          cp "$comet_bin" staging/bin/comet
          chmod 0755 staging/bin/comet
          cat > staging/README.txt <<EOF
          Hyper desktop local-link bundle ${GROK_VERSION} (${{ matrix.target }})

          Contents:
            bin/comet  — desktop UI + local engine (offline / local-link)
            bin/hyper  — agent binary (ACP stdio); comet spawns this by default

          Install (from this archive):
            mkdir -p "\$HOME/.hyper/desktop/bin"
            cp bin/comet bin/hyper "\$HOME/.hyper/desktop/bin/"
            ln -sfn "\$HOME/.hyper/desktop/bin/comet" "\$HOME/.local/bin/comet"
            ln -sfn "\$HOME/.hyper/desktop/bin/hyper" "\$HOME/.local/bin/hyper"
            export HYPER_AGENT_BIN="\$HOME/.hyper/desktop/bin/hyper"
            comet

          Or:
            curl -fsSL https://raw.githubusercontent.com/DaviRain-Su/hyper-grok-build/dev/install-desktop.sh | bash

          Data:
            Desktop engine store: ~/.hyper/desktop  (COMET_DATA_DIR)
            Hyper agent home:     ~/.grok            (GROK_HOME)

          Cloud multi-device sync is disabled in this fork.
          EOF
          if sed --version >/dev/null 2>&1; then
            sed -i 's/^          //' staging/README.txt
          else
            sed -i '' 's/^          //' staging/README.txt
          fi
          tar -C staging -czf "${DESKTOP_ARCHIVE}" .
          ls -lh "${DESKTOP_ARCHIVE}"
          shasum -a 256 "${DESKTOP_ARCHIVE}" || sha256sum "${DESKTOP_ARCHIVE}"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DESKTOP_ARCHIVE }}
          path: ${{ env.DESKTOP_ARCHIVE }}
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: [build, desktop, install-sh-macos, install-sh-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain (rust-toolchain.toml)
        run: rustup show

      # hyper-verify-release-archive depends on the same protobuf build path.
      - name: Install dotslash (protoc launcher)
        run: cargo install dotslash --locked

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # Require the five CLI archives + three desktop bundles (Linux x64/arm64,
      # macOS arm64). Extra files are rejected.
      - name: Assert release asset set
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "hyper-${version}-aarch64-apple-darwin.tar.gz"
            "hyper-${version}-x86_64-apple-darwin.tar.gz"
            "hyper-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "hyper-${version}-aarch64-unknown-linux-gnu.tar.gz"
            "hyper-${version}-x86_64-pc-windows-msvc.zip"
            "hyper-desktop-${version}-aarch64-apple-darwin.tar.gz"
            "hyper-desktop-${version}-x86_64-unknown-linux-gnu.tar.gz"
            "hyper-desktop-${version}-aarch64-unknown-linux-gnu.tar.gz"
          )
          cd dist
          ls -l
          mapfile -t found < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t want < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${#found[@]}" -ne "${#want[@]}" ]; then
            echo "expected exactly ${#want[@]} release archives, found ${#found[@]}" >&2
            printf 'found: %s\n' "${found[@]}" >&2
            exit 1
          fi
          for i in "${!want[@]}"; do
            if [ "${found[$i]}" != "${want[$i]}" ]; then
              echo "release asset set mismatch:" >&2
              printf '  expected: %s\n' "${want[@]}" >&2
              printf '  found:    %s\n' "${found[@]}" >&2
              exit 1
            fi
          done
          echo "CLI (5) + desktop (3) release archives present"

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          ls -l
          version="${GITHUB_REF_NAME#v}"
          sha256sum \
            "hyper-${version}-aarch64-apple-darwin.tar.gz" \
            "hyper-${version}-x86_64-apple-darwin.tar.gz" \
            "hyper-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "hyper-${version}-aarch64-unknown-linux-gnu.tar.gz" \
            "hyper-${version}-x86_64-pc-windows-msvc.zip" \
            "hyper-desktop-${version}-aarch64-apple-darwin.tar.gz" \
            "hyper-desktop-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "hyper-desktop-${version}-aarch64-unknown-linux-gnu.tar.gz" \
            > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS | tr -d '[:space:]')" -eq 8

      # Contract verifier applies to CLI hyper-* archives only (root binary +
      # bundled/**). Desktop bundles are bin/comet+hyper layout.
      - name: Verify CLI release artifacts and SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p xai-grok-update --features community-build \
            --bin hyper-verify-release-archive --locked
          verifier="target/debug/hyper-verify-release-archive"
          version="${GITHUB_REF_NAME#v}"
          # Verify digests for every line in SHA256SUMS.
          (cd dist && sha256sum -c SHA256SUMS)
          args=(--sums dist/SHA256SUMS --bundle-root bundled)
          for name in \
            "hyper-${version}-aarch64-apple-darwin.tar.gz" \
            "hyper-${version}-x86_64-apple-darwin.tar.gz" \
            "hyper-${version}-x86_64-unknown-linux-gnu.tar.gz" \
            "hyper-${version}-aarch64-unknown-linux-gnu.tar.gz" \
            "hyper-${version}-x86_64-pc-windows-msvc.zip"
          do
            args+=(--archive "${name}=dist/${name}")
          done
          "$verifier" "${args[@]}"

      # v3 = Node 24. draft:false publishes (reuses/updates an existing draft if
      # present so a failed previous run cannot leave an untagged draft forever).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: false
          # Always publish as a full release. Community revision tags use a
          # hyphenated suffix (e.g. v0.2.114-r1); treating those as GitHub
          # prereleases would hide them from /latest and break installers /
          # `hyper update`.
          prerelease: false
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Hyper `${{ github.ref_name }}`

            Unofficial multi-provider community build of [Grok Build](https://github.com/xai-org/grok-build).

            ### CLI install

            ```sh
            # macOS / Linux
            curl -fsSL https://raw.githubusercontent.com/DaviRain-Su/hyper-grok-build/dev/install.sh | bash
            ```

            ```powershell
            # Windows PowerShell
            irm https://raw.githubusercontent.com/DaviRain-Su/hyper-grok-build/dev/install.ps1 | iex
            ```

            Pin a version: `bash install.sh --version ${{ github.ref_name }}`

            ### Desktop install (local-link UI, macOS arm64 / Linux)

            ```sh
            curl -fsSL https://raw.githubusercontent.com/DaviRain-Su/hyper-grok-build/dev/install-desktop.sh | bash
            # pin: bash install-desktop.sh --version ${{ github.ref_name }}
            comet
            ```

            Desktop assets: `hyper-desktop-*-{aarch64-apple-darwin,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu}.tar.gz`
            (bundles `bin/comet` + `bin/hyper`; offline / no cloud sync).
