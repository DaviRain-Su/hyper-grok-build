[package]
name = "xai-hyper-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hypercore session/turn engine (Phase 0 mock + Phase 1 native host)."
publish = false

[features]
default = ["native"]
## Real model streaming via xai-grok-sampler + disk NativeHost.
native = ["dep:xai-grok-sampler", "dep:xai-grok-sampling-types", "dep:futures", "dep:dirs"]

[dependencies]
async-trait = { workspace = true }
fs2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time", "fs", "io-util"] }
xai-hyper-host = { workspace = true }
# Phase 1 (feature = "native")
dirs = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
xai-grok-sampler = { workspace = true, optional = true }
xai-grok-sampling-types = { path = "../xai-grok-sampling-types", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }

[[bin]]
name = "hypercore-demo"
path = "src/bin/hypercore-demo.rs"
required-features = ["native"]

[lints]
workspace = true
