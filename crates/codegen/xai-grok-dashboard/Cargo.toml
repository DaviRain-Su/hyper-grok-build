[package]
name = "xai-grok-dashboard"
version = "0.2.110"
edition.workspace = true
license = "Apache-2.0"
description = "Local web dashboard for Grok Build / Hyper sessions"
publish = false

[dependencies]
# Web framework. Pin the stable Leptos line; beta releases caused a large,
# version-skewed dependency graph without providing anything this SSR UI needs.
axum = { workspace = true, features = ["ws"] }
leptos = { version = "0.8.11", features = ["ssr"] }
leptos_axum = { version = "0.8.6" }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }

# Async runtime & utilities
tokio = { workspace = true, features = ["full"] }
futures-util = { workspace = true }
anyhow = { workspace = true }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["serde"] }

# Logging and CLI integration
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
clap = { workspace = true, features = ["derive"] }
xai-grok-config = { workspace = true }

# Utilities
webbrowser = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
