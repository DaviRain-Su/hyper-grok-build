settings.permission_mode.choice.ask.display: "Demander"
settings.permission_mode.choice.ask.description: "Demande l'autorisation avant les actions d'outil."
settings.permission_mode.choice.auto.display: "Automatique"
settings.permission_mode.choice.auto.description: "Le classificateur LLM approuve les outils sûrs ; les actions dangereuses peuvent encore demander ou être refusées."
settings.permission_mode.choice.always-approve.display: "Toujours approuver"
settings.permission_mode.choice.always-approve.description: "Approuve automatiquement chaque action d'outil. Ignore TOUTES les demandes d'autorisation."
settings.remember_tool_approvals.label: "Mémoriser les approbations d'outil"
settings.remember_tool_approvals.description: "Affiche des options « Toujours autoriser » dans les demandes d'autorisation afin de ne plus être sollicité pour une commande ou un outil précis. S'applique en ask et auto ; Always-approve ignore encore toutes les demandes. Redémarrage requis."
settings.multiline_mode.label: "Multiligne"
settings.multiline_mode.description: "Activé, Enter insère une nouvelle ligne et Shift+Enter envoie. Réinitialisé à chaque session."
settings.default_model.label: "Modèle par défaut"
settings.default_model.description: "Modèle utilisé pour les nouvelles sessions. Le modifier bascule aussi la session active. Choisissez `(pas de remplacement)` pour effacer."
settings.max_thoughts_width.label: "Largeur max. des réflexions"
settings.max_thoughts_width.description: "Budget de largeur de colonne pour le panneau des réflexions de l'agent (40-500, par défaut 120)."
settings.show_thinking_blocks.label: "Afficher les blocs de réflexion"
settings.show_thinking_blocks.description: "Affiche les blocs de réflexion/raisonnement de l'agent dans l'historique pendant le streaming."
settings.prompt_suggestions.label: "Suggestions de prompt"
settings.prompt_suggestions.description: "Après chaque tour, prédit votre prochain prompt probable et l'affiche en texte fantôme dans la saisie (Tab pour accepter). Utilise un petit appel de modèle par tour."
settings.respect_manual_folds.label: "Respecter les replis manuels"
settings.respect_manual_folds.description: "Garde les blocs repliés manuellement tels quels pendant le streaming et arrête le défilement auto au dépliage d'un bloc. Expérimental."
settings.group_tool_verbs.label: "Regrouper les appels d'outil"
settings.group_tool_verbs.description: "Replie les appels d'outil de lecture/recherche/liste consécutifs et les lignes de sous-agents en une ligne récapitulative ; les réflexions terminées se replient aussi dans le groupe."
settings.collapsed_edit_blocks.label: "Replis des blocs d'édition"
settings.collapsed_edit_blocks.description: "Affiche les éditions en résumés diffstat d'une ligne +N/-M et fusionne les éditions consécutives d'un même fichier en un bloc ; dépliez une ligne pour voir les diffs."
settings.display_refresh_auto_cadence.label: "Suivre la fréquence de l'écran"
settings.display_refresh_auto_cadence.description: "Sur les écrans à haute fréquence, le TUI fait du streaming/défilement plus rapide pour suivre l'écran. Désactivé conserve le rythme classique ~60 Hz. Redémarrage requis."
settings.scroll_speed.label: "Vitesse de défilement"
settings.scroll_speed.description: "Multiplicateur de vitesse de défilement molette et trackpad (1-100). Plus élevé = plus rapide."
settings.scroll_mode.label: "Saisie du défilement"
settings.scroll_mode.description: "Force le comportement de défilement par molette ou trackpad quand la détection auto se trompe sur votre appareil."
settings.scroll_mode.choice.auto.display: "Détection auto"
settings.scroll_mode.choice.auto.description: "Détecte molette vs trackpad par geste à partir du minutage des événements. Par défaut."
settings.scroll_mode.choice.wheel.display: "Molette"
settings.scroll_mode.choice.wheel.description: "Traite toujours le défilement comme des crans de molette (lignes fixes par cran)."
settings.scroll_mode.choice.trackpad.display: "Trackpad"
settings.scroll_mode.choice.trackpad.description: "Traite toujours le défilement comme un trackpad (accumulation fractionnaire)."
settings.scroll_lines.label: "Lignes de défilement"
settings.scroll_lines.description: "Lignes par cran de défilement pour molette et trackpad (1-10). Tant que ce n'est pas défini, le profil propre à chaque terminal s'applique."
settings.invert_scroll.label: "Inverser le défilement"
settings.invert_scroll.description: "Inverse le sens du défilement vertical (défilement naturel)."
settings.keep_text_selection.label: "Sélection de texte"
settings.keep_text_selection.description: "Combien de temps la sélection in-app reste à l'écran et ce que fait le double-clic (repli vs. sélection et copie d'un mot). Pour la sélection propre du terminal ou multiplexeur, maintenez Shift en glissant (copie native)."
settings.keep_text_selection.choice.flash.display: "Flash après copie"
settings.keep_text_selection.choice.flash.description: "Brève surbrillance au relâchement, puis effacement. Le double-clic bascule le repli. Par défaut."
settings.keep_text_selection.choice.hold.display: "Maintenir jusqu'à fermeture"
settings.keep_text_selection.choice.hold.description: "Garde la sélection visible jusqu'à Esc, clic ou défilement. Le double-clic bascule le repli."
settings.keep_text_selection.choice.word_select.display: "Sélection de mot (type terminal)"
settings.keep_text_selection.choice.word_select.description: "Double-clic sélectionne et copie un mot, triple-clic une ligne ; la sélection reste jusqu'à fermeture."
settings.coding_data_sharing.label: "Partage des données de code"
settings.coding_data_sharing.description: "Contrôle si SpaceXAI peut conserver et s'entraîner sur les données de sessions de codage. N'affecte pas l'analyse produit ; voir la documentation Configuration et Surveillance."
settings.coding_data_sharing.choice.opt-in.display: "Adhérer"
settings.coding_data_sharing.choice.opt-in.description: "Autorise SpaceXAI à conserver les données de sessions de codage pour l'entraînement des modèles et l'amélioration du produit."
settings.coding_data_sharing.choice.opt-out.display: "Refuser"
settings.coding_data_sharing.choice.opt-out.description: "Ne conserve pas les données de sessions de codage pour l'entraînement. Ne désactive pas l'analyse produit."
settings.default_selected_permission.label: "Autorisation sélectionnée par défaut"
settings.default_selected_permission.description: "Ligne que le curseur présélectionne dans les demandes d'autorisation."
settings.default_selected_permission.choice.always_allow_all_sessions.display: "Toujours autoriser sur toutes les sessions"
settings.default_selected_permission.choice.allow_command_always.display: "Toujours autoriser cette commande"
settings.default_selected_permission.choice.allow_once.display: "Autoriser une fois"
settings.default_selected_permission.choice.reject.display: "Refuser"
settings.toolset.ask_user_question.timeout_enabled.label: "Délai de la question"
settings.toolset.ask_user_question.timeout_enabled.description: "Activé, l'outil ask_user_question expire après un délai défini au lieu de bloquer indéfiniment."
settings.plan_mode.label: "Mode plan"
settings.plan_mode.description: "Activé, l'agent résume un plan avant d'exécuter des outils ou de faire des éditions."
settings.plan_mode.choice.off.display: "Désactivé"
settings.plan_mode.choice.off.description: "L'agent exécute les outils et édite les fichiers directement (par défaut)."
settings.plan_mode.choice.on.display: "Activé"
settings.plan_mode.choice.on.description: "L'agent résume un plan et demande l'approbation avant d'exécuter des outils."
settings.show_tips.label: "Afficher les astuces"
settings.show_tips.description: "Affiche la bannière d'astuce du jour au démarrage. Redémarrage requis."
settings.contextual_hints.label: "Afficher les indices contextuels"
settings.contextual_hints.description: "Affiche de brefs indices clavier contextuels pendant que vous travaillez ; activez-les individuellement."
settings.auto_update.label: "Mise à jour auto"
settings.auto_update.description: "Télécharge et installe automatiquement les mises à jour du pager au démarrage. Redémarrage requis."
settings.hunk_tracker_mode.label: "Suivi des hunks"
settings.hunk_tracker_mode.description: "Quelles modifications de fichiers l'agent suit comme hunks. Désactivé désactive totalement le suivi (et les stats LOC). Redémarrage requis."
settings.hunk_tracker_mode.choice.agent_only.display: "Agent seul"
settings.hunk_tracker_mode.choice.agent_only.description: "Suit uniquement les fichiers que l'agent édite (par défaut)."
settings.hunk_tracker_mode.choice.all_dirty.display: "Tous les modifiés"
settings.hunk_tracker_mode.choice.all_dirty.description: "Suit tous les fichiers git-dirty, y compris les éditions externes."
settings.hunk_tracker_mode.choice.off.display: "Désactivé"
settings.hunk_tracker_mode.choice.off.description: "Désactive totalement le suivi des hunks. Désactive aussi le suivi LOC."
settings.voice_capture_mode.label: "Capture vocale"
settings.voice_capture_mode.description: "Comportement de l'accord vocal (Ctrl+Space / F8) : Basculer (appuyez pour démarrer/arrêter) ou Maintenir pour parler (maintenez pour enregistrer, relâchez pour arrêter ; nécessite un terminal avec protocole Kitty)."
settings.voice_capture_mode.choice.toggle.display: "Basculer"
settings.voice_capture_mode.choice.toggle.description: "Ctrl+Space / F8 démarre la dictée ; appuyez à nouveau (ou Esc/Enter) pour arrêter."
settings.voice_capture_mode.choice.hold.display: "Maintenir pour parler"
settings.voice_capture_mode.choice.hold.description: "Maintenez Ctrl+Space / F8 pour enregistrer, relâchez pour arrêter. Nécessite un terminal avec protocole Kitty."
settings.voice_stt_language.label: "Langue de la voix"
settings.voice_stt_language.description: "Langue de speech-to-text pour la dictée vocale (Grok STT). Anglais par défaut ; Système utilise votre langue système quand elle est prise en charge. Définit la langue de formatage des nombres et des devises."
settings.voice_stt_language.choice.auto.display: "Système"
settings.voice_stt_language.choice.auto.description: "Utilise la langue système quand c'est une langue STT prise en charge ; sinon, anglais."
