settings.contextual_hints.plan_mode.label: "Mode plan"
settings.contextual_hints.plan_mode.description: "Suggère le mode plan (Shift+Tab) quand votre prompt ressemble à une demande de planification."
settings.contextual_hints.image_input.label: "Saisie d'image"
settings.contextual_hints.image_input.description: "Propose de coller une image quand il y en a une dans le presse-papiers et que le modèle accepte les images."
settings.contextual_hints.send_now.label: "Envoyer de suite"
settings.contextual_hints.send_now.description: "Après avoir mis une relance en file en plein tour, vous rappelle qu'Enter sur un prompt vide envoie l'élément en tête de file maintenant."
settings.contextual_hints.small_screen.label: "Petit écran"
settings.contextual_hints.small_screen.description: "Suggère /compact-mode une fois par exécution quand le terminal manque de lignes."
settings.contextual_hints.word_select.label: "Sélection de mot"
settings.contextual_hints.word_select.description: "Après un double-clic sur le texte de conversation alors que la sélection de texte est en mode repli/navigation, vous rappelle que « Sélection de mot » se trouve dans les Paramètres."
settings.contextual_hints.ssh_wrap.label: "Encapsulation SSH"
settings.contextual_hints.ssh_wrap.description: "Au chargement d'une session en SSH, recommande `grok wrap ssh` pour le transfert du presse-papiers et la restauration du terminal."
settings.fork_secondary_model.label: "Embranchement du modèle secondaire"
settings.fork_secondary_model.description: "Modèle utilisé par l'agent secondaire lors d'un embranchement. Choisissez `(pas de remplacement)` pour effacer."

