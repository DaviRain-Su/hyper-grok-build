# ── Catalogue des paramètres (settings/defs.rs) ──────────────────────────────
settings.compact_mode.label: "Mode compact"
settings.compact_mode.description: "Réduit l'espacement autour des messages pour une meilleure densité de contenu. Activé automatiquement quand le terminal fait 20 lignes ou moins."
settings.screen_mode.label: "Mode d'écran par défaut"
settings.screen_mode.description: "Comment grok s'ouvre la prochaine fois : Plein écran (par défaut si non défini) ou Minimal. Écrit [ui] screen_mode dans config.toml. Redémarrage requis. Pour basculer uniquement cette session, utilisez /minimal ou /fullscreen."
