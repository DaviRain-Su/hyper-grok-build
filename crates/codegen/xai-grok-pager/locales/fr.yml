actions.page_up.description: "Défiler d'une page vers le haut"
actions.page_down.label: "page vers le bas"
actions.page_down.description: "Défiler d'une page vers le bas"
actions.collapse.label: "réduire"
actions.collapse.description: "Réduire l'entrée sélectionnée"
actions.expand.label: "réduire"
actions.expand.description: "Développer l'entrée sélectionnée"
actions.toggle_fold.label: "réduire"
actions.toggle_fold.description: "Développer / réduire"
actions.toggle_fold.long_help: "Réduit ou développe l'entrée d'historique sélectionnée pour masquer ou afficher son contenu complet.\nPratique pour parcourir de longues sorties d'outil ou du raisonnement.\nConnexe : E réduit/développe toutes les entrées, Ctrl+E bascule tous les blocs de réflexion."
actions.toggle_expand_all.label: "tout"
actions.toggle_expand_all.description: "Tout développer / tout réduire"
actions.toggle_expand_all.long_help: "Réduit ou développe toutes les entrées de l'historique d'un coup, contrairement à e qui ne bascule que la ligne sélectionnée.\nRéduisez un long historique pour survoler les en-têtes, puis développez tout à nouveau.\nLes blocs de réflexion ont leur propre bascule, Ctrl+E."
actions.expand_all_thinking.label: "développer/réduire réflexion"
actions.expand_all_thinking.description: "Basculer tous les blocs de réflexion"
actions.expand_all_thinking.long_help: "Affiche ou masque les blocs de raisonnement (réflexion) de l'agent dans tout l'historique en une touche.\nRévélez comment l'agent est parvenu à une réponse, ou masquez le raisonnement pour vous concentrer sur les résultats.\nDistinct de E, qui réduit toute entrée quel que soit son type."
actions.toggle_raw.label: "brut"
actions.toggle_raw.description: "Basculer le markdown brut"
actions.toggle_raw.long_help: "Bascule l'entrée sélectionnée entre le markdown rendu et son texte source brut.\nUtile pour copier du markdown exact, inspecter une cible de lien ou voir une mise en forme masquée par le moteur de rendu.\nRecommencez pour revenir à la vue rendue."
actions.copy_block_content.label: "copier"
actions.copy_block_content.description: "Copier le contenu"
actions.copy_block_content.long_help: "Copie le contenu du bloc sélectionné vers le presse-papiers : texte du message, sortie complète d'outil ou contenu d'un bloc de code.\nProposé uniquement sur les blocs gérant la copie.\nPour seulement la commande ou le chemin du fichier, utilisez Y."
actions.copy_block_meta.label: "copier cmd"
actions.copy_block_meta.description: "Copier la commande / le chemin"
actions.copy_block_meta.long_help: "Copie uniquement l'identifiant du bloc : la ligne de commande d'un appel d'outil ou le chemin d'un bloc de fichier, sans le contenu.\nPratique pour relancer une commande ou coller un chemin ailleurs.\nUtilisez y minuscule pour copier le contenu complet."
actions.open_block_viewer.label: "voir"
actions.open_block_viewer.description: "Ouvrir dans la visionneuse"
actions.open_block_viewer.long_help: "Ouvre le bloc sélectionné dans une visionneuse plein écran dédiée et défilable.\nIdéal pour de longues sorties d'outil, de gros fichiers ou du code à lire à l'écart de l'historique.\nEsc revient à la conversation."
actions.open_next_link.label: "lien"
actions.open_next_link.description: "Lien suivant"
actions.open_prev_link.label: "lien"
actions.open_prev_link.description: "Lien précédent"
actions.rewind.label: "rembobiner"
actions.rewind.description: "Rembobiner jusqu'au tour sélectionné"
actions.rewind.long_help: "Rembobine la conversation jusqu'à un tour antérieur, restaurant l'instantané des fichiers pris alors et délaissant les modifications ultérieures.\nChoisissez un tour dans la liste et ce qu'il faut restaurer (tout, conversation seule, ou fichiers seuls) ; un tour en cours propose d'abord l'annulation, et tout conflit ou erreur est rapporté après l'exécution.\nDestructif : les tours ultérieurs sont délaissés.\nÉgalement accessible au repos avec un prompt vide via Esc Esc (sous 800 ms), comme `/rewind`."
actions.kill_bg_task.label: "forcer l'arrêt"
actions.kill_bg_task.description: "Forcer l'arrêt d'une tâche en arrière-plan"
actions.kill_bg_task.long_help: "Arrête la tâche en arrière-plan appartenant au bloc de tâche sélectionné (ex. : une commande shell longue envoyée en arrière-plan).\nUtilisez-la pour stopper un processus dévoyé ou devenu inutile.\nNe s'applique qu'à une tâche active ; les tâches terminées ne sont pas affectées."
actions.send_prompt.label: "envoyer"
actions.send_prompt.description: "Envoyer"
actions.focus_prompt.label: "prompt"
actions.focus_prompt.description: "Focaliser le prompt"
actions.focus_scrollback.label: "historique"
actions.focus_scrollback.description: "Focaliser l'historique"
actions.focus_scrollback.long_help: "Déplace le focus du prompt vers l'historique pour que vous puissiez parcourir la conversation.\nTab fonctionne en mode simple comme en vim de l'historique.\nEsc est réservé à la politique de vider / rembobiner (au repos), pas au focus."
actions.cancel_turn.label: "annuler"
actions.cancel_turn.description: "Annuler le tour"
actions.cancel_turn.long_help: "Interrompt le tour en cours de l'agent et arrête la génération, en gardant la session ouverte.\nCtrl+C annule quand le prompt est vide ; avec un brouillon non vide, il vide d'abord le prompt et laisse le tour se poursuivre.\nIl arrête le tour, pas l'app ; utilisez le raccourci quitter pour sortir."
actions.cycle_mode.label: "mode"
actions.cycle_mode.description: "Boucler le mode (Normal / Plan / Toujours approuver)"
actions.cycle_mode.long_help: "Parcourt le mode de session : Normal -> Plan -> Toujours approuver -> Normal.\nPlan garde l'agent en planification d'abord et n'écrit aucun fichier ; Toujours approuver exécute chaque appel d'outil sans demander.\nCtrl+O bascule l'auto-approbation directement."
actions.toggle_tasks.label: "tâches"
actions.toggle_tasks.description: "Basculer le panneau des tâches"
actions.toggle_tasks.long_help: "Affiche ou masque le panneau des tâches, qui liste les tâches en arrière-plan et leur statut.\nSert à surveiller ou revenir au travail envoyé en arrière-plan avec Ctrl+B.\nUn panneau latéral ; désactivez-le pour récupérer de la largeur."
actions.toggle_todos.label: "à faire"
actions.toggle_todos.description: "Basculer le panneau des à faire"
actions.toggle_todos.long_help: "Affiche ou masque le panneau des à faire : la liste de tâches en direct de l'agent pour le travail en cours.\nSuivez ce qu'il prévoit et ce qu'il reste pendant le tour.\nUn panneau latéral ; désactivez-le pour récupérer de la largeur."
actions.toggle_queue.label: "file"
actions.toggle_queue.description: "Basculer la file de prompts"
actions.toggle_queue.long_help: "Affiche ou masque la file de prompts.\nLa file permet d'aligner des relances pendant qu'un tour s'exécute ; chacune est envoyée automatiquement quand l'agent termine.\nFamille VS Code locale macOS : Ctrl+4 principal (Ctrl+; / Ctrl+' en alternatifs). Sinon Ctrl+; avec Ctrl+' en alternatif."
actions.open_sessions.label: "sessions"
actions.open_sessions.description: "Ouvrir les sessions"
actions.open_sessions.long_help: "Ouvre le navigateur de sessions pour reprendre ou basculer entre des conversations passées.\nSélectionnez-en une pour vous y reconnecter avec tout son historique.\nDistinct du Tableau de bord des agents (Ctrl+\\), qui gère plusieurs agents actifs à la fois."
actions.open_extensions.label: "extensions"
actions.open_extensions.description: "Ouvrir les extensions"
actions.open_extensions.long_help: "Ouvre le gestionnaire d'extensions pour serveurs MCP et plugins : voyez ce qui est connecté et les outils qu'ils ajoutent.\nSert à confirmer qu'une intégration s'est chargée ou à parcourir les outils disponibles.\nDistinct des paramètres, qui regroupent les options générales de l'app."
actions.send_to_background.label: "arrière-plan"
actions.send_to_background.description: "Envoyer la tâche en cours en arrière-plan"
actions.send_to_background.long_help: "Détache l'Execute de premier plan pour qu'il continue en arrière-plan pendant que vous lisez, mettez des prompts en file ou démarrez autre chose.\nSuivez-le et reprenez-le depuis le panneau des tâches (Ctrl+G).\nN'a de sens que si un Execute de premier plan est réellement en cours."
actions.interject_prompt.label: "envoyer de suite"
actions.interject_prompt.description: "Envoyer de suite pendant l'exécution (annule le tour en cours)"
actions.interject_prompt.long_help: "Envoie un message à l'agent en plein tour sans l'annuler (interjection), pour orienter ou ajouter du contexte pendant qu'il continue.\nUn Enter simple pendant un tour met une relance en file pour plus tard ; cet accord fusionne le texte du composeur dans le tour en cours.\nAvec un composeur vide, un Enter nu (ou cet accord) force l'envoi de la relance en tête de file — sans avoir à focaliser le panneau de file. Sur le panneau de file, cet accord envoie de force la ligne sélectionnée.\nUtilisez-le pour rectifier le cap sans perdre la progression du tour."
actions.enable_voice_mode.label: "mode vocal"
actions.enable_voice_mode.description: "Démarrer la dictée vocale (Ctrl+Space / F8)"
actions.voice_toggle.label: "micro"
actions.voice_toggle.description: "Dictée vocale (Ctrl+Space / F8)"
actions.voice_toggle.long_help: "Capture du microphone pour la dictée, liée à Ctrl+Space (ou F8 — pratique quand Ctrl+Space est pris, ex. : bascule de source de saisie macOS ; utilisez Fn+F8 sur un portable).\nLe comportement suit le paramètre Capture vocale : bascule (appuyez pour démarrer, appuyez à nouveau pour arrêter) ou maintenir pour parler (maintenez pour enregistrer, relâchez pour arrêter), où maintenir nécessite un terminal avec protocole Kitty et replie sur bascule ailleurs. `/voice` bascule partout.\nLa parole est transcrite directement dans le prompt."
actions.toggle_multiline.label: "multiligne"
actions.toggle_multiline.description: "Basculer la multiligne"
actions.toggle_multiline.long_help: "Bascule un prompt multiligne persistant pour que l'éditeur reste déplié afin de composer des messages plus longs.\nInsérez des sauts de ligne avec Shift+Enter ou Alt+Enter (ou une barre oblique inverse en fin de ligne) ; Enter nu envoie toujours.\nCtrl+M bascule la multiligne dans le prompt ; hors du prompt, il ouvre le sélecteur de modèle."
actions.bash_mode.label: "shell"
actions.bash_mode.description: "Mode shell (tapez ! sur un prompt vide)"
actions.bash_mode.long_help: "Exécute une commande shell sans quitter le chat : tapez ! au début d'un prompt vide, puis la commande.\nLa sortie de la commande est capturée dans l'historique.\nSupprimez le ! initial pour revenir à un prompt normal."
actions.toggle_yolo.label: "yolo"
actions.toggle_yolo.description: "Basculer toujours approuver"
actions.toggle_yolo.long_help: "Active ou désactive l'auto-approbation (YOLO) pour cette session.\nActivé, l'agent exécute chaque appel d'outil (éditions, shell, suppressions) sans confirmation par action.\nMême état que le « Toujours approuver » du cycle Shift+Tab ; à utiliser avec prudence."
actions.new_session.label: "nouvelle"
actions.new_session.description: "Nouvelle session"
actions.new_session.long_help: "Démarre une session neuve avec un historique et un contexte vides.\nConfirmation requise : appuyez deux fois (la première arme, la seconde démarre)\npour ne pas détruire la conversation en cours par mégarde."
actions.quit.label: "quitter"
actions.quit.description: "Quitter"
actions.quit.long_help: "Quitte l'app. Confirmation requise : appuyez deux fois en succession rapide ;\nune pression isolée est tenue pour une touche parasite et ignorée.\nLié à Ctrl+Q, avec Ctrl+D en alias (Ctrl+D est principal dans le terminal de VS Code)."
actions.command_palette.label: "commandes"
actions.command_palette.description: "Palette de commandes"
actions.command_palette.long_help: "Recherche floue sur chaque action et commande à barre oblique, puis exécutez-la par nom.\nUtile quand vous ne vous souvenez pas d'un raccourci clavier.\nS'ouvre aussi avec ? quand l'historique est focalisé."
actions.shortcuts_help.label: "raccourcis"
actions.shortcuts_help.description: "Raccourcis clavier"
actions.shortcuts_help.long_help: "Ouvre cet aide-mémoire clavier.\nParcourez avec j/k, dépliez l'aide inline d'une ligne avec e, ou appuyez sur Enter pour la page de détail complète d'un raccourci.\nLié à la fois à Ctrl+. et Ctrl+X ; la barre annonce celui que votre terminal envoie de façon fiable."
actions.model_picker.label: "modèle"
actions.model_picker.description: "Choisir un modèle"
actions.model_picker.long_help: "Ouvre le sélecteur de modèle pour basculer le modèle de cette session ; le choix s'applique aux tours suivants.\nLié à Ctrl+M, mais quand le prompt est focalisé cet accord bascule la multiligne.\nAtteignez-le depuis l'historique ou la palette de commandes."
actions.open_settings.label: "paramètres"
actions.open_settings.description: "Ouvrir le panneau des paramètres"
actions.toggle_mouse_capture.label: "signalement de la souris"
actions.toggle_mouse_capture.description: "Basculer le signalement de la souris (copier/coller natif)"
actions.open_dashboard.label: "tableau de bord"
actions.open_dashboard.description: "Ouvrir le Tableau de bord des agents"
actions.open_dashboard.long_help: "Ouvre le Tableau de bord des agents : une liste de tous vos agents en cours et récents pour surveiller et basculer.\nFonctionne de partout, y compris l'écran d'accueil et au sein d'une session.\nDe là, vous pouvez répartir, attacher, arrêter, regrouper et réordonner les agents."
actions.dashboard_select_next.label: "suivant"
actions.dashboard_select_next.description: "Sélectionner la ligne suivante"
actions.dashboard_select_prev.label: "précédent"
actions.dashboard_select_prev.description: "Sélectionner la ligne précédente"
actions.dashboard_toggle_pin.label: "épingler"
actions.dashboard_toggle_pin.description: "Épingler / désépingler l'agent"
actions.dashboard_toggle_pin.long_help: "Épingle ou désépingle l'agent sélectionné pour qu'il reste en tête de liste quel que soit le tri ou le regroupement.\nGardez les agents qui vous importent en vue alors que les autres vont et viennent.\nLes épingles persistent entre les sessions du tableau de bord."
actions.dashboard_begin_rename.label: "renommer"
actions.dashboard_begin_rename.description: "Renommer l'agent"
actions.dashboard_stop.label: "arrêter"
actions.dashboard_stop.description: "Arrêter / fermer l'agent"
actions.dashboard_stop.long_help: "Arrête l'agent sélectionné et retire sa ligne du tableau de bord ; un tour en cours est d'abord interrompu.\nSert à nettoyer les agents terminés ou indésirables sans s'y attacher.\nL'équivalent en surcouche (Ctrl+X) confirme avant l'arrêt."
actions.dashboard_cycle_mode.label: "mode"
actions.dashboard_cycle_mode.description: "Boucler le mode de répartition"
actions.dashboard_cycle_mode.long_help: "Parcourt le mode de répartition des agents lancés depuis le tableau de bord : Normal, Plan, puis Toujours approuver.\nPlan fait planifier les nouveaux agents avant de modifier les fichiers ; Toujours approuver exécute leurs outils sans demander.\nReflète le cycle Shift+Tab en session, appliqué aux nouvelles répartitions."
actions.dashboard_toggle_grouping.label: "regrouper"
actions.dashboard_toggle_grouping.description: "Basculer le regroupement des lignes"
actions.dashboard_toggle_grouping.long_help: "Bascule le tableau de bord entre une liste à plat et des lignes regroupées par état, par exemple en cours versus inactif.\nLe regroupement met en évidence les agents nécessitant de l'attention ; la liste à plat garde un ordre stable.\nVotre choix persiste entre les sessions."
actions.dashboard_reorder_up.label: "monter"
actions.dashboard_reorder_up.description: "Réordonner l'agent vers le haut"
actions.dashboard_reorder_down.label: "descendre"
actions.dashboard_reorder_down.description: "Réordonner l'agent vers le bas"
actions.dashboard_shortcuts_help.label: "raccourcis"
actions.dashboard_shortcuts_help.description: "Afficher la surcouche des raccourcis"
actions.dashboard_exit.label: "quitter"
actions.dashboard_exit.description: "Fermer le tableau de bord"
actions.dashboard_exit.long_help: "Ferme le tableau de bord et revient où vous étiez.\nEsc est en cascade : il ferme d'abord un aperçu ouvert ou efface un filtre actif, et ne quitte que quand plus rien n'est en attente.\nReliez cette action à une autre touche pour quitter directement."
actions.dashboard_toggle_auto_approve.label: "toujours approuver"
actions.dashboard_toggle_auto_approve.description: "Basculer toujours approuver"
actions.dashboard_toggle_auto_approve.long_help: "Bascule l'auto-approbation (YOLO) de l'agent sélectionné depuis le tableau de bord, sans s'y attacher.\nActivé, cet agent exécute chaque appel d'outil sans confirmation par action.\nL'équivalent par session est Ctrl+O au sein d'une session."
actions.dashboard_open_location_picker.label: "emplacement"
actions.dashboard_open_location_picker.description: "Changer le répertoire de travail des nouveaux agents"
actions.dashboard_open_location_picker.long_help: "Ouvre un sélecteur pour définir le répertoire de travail dans lequel s'exécutent les agents répartis depuis le tableau de bord.\nLancez des agents sur un autre dépôt ou dossier sans quitter le tableau de bord.\nN'affecte que les nouvelles répartitions, pas les agents déjà en cours."
actions.dashboard_toggle_worktree.label: "worktree"
actions.dashboard_toggle_worktree.description: "Basculer le mode worktree pour les nouveaux agents"
actions.dashboard_toggle_worktree.long_help: "Fait que le prochain agent réparti depuis le tableau de bord naît dans un nouveau git worktree, isolant son travail sur un checkout séparé.\nNe s'applique que si le répertoire de travail est un dépôt git.\nAffecte les agents nouvellement répartis, pas ceux déjà en cours."
actions.dashboard_overlay_exit.label: "fermer la surcouche"
actions.dashboard_overlay_exit.description: "Retour au tableau de bord"
actions.dashboard_overlay_exit.long_help: "Quitte la surcouche de session attachée et retourne à la liste du tableau de bord, sans arrêter l'agent.\nÉgalement accessible via q sur l'historique, un Esc neutre ou le bouton de fermeture.\nPour arrêter l'agent au lieu de simplement le détacher, utilisez Ctrl+X."
actions.dashboard_overlay_prev.label: "session précédente"
actions.dashboard_overlay_prev.description: "Session précédente"
actions.dashboard_overlay_next.label: "session suivante"
actions.dashboard_overlay_next.description: "Session suivante"
actions.dashboard_overlay_stop.label: "arrêter"
actions.dashboard_overlay_stop.description: "Arrêter l'agent, fermer la session (retour au tableau de bord)"
actions.dashboard_overlay_stop.long_help: "Au sein d'une surcouche de session, arrête l'agent attaché et le ferme, vous ramenant à la liste du tableau de bord.\nConfirmation requise : appuyez deux fois sur Ctrl+X.\nCtrl+. ouvre encore l'aide-mémoire ici ; seul Ctrl+X est pris en charge par l'arrêt."
actions.edit_prompt_external.label: "éditer le prompt"
actions.edit_prompt_external.description: "Éditer le prompt dans un éditeur externe"
actions.edit_prompt_external.long_help: "Ouvre le brouillon du prompt actuel dans $VISUAL ou $EDITOR, repli sur vi quand aucun n'est défini.\nEnregistrer et fermer l'éditeur renvoie le texte mis à jour au composeur ; cela n'envoie pas le prompt.\nDisponible en mode minimal pour les brouillons ordinaires sans pièce jointe."
