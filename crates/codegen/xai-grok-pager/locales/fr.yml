settings.screen_mode.choice.minimal.description: "Ouvre grok en mode natif d'historique (minimal)."
settings.show_timestamps.label: "Afficher les horodatages"
settings.show_timestamps.description: "Affiche l'heure à côté des messages utilisateur et des réponses de l'agent."
settings.show_timeline.label: "Barre latérale de chronologie"
settings.show_timeline.description: "Rail de graduations par tour à la place de la barre de défilement : survolez pour prévisualiser un tour, cliquez pour y sauter."
settings.page_flip_on_send.label: "Placer le prompt en haut à l'envoi"
settings.page_flip_on_send.description: "À l'envoi d'un prompt, le fait défiler en haut de l'écran pour que la réponse commence sur une nouvelle page (par défaut). Désactivez pour laisser la position de défilement inchangée à l'envoi."
settings.combine_queued_prompts.label: "Combiner les prompts en file"
settings.combine_queued_prompts.description: "Fusionne les relances simples consécutives en un seul tour de modèle (le TUI affiche quand même une bulle par relance). S'interrompt sur bash, commandes à barre oblique, cron, compétences dépliées, relances d'images ou ligne en cours d'édition. Désactivé par défaut ; s'applique au drain local et au shell promote."
settings.simple_mode.label: "Désactiver le mode de saisie vim"
settings.simple_mode.description: "Utilise une saisie simple de style readline au lieu des touches vim dans le prompt. Expérimental."
settings.vim_mode.label: "Navigation de l'historique en vim"
settings.vim_mode.description: "Active les touches vim (h/j/k/l, gg/G, /) pour naviguer dans l'historique. N'affecte pas le prompt de saisie."
