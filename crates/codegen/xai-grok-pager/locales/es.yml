# ── Definiciones de ajustes (settings/defs.rs)────────────────────────────────
settings.compact_mode.label: "Modo compacto"
settings.compact_mode.description: "Reduce el espacio entre mensajes para mostrar más contenido. Se activa automáticamente cuando la terminal tiene 20 filas o menos."
settings.screen_mode.label: "Modo de pantalla predeterminado"
settings.screen_mode.description: "Cómo se abre grok la próxima vez de forma normal: Pantalla completa (predeterminado si no se establece) o Mínimo. Escribe [ui] screen_mode en config.toml. Requiere reinicio. Cambia solo esta sesión con /minimal o /fullscreen."
settings.screen_mode.choice.fullscreen.display: "Pantalla completa"
settings.screen_mode.choice.fullscreen.description: "Abre grok de forma normal en el TUI de pantalla completa estándar. Predeterminado si no se establece."
settings.screen_mode.choice.minimal.display: "Mínimo"
settings.screen_mode.choice.minimal.description: "Abre grok de forma normal en modo nativo de historial (mínimo)."
settings.show_timestamps.label: "Mostrar marcas de tiempo"
settings.show_timestamps.description: "Muestra la hora junto a los mensajes del usuario y las respuestas del agente."
settings.show_timeline.label: "Barra lateral de cronología"
settings.show_timeline.description: "Barra de marcas por turno en lugar de la barra de desplazamiento: al pasar el ratón se previsualiza un turno, al hacer clic se salta a él."
settings.page_flip_on_send.label: "Prompt arriba al enviar"
settings.page_flip_on_send.description: "Al enviar un prompt, lo desplaza a la parte superior de la pantalla para que la respuesta empiece en una página nueva (predeterminado). Desactívalo para mantener la posición de desplazamiento al enviar."
settings.combine_queued_prompts.label: "Combinar prompts en cola"
settings.combine_queued_prompts.description: "Fusiona los mensajes de seguimiento consecutivos en un turno del modelo (el TUI muestra un bocadillo por cada uno). Se detiene en bash, comandos con barra, cron, habilidades expandidas, seguimientos con imagen o una fila en edición. Desactivado por defecto; aplica en drain local y shell promote."
settings.simple_mode.label: "Desactivar modo de entrada vim"
settings.simple_mode.description: "Usa entrada de estilo readline normal en lugar de teclas vim en el campo de entrada. Experimental."
settings.vim_mode.label: "Navegación de historial con vim"
settings.vim_mode.description: "Activa teclas vim (h/j/k/l, gg/G, /) para navegar por el historial. No afecta al campo de entrada."
settings.theme.label: "Tema"
settings.theme.description: "Tema de color para la interfaz del pager."
settings.theme.choice.auto.display: "Automático"
settings.theme.choice.auto.description: "Sigue la apariencia clara/oscura del sistema."
settings.theme.choice.groknight.description: "Oscuro neutro con acento magenta."
settings.theme.choice.grokday.description: "Tema claro para entornos luminosos."
settings.theme.choice.tokyonight.description: "Oscuro con tinte azulado; necesita truecolor."
settings.theme.choice.rosepine-moon.description: "Oscuro suave con acentos malva; necesita truecolor."
settings.theme.choice.oscura-midnight.description: "Oscuro profundo con acentos cálidos; necesita truecolor."
