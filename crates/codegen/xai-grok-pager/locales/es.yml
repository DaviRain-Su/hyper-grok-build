settings.contextual_hints.undo.label: "Deshacer"
settings.contextual_hints.undo.description: "Te recuerda que Ctrl+Z restaura el prompt después de borrarlo."
settings.contextual_hints.plan_mode.label: "Modo plan"
settings.contextual_hints.plan_mode.description: "Sugiere el modo plan (Shift+Tab) cuando tu prompt parece una solicitud de planificación."
settings.contextual_hints.image_input.label: "Entrada de imagen"
settings.contextual_hints.image_input.description: "Ofrece pegar una imagen cuando hay una en el portapapeles y el modelo acepta imágenes."
settings.contextual_hints.send_now.label: "Enviar ahora"
settings.contextual_hints.send_now.description: "Tras poner en cola un seguimiento a mitad de turno, te recuerda que Enter en un prompt vacío envía el primer elemento en cola ahora."
settings.contextual_hints.small_screen.label: "Pantalla pequeña"
settings.contextual_hints.small_screen.description: "Sugiere /compact-mode una vez por ejecución cuando la terminal tiene pocas filas."
settings.contextual_hints.word_select.label: "Selección de palabra"
settings.contextual_hints.word_select.description: "Tras hacer doble clic en texto de conversación mientras Selección de texto es plegar/navegar, te recuerda que Selección de palabra está en Ajustes."
settings.contextual_hints.ssh_wrap.label: "Envoltura SSH"
settings.contextual_hints.ssh_wrap.description: "Al cargar una sesión por SSH, recomienda `grok wrap ssh` para reenvío de portapapeles y restauración de terminal."
settings.fork_secondary_model.label: "Modelo secundario de bifurcación"
settings.fork_secondary_model.description: "Modelo usado para el agente secundario al bifurcar. Elige `(sin anulación)` para borrar."

