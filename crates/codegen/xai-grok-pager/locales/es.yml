settings.auto_dark_theme.description: "Tema a usar cuando el sistema está en modo oscuro (solo con theme=auto)."
settings.auto_dark_theme.choice.groknight.description: "Oscuro neutro con acento magenta."
settings.auto_dark_theme.choice.grokday.description: "Tema claro para entornos luminosos."
settings.auto_dark_theme.choice.tokyonight.description: "Oscuro con tinte azulado; necesita truecolor."
settings.auto_dark_theme.choice.rosepine-moon.description: "Oscuro suave con acentos malva; necesita truecolor."
settings.auto_dark_theme.choice.oscura-midnight.description: "Oscuro profundo con acentos cálidos; necesita truecolor."
settings.auto_light_theme.label: "Tema claro automático"
