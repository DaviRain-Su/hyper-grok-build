actions.select_next.label: "navegar"
actions.select_next.description: "Seleccionar entrada siguiente"
actions.select_prev.label: "navegar"
actions.select_prev.description: "Seleccionar entrada anterior"
actions.next_turn.label: "turno"
actions.next_turn.description: "Turno siguiente"
actions.prev_turn.label: "turno"
actions.prev_turn.description: "Turno anterior"
actions.next_response.label: "respuesta"
actions.next_response.description: "Respuesta siguiente"
actions.prev_response.label: "respuesta"
actions.prev_response.description: "Respuesta anterior"
actions.goto_top.label: "inicio/fin"
actions.goto_top.description: "Ir al inicio"
actions.goto_bottom.label: "fin"
actions.goto_bottom.description: "Ir al final"
actions.scroll_up.label: "subir"
actions.scroll_up.description: "Desplazar una línea arriba"
actions.scroll_down.label: "bajar"
actions.scroll_down.description: "Desplazar una línea abajo"
actions.half_page_up.label: "media pág. arriba"
actions.half_page_up.description: "Desplazar media página arriba"
actions.half_page_down.label: "media pág. abajo"
actions.half_page_down.description: "Desplazar media página abajo"
actions.page_up.label: "página arriba"
actions.page_up.description: "Desplazar una página arriba"
actions.page_down.label: "página abajo"
actions.page_down.description: "Desplazar una página abajo"
actions.collapse.label: "plegar"
actions.collapse.description: "Contraer entrada seleccionada"
actions.expand.label: "plegar"
actions.expand.description: "Expandir entrada seleccionada"
actions.toggle_fold.label: "plegar"
actions.toggle_fold.description: "Expandir / contraer"
actions.toggle_fold.long_help: "Pliega o despliega la entrada de historial seleccionada para ocultar o mostrar su contenido completo.\nÚtil para revisar rápidamente salidas largas de herramientas o razonamientos.\nRelacionado: E pliega/despliega todas las entradas, Ctrl+E alterna todos los bloques de razonamiento."
actions.toggle_expand_all.label: "todo"
actions.toggle_expand_all.description: "Expandir todo / contraer todo"
actions.toggle_expand_all.long_help: "Pliega o despliega todas las entradas de historial a la vez, a diferencia de e que solo alterna la fila seleccionada.\nContrae un historial largo para escanear encabezados, luego expande todo de nuevo.\nLos bloques de razonamiento tienen su propio conmutador, Ctrl+E."
actions.expand_all_thinking.label: "expandir/contraer razonamiento"
actions.expand_all_thinking.description: "Alternar todos los bloques de razonamiento"
actions.expand_all_thinking.long_help: "Muestra u oculta los bloques de razonamiento (pensamiento) del agente en todo el historial con una sola pulsación.\nRevela cómo el agente llegó a una respuesta, u oculta el razonamiento para centrarte en los resultados.\nSeparado de E, que pliega todas las entradas independientemente del tipo."
actions.toggle_raw.label: "crudo"
actions.toggle_raw.description: "Alternar markdown crudo"
actions.toggle_raw.long_help: "Cambia la entrada seleccionada entre markdown renderizado y su texto fuente crudo.\nÚsalo para copiar markdown exacto, inspeccionar un destino de enlace o ver formato que el renderizador oculta.\nPulsa de nuevo para volver a la vista renderizada."
actions.copy_block_content.label: "copiar"
actions.copy_block_content.description: "Copiar contenido"
actions.copy_block_content.long_help: "Copia el contenido del bloque seleccionado al portapapeles: texto del mensaje, salida completa de herramienta o el contenido de un bloque de código.\nSolo se ofrece en bloques que admiten copia.\nPara solo el comando o la ruta del archivo, usa Y en su lugar."
actions.copy_block_meta.label: "copiar cmd"
actions.copy_block_meta.description: "Copiar comando / ruta"
actions.copy_block_meta.long_help: "Copia solo el identificador del bloque: la línea de comandos de una llamada a herramienta o la ruta de un bloque de archivo, no el contenido.\nÚtil para reejecutar un comando o pegar una ruta en otro sitio.\nUsa y minúscula para copiar el contenido completo en su lugar."
actions.open_block_viewer.label: "ver"
actions.open_block_viewer.description: "Abrir en visor"
actions.open_block_viewer.long_help: "Abre el bloque seleccionado en un visor de pantalla completa enfocado y desplazable.\nIdeal para salidas largas de herramientas, archivos grandes o código que quieres leer lejos del historial circundante.\nEsc vuelve a la conversación."
actions.open_next_link.label: "enlace"
actions.open_next_link.description: "Enlace siguiente"
actions.open_prev_link.label: "enlace"
actions.open_prev_link.description: "Enlace anterior"
actions.rewind.label: "rebobinar"
actions.rewind.description: "Rebobinar al turno seleccionado"
actions.rewind.long_help: "Rebobina la conversación a un turno anterior, restaurando la instantánea de archivos tomada entonces y descartando cambios posteriores.\nElige un turno de la lista y qué restaurar (todo, solo conversación o solo archivos); un turno en ejecución se ofrece para cancelar primero, y cualquier conflicto o error se informa tras ejecutarse.\nDestructivo: los turnos posteriores se descartan.\nTambién accesible en reposo con un prompt vacío vía Esc Esc (en menos de 800ms), igual que `/rewind`."
actions.kill_bg_task.label: "terminar"
actions.kill_bg_task.description: "Terminar tarea en segundo plano"
actions.kill_bg_task.long_help: "Termina la tarea en segundo plano propiedad del bloque de tareas seleccionado (p. ej. un comando shell largo enviado a segundo plano).\nÚsalo para detener un proceso descontrolado o que ya no necesitas.\nSolo se aplica a una tarea activa; las terminadas no se ven afectadas."
actions.send_prompt.label: "enviar"
actions.send_prompt.description: "Enviar"
actions.focus_prompt.label: "entrada"
actions.focus_prompt.description: "Enfocar entrada"
actions.focus_scrollback.label: "historial"
actions.focus_scrollback.description: "Enfocar historial"
actions.focus_scrollback.long_help: "Mueve el foco de la entrada al historial para que puedas navegar la conversación.\nTab funciona tanto en modo simple como en vim.\nEsc está reservado para la política de borrar / rebobinar (en reposo), no para el foco."
actions.cancel_turn.label: "cancelar"
actions.cancel_turn.description: "Cancelar turno"
actions.cancel_turn.long_help: "Interrumpe el turno actual del agente y detiene la generación, manteniendo la sesión abierta.\nCtrl+C cancela cuando la entrada está vacía; con un borrador no vacío primero borra la entrada y deja el turno en ejecución.\nDetiene el turno, no la app; usa el atajo de salida para salir."
actions.cycle_mode.label: "modo"
actions.cycle_mode.description: "Cambiar modo (Normal / Plan / Siempre aprobar)"
actions.cycle_mode.long_help: "Recorre los modos de sesión: Normal -> Plan -> Siempre-Aprobar -> Normal.\nPlan mantiene al agente planificando primero y no escribe archivos; Siempre-Aprobar ejecuta cada llamada a herramienta sin preguntar.\nCtrl+O alterna la aprobación automática directamente."
actions.toggle_tasks.label: "tareas"
actions.toggle_tasks.description: "Alternar panel de tareas"
actions.toggle_tasks.long_help: "Muestra u oculta el panel de tareas, que lista las tareas en segundo plano y su estado.\nÚsalo para monitorizar o volver al trabajo que enviaste a segundo plano con Ctrl+B.\nUn panel lateral; desactívalo para recuperar anchura."
actions.toggle_todos.label: "pendientes"
actions.toggle_todos.description: "Alternar panel de pendientes"
actions.toggle_todos.long_help: "Muestra u oculta el panel de pendientes: la lista de tareas en vivo del agente para el trabajo actual.\nObserva qué planea hacer y qué queda mientras el turno se ejecuta.\nUn panel lateral; desactívalo para recuperar anchura."
actions.toggle_queue.label: "cola"
actions.toggle_queue.description: "Alternar cola de prompts"
actions.toggle_queue.long_help: "Muestra u oculta la cola de prompts.\nLa cola te permite preparar prompts de seguimiento mientras un turno se ejecuta; cada uno se envía automáticamente cuando el agente termina.\nFamilia VS Code local de macOS: Ctrl+4 principal (Ctrl+; / Ctrl+' alternativos). En otros casos Ctrl+; con Ctrl+' alternativo."
actions.open_sessions.label: "sesiones"
actions.open_sessions.description: "Abrir sesiones"
actions.open_sessions.long_help: "Abre el navegador de sesiones para reanudar o cambiar entre conversaciones pasadas.\nSelecciona una para reconectar con su historial completo.\nDistinto del Panel de Agentes (Ctrl+\\), que gestiona muchos agentes activos a la vez."
actions.open_extensions.label: "extensiones"
actions.open_extensions.description: "Abrir extensiones"
actions.open_extensions.long_help: "Abre el gestor de extensiones para servidores MCP y plugins: ver qué está conectado y las herramientas que añaden.\nÚsalo para confirmar que una integración se cargó o explorar las herramientas disponibles.\nDistinto de los ajustes, que guardan opciones generales de la app."
actions.send_to_background.label: "a 2.º plano"
actions.send_to_background.description: "Enviar tarea en ejecución a segundo plano"
actions.send_to_background.long_help: "Desconecta el Execute en primer plano para que siga trabajando en segundo plano mientras lees, pones prompts en cola o empiezas otra cosa.\nHaz seguimiento y reanúdalo desde el panel de tareas (Ctrl+G).\nSolo tiene sentido mientras un Execute en primer plano está realmente en ejecución."
actions.interject_prompt.label: "enviar ahora"
actions.interject_prompt.description: "Enviar ahora mientras se ejecuta (cancela el turno actual)"
actions.interject_prompt.long_help: "Envía un mensaje al agente a mitad de turno sin cancelarlo (interject), para que puedas dirigirlo o añadir contexto mientras sigue trabajando.\nEnter normal durante un turno encola un seguimiento para más tarde; este acorde fusiona el texto del campo de entrada con el turno actual.\nCon el campo de entrada vacío, Enter simple (o este acorde) envía a la fuerza el primer seguimiento en cola desde el prompt — sin necesidad de enfocar el panel de cola. En el panel de cola, este acorde envía a la fuerza la fila seleccionada.\nÚsalo para corregir el rumbo sin perder el progreso del turno."
actions.enable_voice_mode.label: "modo voz"
actions.enable_voice_mode.description: "Iniciar dictado por voz (Ctrl+Space / F8)"
actions.voice_toggle.label: "mic"
actions.voice_toggle.description: "Dictado por voz (Ctrl+Space / F8)"
actions.voice_toggle.long_help: "Captura de micrófono para dictado, asignada a Ctrl+Space (o F8 — útil donde Ctrl+Space está ocupado, p. ej. cambio de método de entrada en macOS; usa Fn+F8 en un portátil).\nEl comportamiento sigue el ajuste de Captura de voz: conmutar (pulsa para iniciar, pulsa de nuevo para detener) o mantener-para-hablar (mantén para grabar, suelta para detener), donde mantener necesita una terminal con protocolo Kitty y recurre a conmutar en otros sitios. `/voice` conmuta en cualquier lugar.\nLa voz se transcribe directamente al campo de entrada."
actions.toggle_multiline.label: "multilínea"
actions.toggle_multiline.description: "Alternar multilínea"
actions.toggle_multiline.long_help: "Activa un campo de entrada multilínea persistente para que el editor permanezca expandido al redactar mensajes más largos.\nInserta nuevas líneas con Shift+Enter o Alt+Enter (o una barra invertida al final); Enter simple sigue enviando.\nCtrl+M alterna multilínea en el campo de entrada; fuera del campo abre el selector de modelo."
actions.bash_mode.label: "shell"
actions.bash_mode.description: "Modo shell (escribe ! en entrada vacía)"
actions.bash_mode.long_help: "Ejecuta un comando shell sin salir del chat: escribe ! al inicio de un campo vacío y luego el comando.\nLa salida del comando se captura en el historial.\nBorra la ! inicial para volver al campo de entrada normal."
actions.toggle_yolo.label: "yolo"
actions.toggle_yolo.description: "Alternar siempre-aprobar"
actions.toggle_yolo.long_help: "Activa o desactiva la aprobación automática (YOLO) para esta sesión.\nMientras está activado, el agente ejecuta cada llamada a herramienta (ediciones, shell, borrados) sin confirmación por acción.\nMismo estado que el Siempre-Aprobar del ciclo Shift+Tab; úsalo con cuidado."
actions.new_session.label: "nueva"
actions.new_session.description: "Nueva sesión"
actions.new_session.long_help: "Inicia una sesión nueva con historial y contexto vacíos.\nRequiere confirmación: pulsa dos veces (el primer pulso arma, el segundo inicia)\npara que no descartes la conversación actual por accidente."
actions.quit.label: "salir"
actions.quit.description: "Salir"
actions.quit.long_help: "Sale de la app. Requiere confirmación: pulsa dos veces seguidas;\nuna sola pulsación se trata como tecla perdida y se ignora.\nAsignado a Ctrl+Q, con Ctrl+D como alias (Ctrl+D es principal en la terminal de VS Code)."
actions.command_palette.label: "comandos"
actions.command_palette.description: "Paleta de comandos"
actions.command_palette.long_help: "Búsqueda difusa de cada acción y comando con barra, luego ejecútalo por nombre.\nÚtil cuando no recuerdas un atajo de teclado.\nTambién se abre con ? mientras el historial tiene el foco."
actions.shortcuts_help.label: "atajos"
actions.shortcuts_help.description: "Atajos de teclado"
actions.shortcuts_help.long_help: "Abre esta referencia rápida de teclado.\nNavega con j/k, expande la ayuda en línea de una fila con e, o pulsa Enter para la página de detalles completos de un atajo.\nAsignado tanto a Ctrl+. como a Ctrl+X; la barra muestra el que tu terminal envía de forma fiable."
actions.model_picker.label: "modelo"
actions.model_picker.description: "Elegir modelo"
actions.model_picker.long_help: "Abre el selector de modelo para cambiar el modelo de esta sesión; la elección se aplica a los turnos posteriores.\nAsignado a Ctrl+M, pero mientras el campo de entrada tiene el foco ese acorde alterna multilínea.\nAccesible desde el historial o la paleta de comandos."
actions.open_settings.label: "ajustes"
actions.open_settings.description: "Abrir el modal de ajustes"
actions.open_dashboard.label: "panel"
actions.open_dashboard.description: "Abrir el Panel de Agentes"
actions.open_dashboard.long_help: "Abre el Panel de Agentes: una lista de todos tus agentes en ejecución y recientes para monitorizar y alternar entre ellos.\nFunciona desde cualquier sitio, incluida la pantalla de bienvenida y dentro de una sesión.\nDesde ahí puedes despachar, conectar, detener, agrupar y reordenar agentes."
actions.dashboard_select_next.label: "siguiente"
actions.dashboard_select_next.description: "Seleccionar fila siguiente"
actions.dashboard_select_prev.label: "anterior"
actions.dashboard_select_prev.description: "Seleccionar fila anterior"
actions.dashboard_toggle_pin.label: "fijar"
actions.dashboard_toggle_pin.description: "Fijar / soltar agente"
actions.dashboard_toggle_pin.long_help: "Fija o suelta el agente seleccionado para que permanezca al principio de la lista sin importar la ordenación o agrupación.\nMantén a la vista los agentes que te importan mientras otros van y vienen.\nLos fijados persisten entre sesiones del panel."
actions.dashboard_begin_rename.label: "renombrar"
actions.dashboard_begin_rename.description: "Renombrar agente"
actions.dashboard_stop.label: "detener"
actions.dashboard_stop.description: "Detener / Cerrar agente"
actions.dashboard_stop.long_help: "Detiene el agente seleccionado y elimina su fila del panel; un turno en ejecución se interrumpe primero.\nÚsalo para limpiar agentes terminados o no deseados sin conectarte a ellos.\nEl equivalente en el overlay (Ctrl+X) confirma antes de detener."
actions.dashboard_cycle_mode.label: "modo"
actions.dashboard_cycle_mode.description: "Cambiar modo de despacho"
actions.dashboard_cycle_mode.long_help: "Recorre el modo de despacho para agentes que lanzas desde el panel: Normal, Plan, luego Siempre-Aprobar.\nPlan hace que los nuevos agentes planifiquen antes de cambiar archivos; Siempre-Aprobar ejecuta sus herramientas sin preguntar.\nRefleja el ciclo Shift+Tab de la sesión, aplicado a los nuevos despachos."
actions.dashboard_toggle_grouping.label: "agrupar"
actions.dashboard_toggle_grouping.description: "Alternar agrupación de filas"
actions.dashboard_toggle_grouping.long_help: "Cambia el panel entre una lista plana y filas agrupadas por estado, como en ejecución versus inactivo.\nLa agrupación saca a la luz los agentes que necesitan atención; la lista plana mantiene un orden estable.\nTu elección persiste entre sesiones."
actions.dashboard_reorder_up.label: "subir"
actions.dashboard_reorder_up.description: "Subir agente"
actions.dashboard_reorder_down.label: "bajar"
actions.dashboard_reorder_down.description: "Bajar agente"
actions.dashboard_shortcuts_help.label: "atajos"
actions.dashboard_shortcuts_help.description: "Mostrar overlay de atajos"
actions.dashboard_exit.label: "salir"
actions.dashboard_exit.description: "Cerrar panel"
actions.dashboard_exit.long_help: "Cierra el panel y vuelve a donde estabas.\nEsc es en cascada: primero descarta una vista previa abierta o borra un filtro activo, y solo sale cuando no hay nada más pendiente.\nReasigna esta acción a otra tecla para salir directamente."
actions.dashboard_toggle_auto_approve.label: "siempre-aprobar"
actions.dashboard_toggle_auto_approve.description: "Alternar siempre-aprobar"
actions.dashboard_toggle_auto_approve.long_help: "Alterna la aprobación automática (YOLO) del agente seleccionado directamente desde el panel, sin conectarte a él.\nMientras está activado, ese agente ejecuta cada llamada a herramienta sin confirmación por acción.\nEl equivalente por sesión es Ctrl+O dentro de una sesión."
actions.dashboard_open_location_picker.label: "ubicación"
actions.dashboard_open_location_picker.description: "Cambiar directorio de trabajo para nuevos agentes"
actions.dashboard_open_location_picker.long_help: "Abre un selector para establecer el directorio de trabajo en el que se ejecutan los nuevos agentes despachados desde el panel.\nLanza agentes contra un repo o carpeta diferente sin salir del panel.\nAfecta solo a los nuevos despachos, no a los agentes ya en ejecución."
actions.dashboard_toggle_worktree.label: "worktree"
actions.dashboard_toggle_worktree.description: "Alternar modo worktree para nuevos agentes"
actions.dashboard_toggle_worktree.long_help: "Prepara el próximo agente despachado desde el panel para generarse en un git worktree nuevo, aislando su trabajo en un checkout separado.\nSolo aplica cuando el directorio de trabajo es un repo git.\nAfecta a los agentes recién despachados, no a los ya en ejecución."
actions.dashboard_overlay_exit.label: "cerrar overlay"
actions.dashboard_overlay_exit.description: "Volver al panel"
actions.dashboard_overlay_exit.long_help: "Sale del overlay de sesión conectada y vuelve a la lista del panel, sin detener el agente.\nTambién accesible vía q en el historial, un Esc neutro o el botón de cierre.\nPara detener el agente en lugar de solo desconectar, usa Ctrl+X."
actions.dashboard_overlay_prev.label: "sesión anterior"
actions.dashboard_overlay_prev.description: "Sesión anterior"
actions.dashboard_overlay_next.label: "sesión siguiente"
actions.dashboard_overlay_next.description: "Sesión siguiente"
actions.dashboard_overlay_stop.label: "detener"
actions.dashboard_overlay_stop.description: "Detener agente, cerrar sesión (volver al panel)"
actions.dashboard_overlay_stop.long_help: "Dentro de un overlay de sesión, detiene el agente conectado y lo cierra, devolviéndote a la lista del panel.\nRequiere confirmación: pulsa Ctrl+X dos veces.\nCtrl+. sigue abriendo la referencia rápida aquí; solo Ctrl+X es tomado por detener."
actions.edit_prompt_external.label: "editar prompt"
actions.edit_prompt_external.description: "Editar prompt en editor externo"
actions.edit_prompt_external.long_help: "Abre el borrador del prompt actual en $VISUAL o $EDITOR, recurriendo a vi cuando ninguno está establecido.\nGuardar y cerrar el editor devuelve el texto actualizado al campo de entrada; no envía el prompt.\nDisponible en modo mínimo para borradores ordinarios sin adjuntos."
actions.toggle_mouse_capture.label: "reporte de mouse"
actions.toggle_mouse_capture.description: "Alternar reporte de mouse (copia/pegado nativo)"
