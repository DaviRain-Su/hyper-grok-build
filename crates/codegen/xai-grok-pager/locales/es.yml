settings.auto_light_theme.choice.oscura-midnight.description: "Oscuro profundo con acentos cálidos; necesita truecolor."
settings.render_mermaid.label: "Renderizar diagramas Mermaid"
settings.render_mermaid.description: "Cómo se muestran los bloques de código ```mermaid: auto/activado añaden una fila clicable para abrir el diagrama renderizado; desactivado muestra el código fuente original."
settings.render_mermaid.choice.auto.display: "Automático"
settings.render_mermaid.choice.auto.description: "Muestra diagramas con una fila clicable para abrir/copiar la imagen renderizada."
settings.render_mermaid.choice.on.display: "Activado"
settings.render_mermaid.choice.on.description: "Igual que automático: siempre muestra la fila de acciones clicables."
settings.render_mermaid.choice.off.display: "Desactivado"
settings.render_mermaid.choice.off.description: "Muestra siempre el código fuente de Mermaid como un bloque de código."
settings.language.label: "Idioma"
settings.language.description: "Idioma de la interfaz: automático sigue el idioma del sistema; solo cambian las cadenas cubiertas por un paquete de traducción."
settings.language.choice.auto.display: "Automático"
settings.language.choice.auto.description: "Sigue el idioma del sistema (recurre al inglés)."
settings.language.choice.en.description: "Cadenas de UI en inglés."
settings.language.choice.de.description: "Cadenas de UI en alemán."
settings.language.choice.es.description: "Cadenas de UI en español."
settings.language.choice.fr.description: "Cadenas de UI en francés."
settings.language.choice.ja.description: "Cadenas de UI en japonés."
settings.language.choice.ko.description: "Cadenas de UI en coreano."
settings.language.choice.pt-BR.description: "Cadenas de UI en portugués brasileño."
settings.language.choice.ru.description: "Cadenas de UI en ruso."
settings.language.choice.zh-CN.description: "Cadenas de UI en chino simplificado."
settings.language.choice.zh-TW.description: "Cadenas de UI en chino tradicional."
settings.permission_mode.label: "Modo de permisos"
settings.permission_mode.description: "Default usa el comportamiento integrado del agente; Ask pregunta por cada acción de herramienta; Auto usa un clasificador LLM para herramientas riesgosas; Always approve concede todos los permisos automáticamente."
settings.permission_mode.choice.default.display: "Predeterminado"
settings.permission_mode.choice.default.description: "Usa el comportamiento de permisos predeterminado del agente (actualmente equivalente a Ask)."
settings.permission_mode.choice.ask.display: "Preguntar"
settings.permission_mode.choice.ask.description: "Pide permiso antes de las acciones de herramientas."
settings.permission_mode.choice.auto.display: "Automático"
settings.permission_mode.choice.auto.description: "El clasificador LLM aprueba herramientas seguras; las acciones peligrosas pueden seguir preguntando o denegándose."
settings.permission_mode.choice.always-approve.display: "Siempre aprobar"
settings.permission_mode.choice.always-approve.description: "Aprueba automáticamente cada acción de herramienta. Omite TODOS los avisos de permiso."
settings.remember_tool_approvals.label: "Recordar aprobaciones de herramientas"
settings.remember_tool_approvals.description: "Muestra opciones de \"Permitir siempre\" en los avisos de permiso para que no te pregunten repetidamente por un comando o herramienta específica. Aplica en ask y auto; Always-approve sigue omitiendo todos los avisos. Requiere reinicio."
settings.multiline_mode.label: "Multilínea"
settings.multiline_mode.description: "Cuando está activado, Enter inserta una nueva línea y Shift+Enter envía. Se reinicia en cada sesión."
settings.default_model.label: "Modelo predeterminado"
settings.default_model.description: "Modelo usado para nuevas sesiones. Cambiarlo también cambia la sesión activa. Elige `(sin anulación)` para borrar."
settings.max_thoughts_width.label: "Ancho máximo de razonamiento"
settings.max_thoughts_width.description: "Presupuesto de ancho de columna para el panel de razonamiento del agente (40-500, predeterminado 120)."
settings.show_thinking_blocks.label: "Mostrar bloques de razonamiento"
settings.show_thinking_blocks.description: "Muestra los bloques de razonamiento/pensamiento del agente en el historial durante el streaming."
settings.prompt_suggestions.label: "Sugerencias de prompt"
settings.prompt_suggestions.description: "Tras cada turno, predice tu probable siguiente prompt y lo muestra como texto fantasma en la entrada (Tab para aceptar). Usa una llamada a un modelo pequeño por turno."
settings.respect_manual_folds.label: "Respetar plegados manuales"
settings.respect_manual_folds.description: "Mantiene los bloques plegados manualmente tal cual durante el streaming y detiene el desplazamiento automático al expandir un bloque. Experimental."
settings.group_tool_verbs.label: "Agrupar llamadas a herramientas"
settings.group_tool_verbs.description: "Pliega las llamadas consecutivas de lectura/búsqueda/listado y las filas de subagentes en una fila de resumen; los razonamientos terminados también se pliegan en el grupo."
settings.collapsed_edit_blocks.label: "Bloques de edición plegados"
settings.collapsed_edit_blocks.description: "Muestra ediciones como resúmenes diffstat de una línea +N/-M y fusiona ediciones consecutivas al mismo archivo en un bloque; expande una fila para ver los diffs."
settings.display_refresh_auto_cadence.label: "Igualar tasa de refresco"
settings.display_refresh_auto_cadence.description: "En pantallas de alto refresco, el TUI hará streaming/desplazamiento más rápido para igualar la pantalla. Desactivado mantiene la cadencia clásica de ~60 Hz. Requiere reinicio."
settings.scroll_speed.label: "Velocidad de desplazamiento"
settings.scroll_speed.description: "Multiplicador de velocidad de desplazamiento para rueda de mouse y trackpad (1-100). Mayor = más rápido."
settings.scroll_mode.label: "Entrada de desplazamiento"
settings.scroll_mode.description: "Fuerza el comportamiento de desplazamiento de rueda o trackpad cuando la detección automática lee mal tu dispositivo."
settings.scroll_mode.choice.auto.display: "Detectar automáticamente"
settings.scroll_mode.choice.auto.description: "Detecta rueda frente a trackpad por gesto según el tiempo de eventos. Predeterminado."
settings.scroll_mode.choice.wheel.display: "Rueda de mouse"
settings.scroll_mode.choice.wheel.description: "Trata siempre el desplazamiento como muescas de rueda (líneas fijas por tick)."
settings.scroll_mode.choice.trackpad.display: "Trackpad"
settings.scroll_mode.choice.trackpad.description: "Trata siempre el desplazamiento como un trackpad (acumulación fraccional)."
settings.scroll_lines.label: "Líneas de desplazamiento"
settings.scroll_lines.description: "Líneas por tick de desplazamiento tanto para rueda como para trackpad (1-10). Hasta que se establezca, aplica el perfil propio de cada terminal."
settings.invert_scroll.label: "Invertir desplazamiento"
settings.invert_scroll.description: "Invierte la dirección del desplazamiento vertical (desplazamiento natural)."
settings.keep_text_selection.label: "Selección de texto"
settings.keep_text_selection.description: "Cuánto tiempo permanece la selección en pantalla y qué hace el doble clic (plegar vs. seleccionar y copiar una palabra). Para la selección propia de tu terminal o multiplexor, mantén Shift mientras arrastras (copia nativa)."
settings.keep_text_selection.choice.flash.display: "Destello tras copiar"
settings.keep_text_selection.choice.flash.description: "Breve resaltado al soltar el mouse, luego se borra. El doble clic alterna el plegado. Predeterminado."
settings.keep_text_selection.choice.hold.display: "Mantener hasta descartar"
settings.keep_text_selection.choice.hold.description: "Mantiene la selección visible hasta Esc, clic o desplazamiento. El doble clic alterna el plegado."
settings.keep_text_selection.choice.word_select.display: "Selección de palabra (tipo terminal)"
settings.keep_text_selection.choice.word_select.description: "El doble clic selecciona y copia una palabra, el triple clic una línea; la selección se mantiene hasta descartarla."
settings.coding_data_sharing.label: "Compartir datos de codificación"
settings.coding_data_sharing.description: "Controla si SpaceXAI puede conservar y entrenar con datos de sesiones de codificación. No afecta a la analítica de producto; consulta la documentación de Configuración y Monitorización."
settings.coding_data_sharing.choice.opt-in.display: "Participar"
settings.coding_data_sharing.choice.opt-in.description: "Permite a SpaceXAI conservar datos de sesiones de codificación para entrenamiento de modelos y mejora del producto."
settings.coding_data_sharing.choice.opt-out.display: "No participar"
settings.coding_data_sharing.choice.opt-out.description: "No conserva datos de sesiones de codificación para entrenamiento. No desactiva la analítica de producto."
settings.default_selected_permission.label: "Permiso seleccionado por defecto"
settings.default_selected_permission.description: "Qué fila preselecciona el cursor en los avisos de permiso."
settings.default_selected_permission.choice.always_allow_all_sessions.display: "Permitir siempre en todas las sesiones"
settings.default_selected_permission.choice.allow_command_always.display: "Permitir siempre este comando"
settings.default_selected_permission.choice.allow_once.display: "Permitir una vez"
settings.default_selected_permission.choice.reject.display: "Rechazar"
settings.toolset.ask_user_question.timeout_enabled.label: "Tiempo de espera de pregunta"
settings.toolset.ask_user_question.timeout_enabled.description: "Cuando está activado, la herramienta ask_user_question expirará tras un periodo establecido en lugar de bloquear indefinidamente."
settings.plan_mode.label: "Modo plan"
settings.plan_mode.description: "Cuando está activado, el agente resume un plan antes de ejecutar herramientas o hacer ediciones."
settings.plan_mode.choice.off.display: "Desactivado"
settings.plan_mode.choice.off.description: "El agente ejecuta herramientas y edita archivos directamente (predeterminado)."
settings.plan_mode.choice.on.display: "Activado"
settings.plan_mode.choice.on.description: "El agente resume un plan y pide aprobación antes de ejecutar herramientas."
settings.show_tips.label: "Mostrar consejos"
settings.show_tips.description: "Muestra el banner del consejo del día al iniciar. Requiere reinicio."
settings.contextual_hints.label: "Mostrar pistas contextuales"
settings.contextual_hints.description: "Muestra breves pistas de teclado contextuales mientras trabajas; activa o desactiva cada una individualmente."
settings.auto_update.label: "Actualización automática"
settings.auto_update.description: "Descarga e instala automáticamente actualizaciones del pager al iniciar. Requiere reinicio."
settings.hunk_tracker_mode.label: "Rastreador de hunks"
settings.hunk_tracker_mode.description: "Qué cambios de archivo rastrea el agente como hunks. Desactivado deshabilita el rastreo (y las estadísticas de LOC) por completo. Requiere reinicio."
settings.hunk_tracker_mode.choice.agent_only.display: "Solo agente"
settings.hunk_tracker_mode.choice.agent_only.description: "Rastrea solo los archivos que edita el agente (predeterminado)."
settings.hunk_tracker_mode.choice.all_dirty.display: "Todos los modificados"
settings.hunk_tracker_mode.choice.all_dirty.description: "Rastrea todos los archivos modificados por git, incluidas las ediciones externas."
settings.hunk_tracker_mode.choice.off.display: "Desactivado"
settings.hunk_tracker_mode.choice.off.description: "Deshabilita el rastreo de hunks por completo. También deshabilita el rastreo de LOC."
settings.voice_capture_mode.label: "Captura de voz"
settings.voice_capture_mode.description: "Cómo se comporta el acorde de voz (Ctrl+Space / F8): Conmutar (pulsa para iniciar/detener) o Mantener para hablar (mantén para grabar, suelta para detener; necesita una terminal con protocolo Kitty)."
settings.voice_capture_mode.choice.toggle.display: "Conmutar"
settings.voice_capture_mode.choice.toggle.description: "Ctrl+Space / F8 inicia el dictado; pulsa de nuevo (o Esc/Enter) para detener."
settings.voice_capture_mode.choice.hold.display: "Mantener para hablar"
settings.voice_capture_mode.choice.hold.description: "Mantén Ctrl+Space / F8 para grabar, suelta para detener. Necesita una terminal con protocolo Kitty."
settings.voice_stt_language.label: "Idioma de voz"
settings.voice_stt_language.description: "Idioma de reconocimiento de voz para el dictado por voz (Grok STT). Inglés por defecto; Sistema usa tu idioma del sistema cuando es compatible. Establece el idioma de formato para números y monedas."
settings.voice_stt_language.choice.auto.display: "Sistema"
settings.voice_stt_language.choice.auto.description: "Usa el idioma del sistema cuando es un idioma STT compatible; en caso contrario, inglés."
