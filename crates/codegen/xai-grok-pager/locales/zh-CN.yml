mode.plan: "计划"
mode.auto: "自动"
mode.normal: "普通"
mode.always_approve: "总是批准"
hints.type_comment: "输入评论..."
hints.reply_placeholder: "回复…"
hints.new_in_worktree: "在 worktree 中新建"
hints.close_session: "关闭此会话"
hints.clear: "清空"
shortcuts.press_again_key: "再按 %{key} 以%{label}"
hints.undo: "撤销"
hints.redo: "重做"
shortcuts_help.undo_desc: "撤销上一次输入框编辑"
shortcuts_help.redo_desc: "重做上一次撤销的输入框编辑"
shortcuts_help.undo_long_help: "撤销输入框中的上一次更改。\n涵盖输入、删除、行/词删除以及清空草稿。"
shortcuts_help.redo_long_help: "重做输入框中上一次撤销的更改。\nCtrl+Shift+Z 为主;Ctrl+R 为备选。"
