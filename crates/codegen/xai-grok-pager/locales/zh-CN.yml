settings.default_selected_permission.choice.allow_once.display: "允许一次"
settings.default_selected_permission.choice.reject.display: "拒绝"
settings.toolset.ask_user_question.timeout_enabled.label: "提问超时"
settings.toolset.ask_user_question.timeout_enabled.description: "开启后,ask_user_question 工具会在设定时间后超时,而不是无限期阻塞。"
settings.plan_mode.label: "计划模式"
settings.plan_mode.description: "开启后,代理先总结计划,再运行工具或编辑。"
settings.plan_mode.choice.off.display: "关"
settings.plan_mode.choice.off.description: "代理直接运行工具和编辑文件(默认)。"
settings.plan_mode.choice.on.display: "开"
settings.plan_mode.choice.on.description: "代理先总结计划并请求批准,再运行工具。"
settings.show_tips.label: "显示提示"
settings.show_tips.description: "启动时显示每日提示横幅。需要重启。"
settings.contextual_hints.label: "显示上下文提示"
settings.contextual_hints.description: "在你工作时显示简短的上下文键盘提示;可逐条开关。"
settings.auto_update.label: "自动更新"
settings.auto_update.description: "启动时自动下载并安装 pager 更新。需要重启。"
settings.hunk_tracker_mode.label: "Hunk 跟踪"
settings.hunk_tracker_mode.description: "代理将哪些文件变更跟踪为 hunk。关闭则完全禁用跟踪(及 LOC 统计)。需要重启。"
settings.hunk_tracker_mode.choice.agent_only.display: "仅代理"
settings.hunk_tracker_mode.choice.agent_only.description: "只跟踪代理编辑的文件(默认)。"
settings.hunk_tracker_mode.choice.all_dirty.display: "全部脏文件"
settings.hunk_tracker_mode.choice.all_dirty.description: "跟踪所有 git 脏文件,包括外部编辑。"
settings.hunk_tracker_mode.choice.off.display: "关"
settings.hunk_tracker_mode.choice.off.description: "完全禁用 hunk 跟踪,同时禁用 LOC 跟踪。"
settings.voice_capture_mode.label: "语音捕获"
settings.voice_capture_mode.description: "语音组合键(Ctrl+Space / F8)的行为:切换(按一下开始/停止)或按住说话(按住录音,松开停止;需要 Kitty 协议终端)。"
settings.voice_capture_mode.choice.toggle.display: "切换"
settings.voice_capture_mode.choice.toggle.description: "Ctrl+Space / F8 开始听写;再按一次(或 Esc/Enter)停止。"
settings.voice_capture_mode.choice.hold.display: "按住说话"
settings.voice_capture_mode.choice.hold.description: "按住 Ctrl+Space / F8 录音,松开停止。需要 Kitty 协议终端。"
settings.voice_stt_language.label: "语音语言"
settings.voice_stt_language.description: "语音听写的语音识别语言(Grok STT)。默认英文;System 在支持时使用你的系统语言。同时设置数字和货币的格式化语言。"
settings.voice_stt_language.choice.auto.display: "系统"
settings.voice_stt_language.choice.auto.description: "系统语言是受支持的 STT 语言时使用系统语言;否则用英文。"
