actions.collapse.description: "折叠选中项"
actions.expand.label: "折叠"
actions.expand.description: "展开选中项"
actions.toggle_fold.label: "折叠"
actions.toggle_fold.description: "展开 / 折叠"
actions.toggle_fold.long_help: "折叠或展开选中的滚动记录条目,隐藏或显示其完整内容。\n浏览冗长的工具输出或推理内容时很好用。\n相关:E 折叠/展开所有条目,Ctrl+E 切换所有思考块。"
actions.toggle_expand_all.label: "全部"
actions.toggle_expand_all.description: "全部展开 / 全部折叠"
actions.toggle_expand_all.long_help: "一次性折叠或展开所有滚动记录条目,而 e 只切换选中的行。\n先把长记录折叠起来扫一遍标题,再全部展开恢复。\n思考块有单独的开关 Ctrl+E。"
actions.expand_all_thinking.label: "展开/折叠思考"
actions.expand_all_thinking.description: "切换所有思考块"
actions.expand_all_thinking.long_help: "一键显示或隐藏整个记录中代理的推理(思考)块。\n查看代理如何得出结论,或隐藏推理以专注于结果。\n与 E 不同,E 折叠所有类型的条目。"
actions.toggle_raw.label: "原文"
actions.toggle_raw.description: "切换原始 markdown"
actions.toggle_raw.long_help: "在渲染后的 markdown 和原始源文本之间切换选中条目。\n用于复制精确的 markdown、查看链接目标,或查看渲染器隐藏的格式。\n再按一次返回渲染视图。"
actions.copy_block_content.label: "复制"
actions.copy_block_content.description: "复制内容"
actions.copy_block_content.long_help: "将选中块的内容复制到剪贴板:消息文本、完整工具输出或代码块内容。\n只在支持复制的块上提供。\n只想复制命令或文件路径时,用 Y。"
actions.copy_block_meta.label: "复制命令"
actions.copy_block_meta.description: "复制命令 / 路径"
actions.copy_block_meta.long_help: "只复制块的标识符:工具调用的命令行或文件块的路径,不含内容。\n方便重新运行命令或在别处粘贴路径。\n复制完整内容请用小写 y。"
actions.open_block_viewer.label: "查看"
actions.open_block_viewer.description: "在查看器中打开"
actions.open_block_viewer.long_help: "在专注的全屏可滚动查看器中打开选中块。\n适合阅读长工具输出、大文件,或想离开会话流细看的代码。\nEsc 返回会话。"
actions.open_next_link.label: "链接"
actions.open_next_link.description: "下一个链接"
actions.open_prev_link.label: "链接"
actions.open_prev_link.description: "上一个链接"
actions.rewind.label: "回退"
actions.rewind.description: "回退到选中回合"
actions.rewind.long_help: "将对话回退到更早的回合,恢复当时的文件快照并丢弃之后的更改。\n从列表中选择一个回合并选择要恢复的内容(全部、仅对话或仅文件);进行中的回合会先提示取消,冲突或错误会在执行后报告。\n破坏性操作:之后的回合会被丢弃。\n空闲时输入框为空也可通过 Esc Esc(800ms 内)触发,同 `/rewind`。"
actions.kill_bg_task.label: "终止"
actions.kill_bg_task.description: "终止后台任务"
actions.kill_bg_task.long_help: "终止选中任务块所属的后台任务(例如发送到后台的长时 shell 命令)。\n用于停止失控或不再需要的进程。\n只对存活的任务有效;已完成的任务不受影响。"
actions.send_prompt.label: "发送"
actions.send_prompt.description: "发送"
actions.focus_prompt.label: "输入框"
actions.focus_prompt.description: "聚焦输入框"
actions.focus_scrollback.label: "滚动记录"
actions.focus_scrollback.description: "聚焦滚动记录"
actions.focus_scrollback.long_help: "将焦点从输入框移到滚动记录,以便浏览会话记录。\nTab 在简单和 vim 滚动模式下都可用。\nEsc 保留给清除/回退(空闲)策略,不用于焦点切换。"
actions.cancel_turn.label: "取消"
actions.cancel_turn.description: "取消回合"
actions.cancel_turn.long_help: "中断代理的当前回合并停止生成,会话保持打开。\n输入框为空时 Ctrl+C 取消;有未发送草稿时先清空输入框,回合继续运行。\n它停止的是回合而不是应用;退出请用退出快捷键。"
actions.cycle_mode.label: "模式"
actions.cycle_mode.description: "循环模式(普通 / 计划 / 总是批准)"
actions.cycle_mode.long_help: "循环会话模式:普通 -> 计划 -> 总是批准 -> 普通。\n计划模式让代理先规划且不写文件;总是批准不询问直接运行所有工具调用。\nCtrl+O 直接切换自动批准。"
actions.toggle_tasks.label: "任务"
actions.toggle_tasks.description: "切换任务面板"
actions.toggle_tasks.long_help: "显示或隐藏任务面板,列出后台任务及其状态。\n用于监控或回到你用 Ctrl+B 送到后台的工作。\n侧面板;关闭以腾出宽度。"
actions.toggle_todos.label: "待办"
actions.toggle_todos.description: "切换待办面板"
actions.toggle_todos.long_help: "显示或隐藏待办面板:代理当前工作的实时任务清单。\n回合进行中查看它计划做什么以及还剩什么。\n侧面板;关闭以腾出宽度。"
actions.toggle_queue.label: "队列"
actions.toggle_queue.description: "切换提示词队列"
actions.toggle_queue.long_help: "显示或隐藏提示词队列。\n队列让你在回合进行中排队后续提示词,代理完成后会自动发送。\n本地 macOS VS Code 系:Ctrl+4 主键(Ctrl+; / Ctrl+' 备选)。其他终端:Ctrl+;,备选 Ctrl+'。"
actions.open_sessions.label: "会话"
actions.open_sessions.description: "打开会话"
actions.open_sessions.long_help: "打开会话浏览器,恢复或切换历史对话。\n选择一个即可重新接入其完整历史。\n不同于代理仪表盘(Ctrl+\\),后者同时管理多个存活代理。"
actions.open_extensions.label: "扩展"
actions.open_extensions.description: "打开扩展"
actions.open_extensions.long_help: "打开 MCP 服务器和插件的扩展管理器:查看已连接的内容和它们新增的工具。\n用于确认集成是否加载,或浏览可用工具。\n与设置不同,设置存放的是通用应用选项。"
actions.send_to_background.label: "转到后台"
actions.send_to_background.description: "将运行中的任务转到后台"
actions.send_to_background.long_help: "将前台运行中的 Execute 分离,让它在后台继续工作,你可以继续阅读、排队提示词或开始其他工作。\n在任务面板(Ctrl+G)中跟踪和恢复它。\n只有前台 Execute 真的在运行时才有意义。"
actions.interject_prompt.label: "立即发送"
actions.interject_prompt.description: "运行中立即发送(取消当前回合)"
actions.interject_prompt.long_help: "在回合中向代理发送消息而不取消它(插话),让它继续工作的同时你可以引导或补充上下文。\n回合运行时按普通 Enter 会排队追问;此组合键则把输入框内容合并进当前回合。\n输入框为空时,裸 Enter(或此组合键)会强制立即发送队首的追问 —— 无需聚焦队列面板。在队列面板上,此组合键强制发送选中行。\n用于在不丢失回合进度的情况下纠正方向。"
actions.enable_voice_mode.label: "语音模式"
actions.enable_voice_mode.description: "开始语音听写(Ctrl+Space / F8)"
actions.voice_toggle.label: "麦克风"
actions.voice_toggle.description: "语音听写(Ctrl+Space / F8)"
actions.voice_toggle.long_help: "听写的麦克风捕获,绑定到 Ctrl+Space(或 F8 —— 在 Ctrl+Space 被占用的地方很方便,比如 macOS 输入法切换;笔记本上用 Fn+F8)。\n行为跟随“语音捕获”设置:切换(按一下开始,再按一下停止)或按住说话(按住录音,松开停止),按住说话需要 Kitty 协议终端,其他地方回退为切换。`/voice` 在任何地方都可切换。\n语音会直接转写进输入框。"
actions.toggle_multiline.label: "多行"
actions.toggle_multiline.description: "切换多行输入"
actions.toggle_multiline.long_help: "切换持久多行输入框,让编辑器保持展开以编写更长的消息。\n用 Shift+Enter 或 Alt+Enter 插入换行(或行尾反斜杠);裸 Enter 仍然发送。\nCtrl+M 在输入框中切换多行;不在输入框时打开模型选择器。"
actions.bash_mode.label: "shell"
actions.bash_mode.description: "Shell 模式(空输入框输入 !)"
actions.bash_mode.long_help: "不离开聊天就运行 shell 命令:在空输入框开头输入 !,然后输入命令。\n命令输出会捕获到滚动记录中。\n删除开头的 ! 回到普通输入框。"
actions.toggle_yolo.label: "yolo"
actions.toggle_yolo.description: "切换总是批准"
actions.toggle_yolo.long_help: "为本会话开关自动批准(YOLO)。\n开启时,代理运行每个工具调用(编辑、shell、删除)都无需逐条确认。\n与 Shift+Tab 循环中的“总是批准”是同一状态;请谨慎使用。"
actions.new_session.label: "新建"
actions.new_session.description: "新会话"
actions.new_session.long_help: "以空的滚动记录和上下文开始全新会话。\n需要确认:连按两次(第一次预备,第二次开始),\n以免误删当前对话。"
actions.quit.label: "退出"
actions.quit.description: "退出"
actions.quit.long_help: "退出应用。需要确认:快速连按两次;\n单独按一次会被视为误触而忽略。\n绑定到 Ctrl+Q,别名为 Ctrl+D(Ctrl+D 在 VS Code 终端中是主键)。"
actions.command_palette.label: "命令"
actions.command_palette.description: "命令面板"
actions.command_palette.long_help: "模糊搜索每个动作和斜杠命令,然后按名称运行。\n不记得键位绑定时很好用。\n滚动记录聚焦时按 ? 也可打开。"
actions.shortcuts_help.label: "快捷键"
actions.shortcuts_help.description: "键盘快捷键"
actions.shortcuts_help.long_help: "打开本键盘速查表。\n用 j/k 浏览,按 e 展开行内帮助,或按 Enter 查看快捷键的完整详情页。\n同时绑定到 Ctrl+. 和 Ctrl+X;底部栏会显示你终端 reliably 发送的那个。"
actions.model_picker.label: "模型"
actions.model_picker.description: "选择模型"
actions.model_picker.long_help: "打开模型选择器,切换本会话使用的模型;选择对之后的回合生效。\n绑定到 Ctrl+M,但当输入框聚焦时该组合键会切换多行输入。\n可从滚动记录或命令面板进入。"
actions.open_settings.label: "设置"
actions.open_settings.description: "打开设置面板"
actions.open_dashboard.label: "仪表盘"
actions.open_dashboard.description: "打开代理仪表盘"
actions.open_dashboard.long_help: "打开代理仪表盘:列出你所有运行中和最近的代理,便于监控和切换。\n从任何地方都可打开,包括欢迎界面和会话内部。\n在那里你可以派发、接入、停止、分组和排序代理。"
actions.dashboard_select_next.label: "下一个"
actions.dashboard_select_next.description: "选择下一行"
actions.dashboard_select_prev.label: "上一个"
actions.dashboard_select_prev.description: "选择上一行"
actions.dashboard_toggle_pin.label: "置顶"
actions.dashboard_toggle_pin.description: "置顶 / 取消置顶代理"
actions.dashboard_toggle_pin.long_help: "置顶或取消置顶选中的代理,使其无论排序或分组都保持在列表顶部。\n在其他代理来来往往时,让你关心的代理保持在视野内。\n置顶状态会跨仪表盘会话保留。"
actions.dashboard_begin_rename.label: "重命名"
actions.dashboard_begin_rename.description: "重命名代理"
actions.dashboard_stop.label: "停止"
actions.dashboard_stop.description: "停止 / 关闭代理"
actions.dashboard_stop.long_help: "停止选中的代理并将其从仪表盘移除;运行中的回合会先被中断。\n用于清理已完成或不需要的代理,无需接入它们。\n覆盖层中的等价操作(Ctrl+X)会在停止前确认。"
actions.dashboard_cycle_mode.label: "模式"
actions.dashboard_cycle_mode.description: "循环派发模式"
actions.dashboard_cycle_mode.long_help: "循环你从仪表盘启动代理的派发模式:普通、计划,然后总是批准。\n计划模式让新代理先规划再改文件;总是批准不提示直接运行其工具。\n与会话内 Shift+Tab 循环对应,应用于新的派发。"
actions.dashboard_toggle_grouping.label: "分组"
actions.dashboard_toggle_grouping.description: "切换行分组"
actions.dashboard_toggle_grouping.long_help: "在扁平列表和按状态分组(如工作中与空闲)之间切换仪表盘。\n分组让需要关注的代理浮现出来;扁平列表保持稳定顺序。\n你的选择会跨会话保留。"
actions.dashboard_reorder_up.label: "上移"
actions.dashboard_reorder_up.description: "将代理上移"
actions.dashboard_reorder_down.label: "下移"
actions.dashboard_reorder_down.description: "将代理下移"
actions.dashboard_shortcuts_help.label: "快捷键"
actions.dashboard_shortcuts_help.description: "显示快捷键覆盖层"
actions.dashboard_exit.label: "退出"
actions.dashboard_exit.description: "关闭仪表盘"
actions.dashboard_exit.long_help: "关闭仪表盘并回到你之前的位置。\nEsc 是级联的:先关闭打开的预览或清除激活的过滤器,没有待处理项时才退出。\n将此动作重绑到其他键可直接退出。"
actions.dashboard_toggle_auto_approve.label: "总是批准"
actions.dashboard_toggle_auto_approve.description: "切换总是批准"
actions.dashboard_toggle_auto_approve.long_help: "在仪表盘上直接切换选中代理的自动批准(YOLO),无需接入它。\n开启时,该代理运行每个工具调用都无需逐条确认。\n会话内的等价操作是 Ctrl+O。"
actions.dashboard_open_location_picker.label: "位置"
actions.dashboard_open_location_picker.description: "更改新代理的工作目录"
actions.dashboard_open_location_picker.long_help: "打开选择器,设置新派发的仪表盘代理的工作目录。\n不离开仪表盘即可对不同的仓库或文件夹启动代理。\n只影响新派发,不影响已在运行的代理。"
actions.dashboard_toggle_worktree.label: "worktree"
actions.dashboard_toggle_worktree.description: "为新代理切换 worktree 模式"
actions.dashboard_toggle_worktree.long_help: "让下一个仪表盘派发的代理在新的 git worktree 中生成,将其工作隔离在单独的检出中。\n仅当工作目录是 git 仓库时适用。\n只影响新派发的代理,不影响已在运行的代理。"
actions.dashboard_overlay_exit.label: "关闭覆盖层"
actions.dashboard_overlay_exit.description: "返回仪表盘"
actions.dashboard_overlay_exit.long_help: "离开接入的会话覆盖层并返回仪表盘列表,不停止代理。\n也可通过滚动记录上的 q、中性 Esc 或关闭按钮触发。\n要停止代理而不仅是断开,请用 Ctrl+X。"
actions.dashboard_overlay_prev.label: "上个会话"
actions.dashboard_overlay_prev.description: "上一个会话"
actions.dashboard_overlay_next.label: "下个会话"
actions.dashboard_overlay_next.description: "下一个会话"
actions.dashboard_overlay_stop.label: "停止"
actions.dashboard_overlay_stop.description: "停止代理,关闭会话(返回仪表盘)"
actions.dashboard_overlay_stop.long_help: "在会话覆盖层内,停止接入的代理并关闭它,返回到仪表盘列表。\n需要确认:连按两次 Ctrl+X。\nCtrl+. 在这里仍可打开速查表;只有 Ctrl+X 被停止占用。"
actions.edit_prompt_external.label: "编辑提示词"
actions.edit_prompt_external.description: "在外部编辑器中编辑提示词"
actions.edit_prompt_external.long_help: "在 $VISUAL 或 $EDITOR 中打开当前提示词草稿,两者都未设置时回退到 vi。\n保存并关闭编辑器会把更新后的文本带回输入框;不会发送提示词。\n在极简模式下可用于普通无附件草稿。"
actions.toggle_mouse_capture.label: "鼠标上报"
actions.toggle_mouse_capture.description: "切换鼠标上报(原生复制/粘贴)"

