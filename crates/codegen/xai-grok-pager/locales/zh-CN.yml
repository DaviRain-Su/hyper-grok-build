settings.scroll_mode.choice.wheel.display: "鼠标滚轮"
settings.scroll_mode.choice.wheel.description: "始终按滚轮刻度处理滚动(每格固定行数)。"
settings.scroll_mode.choice.trackpad.display: "触控板"
settings.scroll_mode.choice.trackpad.description: "始终按触控板处理滚动(小数累积)。"
settings.scroll_lines.label: "滚动行数"
settings.scroll_lines.description: "滚轮和触控板每格滚动的行数(1-10)。未设置时使用各终端自己的配置。"
settings.invert_scroll.label: "反转滚动"
settings.invert_scroll.description: "反转垂直滚动方向(自然滚动)。"
settings.keep_text_selection.label: "文本选择"
settings.keep_text_selection.description: "应用内选择在屏幕上保留的时长,以及双击的行为(折叠 vs 选择并复制单词)。使用终端或复用器自己的选择时,拖动时按住 Shift(原生复制)。"
settings.keep_text_selection.choice.flash.display: "复制后闪现"
settings.keep_text_selection.choice.flash.description: "鼠标松开时短暂高亮,然后清除。双击切换折叠。默认。"
settings.keep_text_selection.choice.hold.display: "保持到取消"
settings.keep_text_selection.choice.hold.description: "保持选择可见,直到 Esc、点击或滚动。双击切换折叠。"
settings.keep_text_selection.choice.word_select.display: "词语选择(类终端)"
settings.keep_text_selection.choice.word_select.description: "双击选择并复制单词,三击选择一行;选择保持到取消。"
settings.coding_data_sharing.label: "编码数据共享"
settings.coding_data_sharing.description: "控制 SpaceXAI 是否可保留编码会话数据并用于训练。不影响产品分析;详见配置与监控文档。"
settings.coding_data_sharing.choice.opt-in.display: "加入"
settings.coding_data_sharing.choice.opt-in.description: "允许 SpaceXAI 保留编码会话数据,用于模型训练和产品改进。"
settings.coding_data_sharing.choice.opt-out.display: "退出"
settings.coding_data_sharing.choice.opt-out.description: "不保留编码会话数据用于训练。不会禁用产品分析。"
settings.default_selected_permission.label: "默认选中权限项"
settings.default_selected_permission.description: "权限提示中光标预先选中的行。"
settings.default_selected_permission.choice.always_allow_all_sessions.display: "在所有会话中总是允许"
