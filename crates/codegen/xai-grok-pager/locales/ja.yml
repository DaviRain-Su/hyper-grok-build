mode.plan: "プラン"
mode.auto: "自動"
mode.normal: "通常"
mode.always_approve: "常に承認"
hints.type_comment: "コメントを入力..."
hints.reply_placeholder: "返信…"
hints.new_in_worktree: "worktree で新規作成"
hints.close_session: "このセッションを閉じる"
hints.clear: "クリア"
