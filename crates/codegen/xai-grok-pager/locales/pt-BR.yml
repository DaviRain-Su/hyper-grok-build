# ── Catálogo de configurações (settings/defs.rs) ────────────────────────────
settings.compact_mode.label: "Modo compacto"
settings.compact_mode.description: "Reduz o espaçamento ao redor das mensagens para maior densidade de conteúdo. Ativado automaticamente quando o terminal tem 20 linhas ou menos."
settings.screen_mode.label: "Modo de tela padrão"
settings.screen_mode.description: "Como o grok abre da próxima vez: Tela cheia (padrão quando não definido) ou Minimal. Grava [ui] screen_mode em config.toml. Requer reinício. Para alternar apenas esta sessão, use /minimal ou /fullscreen."
settings.screen_mode.choice.fullscreen.display: "Tela cheia"
settings.screen_mode.choice.fullscreen.description: "Abre o grok no TUI padrão em tela cheia. Padrão quando não definido."
settings.screen_mode.choice.minimal.display: "Minimal"
settings.screen_mode.choice.minimal.description: "Abre o grok no modo nativo de histórico (minimal)."
settings.show_timestamps.label: "Mostrar marcas de tempo"
settings.show_timestamps.description: "Mostra a hora do relógio ao lado das mensagens do usuário e das respostas do agente."
settings.show_timeline.label: "Barra lateral de linha do tempo"
settings.show_timeline.description: "Trilho de marcações por turno no lugar da barra de rolagem: passe o mouse para pré-visualizar um turno, clique para pular até ele."
settings.page_flip_on_send.label: "Fixar prompt no topo ao enviar"
settings.page_flip_on_send.description: "Ao enviar um prompt, rola-o para o topo da tela para que a resposta comece em uma nova página (padrão). Desligue para manter a posição de rolagem ao enviar."
settings.combine_queued_prompts.label: "Combinar prompts na fila"
settings.combine_queued_prompts.description: "Mescla seguimentos simples consecutivos em um único turno do modelo (o TUI ainda mostra um balão para cada). Interrompe em bash, comandos com barra, cron, habilidades expandidas, imagens de seguimento ou linha em edição. Padrão desligado; aplica-se em drain local e shell promote."
settings.simple_mode.label: "Desativar modo de entrada vim"
settings.simple_mode.description: "Usa entrada simples no estilo readline em vez de teclas vim no prompt. Experimental."
settings.vim_mode.label: "Navegação de histórico em vim"
settings.vim_mode.description: "Ativa teclas vim (h/j/k/l, gg/G, /) para navegar no histórico. Não afeta o prompt de entrada."
settings.theme.label: "Tema"
settings.theme.description: "Tema de cores da interface do pager."
