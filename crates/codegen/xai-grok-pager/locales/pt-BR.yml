settings.permission_mode.label: "Modo de permissão"
settings.permission_mode.description: "Default usa o comportamento embutido do agente; Ask pergunta a cada ação de ferramenta; Auto usa um classificador LLM para ferramentas arriscadas; Always approve concede todas as permissões automaticamente."
settings.permission_mode.choice.default.display: "Padrão"
settings.permission_mode.choice.default.description: "Usa o comportamento padrão de permissão do agente (atualmente equivalente a Ask)."
settings.permission_mode.choice.ask.display: "Perguntar"
settings.permission_mode.choice.ask.description: "Pede permissão antes de ações de ferramenta."
settings.permission_mode.choice.auto.display: "Automático"
settings.permission_mode.choice.auto.description: "Classificador LLM aprova ferramentas seguras; ações perigosas ainda podem perguntar ou ser negadas."
settings.permission_mode.choice.always-approve.display: "Sempre aprovar"
settings.permission_mode.choice.always-approve.description: "Aprova automaticamente toda ação de ferramenta. Ignora TODOS os pedidos de permissão."
settings.remember_tool_approvals.label: "Lembrar aprovações de ferramenta"
settings.remember_tool_approvals.description: "Mostra opções \"Sempre permitir\" nos pedidos de permissão para que você não seja questionado novamente sobre um comando ou ferramenta específica. Aplica-se em ask e auto; Always-approve ainda ignora todos os pedidos. Requer reinício."
settings.multiline_mode.label: "Multilinha"
settings.multiline_mode.description: "Ligado, Enter insere uma nova linha e Shift+Enter envia. Redefinido a cada sessão."
settings.default_model.label: "Modelo padrão"
settings.default_model.description: "Modelo usado em novas sessões. Alterar isso também troca a sessão ativa. Escolha `(não sobrescrito)` para limpar."
settings.max_thoughts_width.label: "Largura máxima das reflexões"
settings.max_thoughts_width.description: "Orçamento de largura de coluna para o painel de reflexões do agente (40-500, padrão 120)."
settings.show_thinking_blocks.label: "Mostrar blocos de reflexão"
settings.show_thinking_blocks.description: "Mostra blocos de reflexão/raciocínio do agente no histórico durante o streaming."
settings.prompt_suggestions.label: "Sugestões de prompt"
settings.prompt_suggestions.description: "Após cada turno, prevê seu próximo prompt provável e o mostra como texto fantasma na entrada (Tab para aceitar). Usa uma chamada de modelo pequena por turno."
settings.respect_manual_folds.label: "Respeitar recolhas manuais"
settings.respect_manual_folds.description: "Mantém blocos recolhidos manualmente como estão durante o streaming e para a rolagem automática ao expandir um bloco. Experimental."
settings.group_tool_verbs.label: "Agrupar chamadas de ferramenta"
settings.group_tool_verbs.description: "Recolhe chamadas consecutivas de leitura/busca/listagem e linhas de subagente em uma linha de resumo; reflexões concluídas também se juntam ao grupo."
settings.collapsed_edit_blocks.label: "Recolher blocos de edição"
settings.collapsed_edit_blocks.description: "Mostra edições como resumos diffstat de uma linha +N/-M e mescla edições consecutivas no mesmo arquivo em um bloco; expanda uma linha para ver os diffs."
settings.display_refresh_auto_cadence.label: "Igualar taxa de atualização do monitor"
settings.display_refresh_auto_cadence.description: "Em monitores de alta taxa de atualização, o TUI fará streaming/rolagem mais rápido para acompanhar o monitor. Desligado mantém o ritmo clássico de ~60 Hz. Requer reinício."
settings.scroll_speed.label: "Velocidade de rolagem"
settings.scroll_speed.description: "Multiplicador de velocidade de rolagem do mouse e trackpad (1-100). Maior = mais rápido."
settings.scroll_mode.label: "Entrada de rolagem"
settings.scroll_mode.description: "Força o comportamento de rolagem por roda ou trackpad quando a detecção automática interpreta mal seu dispositivo."
settings.scroll_mode.choice.auto.display: "Detectar automaticamente"
settings.scroll_mode.choice.auto.description: "Detecta roda versus trackpad por gesto a partir do tempo dos eventos. Padrão."
settings.scroll_mode.choice.wheel.display: "Roda do mouse"
settings.scroll_mode.choice.wheel.description: "Sempre trata a rolagem como entalhes da roda (linhas fixas por toque)."
settings.scroll_mode.choice.trackpad.display: "Trackpad"
settings.scroll_mode.choice.trackpad.description: "Sempre trata a rolagem como trackpad (acúmulo fracionário)."
settings.scroll_lines.label: "Linhas de rolagem"
settings.scroll_lines.description: "Linhas por toque de rolagem para roda e trackpad (1-10). Até definir, vale o perfil do próprio terminal."
settings.invert_scroll.label: "Inverter rolagem"
settings.invert_scroll.description: "Inverte a direção da rolagem vertical (rolagem natural)."
settings.keep_text_selection.label: "Seleção de texto"
settings.keep_text_selection.description: "Por quanto tempo a seleção no app permanece na tela e o que o duplo clique faz (recolher vs. selecionar e copiar uma palavra). Para a seleção do próprio terminal ou multiplexador, segure Shift ao arrastar (cópia nativa)."
settings.keep_text_selection.choice.flash.display: "Piscar após copiar"
settings.keep_text_selection.choice.flash.description: "Realce breve ao soltar o mouse, depois limpa. Duplo clique alterna recolha. Padrão."
settings.keep_text_selection.choice.hold.display: "Manter até descartar"
settings.keep_text_selection.choice.hold.description: "Mantém a seleção visível até Esc, clique ou rolagem. Duplo clique alterna recolha."
settings.keep_text_selection.choice.word_select.display: "Selecionar palavra (tipo terminal)"
settings.keep_text_selection.choice.word_select.description: "Duplo clique seleciona e copia uma palavra, triplo clique uma linha; a seleção permanece até ser descartada."
settings.coding_data_sharing.label: "Compartilhamento de dados de código"
settings.coding_data_sharing.description: "Controla se a SpaceXAI pode reter e treinar com dados de sessões de codificação. Não afeta a análise de produto; consulte a documentação de Configuração e Monitoramento."
settings.coding_data_sharing.choice.opt-in.display: "Participar"
settings.coding_data_sharing.choice.opt-in.description: "Permite que a SpaceXAI retenha dados de sessões de codificação para treinamento de modelo e melhoria do produto."
settings.coding_data_sharing.choice.opt-out.display: "Não participar"
settings.coding_data_sharing.choice.opt-out.description: "Não retém dados de sessões de codificação para treinamento. Não desativa a análise de produto."
settings.default_selected_permission.label: "Permissão selecionada por padrão"
settings.default_selected_permission.description: "Qual linha o cursor pré-seleciona nos pedidos de permissão."
settings.default_selected_permission.choice.always_allow_all_sessions.display: "Sempre permitir em todas as sessões"
settings.default_selected_permission.choice.allow_command_always.display: "Sempre permitir este comando"
settings.default_selected_permission.choice.allow_once.display: "Permitir uma vez"
settings.default_selected_permission.choice.reject.display: "Recusar"
settings.toolset.ask_user_question.timeout_enabled.label: "Tempo limite da pergunta"
settings.toolset.ask_user_question.timeout_enabled.description: "Ligado, a ferramenta ask_user_question expira após um tempo definido em vez de bloquear indefinidamente."
settings.plan_mode.label: "Modo de planejamento"
settings.plan_mode.description: "Ligado, o agente resume um plano antes de executar ferramentas ou fazer edições."
settings.plan_mode.choice.off.display: "Desligado"
settings.plan_mode.choice.off.description: "O agente executa ferramentas e edita arquivos diretamente (padrão)."
settings.plan_mode.choice.on.display: "Ligado"
settings.plan_mode.choice.on.description: "O agente resume um plano e pede aprovação antes de executar ferramentas."
settings.show_tips.label: "Mostrar dicas"
settings.show_tips.description: "Mostra o banner de dica do dia na inicialização. Requer reinício."
settings.contextual_hints.label: "Mostrar dicas contextuais"
settings.contextual_hints.description: "Mostra dicas curtas de teclado no contexto enquanto você trabalha; ative cada uma individualmente."
settings.auto_update.label: "Atualização automática"
settings.auto_update.description: "Baixa e instala automaticamente atualizações do pager na inicialização. Requer reinício."
settings.hunk_tracker_mode.label: "Rastreador de hunk"
settings.hunk_tracker_mode.description: "Quais alterações de arquivo o agente rastreia como hunks. Desligado desativa o rastreamento (e estatísticas de LOC) totalmente. Requer reinício."
settings.hunk_tracker_mode.choice.agent_only.display: "Apenas agente"
settings.hunk_tracker_mode.choice.agent_only.description: "Rastreia apenas os arquivos que o agente edita (padrão)."
settings.hunk_tracker_mode.choice.all_dirty.display: "Todos os alterados"
settings.hunk_tracker_mode.choice.all_dirty.description: "Rastreia todos os arquivos modificados pelo git, incluindo edições externas."
settings.hunk_tracker_mode.choice.off.display: "Desligado"
settings.hunk_tracker_mode.choice.off.description: "Desativa totalmente o rastreamento de hunks. Também desativa o rastreamento de LOC."
settings.voice_capture_mode.label: "Captura de voz"
settings.voice_capture_mode.description: "Como a tecla de voz (Ctrl+Space / F8) se comporta: Alternar (pressione para iniciar/parar) ou Pressionar para falar (segure para gravar, solte para parar; requer terminal com protocolo Kitty)."
settings.voice_capture_mode.choice.toggle.display: "Alternar"
settings.voice_capture_mode.choice.toggle.description: "Ctrl+Space / F8 inicia a ditado; pressione novamente (ou Esc/Enter) para parar."
settings.voice_capture_mode.choice.hold.display: "Pressionar para falar"
settings.voice_capture_mode.choice.hold.description: "Segure Ctrl+Space / F8 para gravar, solte para parar. Requer terminal com protocolo Kitty."
settings.voice_stt_language.label: "Idioma da voz"
settings.voice_stt_language.description: "Idioma de speech-to-text para ditado por voz (Grok STT). Inglês por padrão; Sistema usa seu idioma do sistema quando suportado. Define o idioma de formatação de números e moedas."
settings.voice_stt_language.choice.auto.display: "Sistema"
settings.voice_stt_language.choice.auto.description: "Usa o idioma do sistema quando for um idioma STT suportado; caso contrário, inglês."
