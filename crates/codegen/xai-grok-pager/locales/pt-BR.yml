actions.scroll_up.label: "rolar acima"
actions.scroll_up.description: "Rolar uma linha para cima"
actions.scroll_down.label: "rolar abaixo"
actions.scroll_down.description: "Rolar uma linha para baixo"
actions.half_page_up.label: "meia página acima"
actions.half_page_up.description: "Rolar meia página para cima"
actions.half_page_down.label: "meia página abaixo"
actions.half_page_down.description: "Rolar meia página para baixo"
actions.page_up.label: "página acima"
actions.page_up.description: "Rolar uma página para cima"
actions.page_down.label: "página abaixo"
actions.page_down.description: "Rolar uma página para baixo"
actions.collapse.label: "recolher"
actions.collapse.description: "Recolher o item selecionado"
actions.expand.label: "recolher"
actions.expand.description: "Expandir o item selecionado"
actions.toggle_fold.label: "recolher"
actions.toggle_fold.description: "Expandir / recolher"
actions.toggle_fold.long_help: "Recolhe ou expande o item de histórico selecionado para ocultar ou mostrar seu conteúdo completo.\nÚtil para percorrer saídas longas de ferramenta ou raciocínio.\nRelacionado: E recolhe/expande todos os itens, Ctrl+E alterna todos os blocos de reflexão."
actions.toggle_expand_all.label: "tudo"
actions.toggle_expand_all.description: "Expandir tudo / recolher tudo"
actions.toggle_expand_all.long_help: "Recolhe ou expande todos os itens do histórico de uma vez, ao contrário de e, que alterna apenas a linha selecionada.\nRecolha um histórico longo para examinar os cabeçalhos, depois expanda tudo de volta.\nBlocos de reflexão têm seu próprio alternador, Ctrl+E."
actions.expand_all_thinking.label: "expandir/recolher reflexão"
actions.expand_all_thinking.description: "Alternar todos os blocos de reflexão"
actions.expand_all_thinking.long_help: "Mostra ou oculta os blocos de raciocínio (reflexão) do agente em todo o histórico com uma tecla.\nRevele como o agente chegou a uma resposta, ou oculte o raciocínio para focar nos resultados.\nDiferente de E, que recolhe todo tipo de item."
actions.toggle_raw.label: "bruto"
actions.toggle_raw.description: "Alternar markdown bruto"
actions.toggle_raw.long_help: "Alterna o item selecionado entre markdown renderizado e seu texto-fonte bruto.\nUse para copiar markdown exato, inspecionar um destino de link ou ver formatação oculta pelo renderizador.\nPressione novamente para voltar à visão renderizada."
actions.copy_block_content.label: "copiar"
actions.copy_block_content.description: "Copiar conteúdo"
actions.copy_block_content.long_help: "Copia o conteúdo do bloco selecionado para a área de transferência: texto da mensagem, saída completa da ferramenta ou conteúdo de um bloco de código.\nDisponível apenas em blocos que suportam cópia.\nPara copiar só o comando ou caminho do arquivo, use Y."
actions.copy_block_meta.label: "copiar cmd"
actions.copy_block_meta.description: "Copiar comando / caminho"
actions.copy_block_meta.long_help: "Copia apenas o identificador do bloco: a linha de comando de uma chamada de ferramenta ou o caminho de um bloco de arquivo, sem o conteúdo.\nÚtil para reexecutar um comando ou colar um caminho em outro lugar.\nUse y minúsculo para copiar o conteúdo completo."
actions.open_block_viewer.label: "ver"
actions.open_block_viewer.description: "Abrir no visualizador"
actions.open_block_viewer.long_help: "Abre o bloco selecionado em um visualizador em tela cheia focado e rolável.\nIdeal para saídas longas de ferramenta, arquivos grandes ou código que você quer ler fora do fluxo da conversa.\nEsc retorna à conversa."
actions.open_next_link.label: "link"
actions.open_next_link.description: "Próximo link"
actions.open_prev_link.label: "link"
actions.open_prev_link.description: "Link anterior"
actions.rewind.label: "retroceder"
actions.rewind.description: "Retroceder até o turno selecionado"
actions.rewind.long_help: "Retrocede a conversa até um turno anterior, restaurando o snapshot dos arquivos daquele momento e descartando alterações posteriores.\nEscolha um turno na lista e o que restaurar (tudo, só conversa ou só arquivos); um turno em execução é oferecido para cancelamento primeiro, e quaisquer conflitos ou erros são relatados após a execução.\nDestrutivo: turnos posteriores são descartados.\nTambém acessível em idle com prompt vazio via Esc Esc (dentro de 800ms), igual a `/rewind`."
actions.kill_bg_task.label: "encerrar"
actions.kill_bg_task.description: "Encerrar tarefa em segundo plano"
actions.kill_bg_task.long_help: "Encerra a tarefa em segundo plano pertencente ao bloco de tarefas selecionado (ex.: um comando shell longo enviado ao segundo plano).\nUse para parar um processo descontrolado ou não mais necessário.\nAplica-se apenas a uma tarefa ativa; tarefas concluídas não são afetadas."
actions.send_prompt.label: "enviar"
actions.send_prompt.description: "Enviar"
actions.focus_prompt.label: "prompt"
actions.focus_prompt.description: "Focar prompt"
actions.focus_scrollback.label: "histórico"
actions.focus_scrollback.description: "Focar histórico"
actions.focus_scrollback.long_help: "Move o foco do prompt para o histórico para que você possa navegar pela conversa.\nTab funciona tanto no modo simples quanto no vim de histórico.\nEsc é reservado para a política de limpar / retroceder (idle), não para foco."
actions.cancel_turn.label: "cancelar"
actions.cancel_turn.description: "Cancelar turno"
actions.cancel_turn.long_help: "Interrompe o turno atual do agente e para a geração, mantendo a sessão aberta.\nCtrl+C cancela quando o prompt está vazio; com um rascunho não vazio, ele limpa o prompt primeiro e deixa o turno em execução.\nEle para o turno, não o app; use o atalho de sair para encerrar."
actions.cycle_mode.label: "modo"
actions.cycle_mode.description: "Alternar modo (Normal / Plano / Sempre aprovar)"
actions.cycle_mode.long_help: "Percorre o modo da sessão: Normal -> Plano -> Sempre aprovar -> Normal.\nPlano mantém o agente planejando primeiro e não grava arquivos; Sempre aprovar executa toda chamada de ferramenta sem perguntar.\nCtrl+O alterna a aprovação automática diretamente."
actions.toggle_tasks.label: "tarefas"
actions.toggle_tasks.description: "Alternar painel de tarefas"
actions.toggle_tasks.long_help: "Mostra ou oculta o painel de tarefas, que lista tarefas em segundo plano e seus status.\nUse para monitorar ou voltar ao trabalho que você enviou ao segundo plano com Ctrl+B.\nUm painel lateral; desligue para recuperar largura."
actions.toggle_todos.label: "afazeres"
actions.toggle_todos.description: "Alternar painel de afazeres"
actions.toggle_todos.long_help: "Mostra ou oculta o painel de afazeres: a lista de tarefas ao vivo do agente para o trabalho atual.\nAcompanhe o que ele planeja fazer e o que falta enquanto o turno executa.\nUm painel lateral; desligue-o para recuperar largura."
actions.toggle_queue.label: "fila"
actions.toggle_queue.description: "Alternar fila de prompts"
actions.toggle_queue.long_help: "Mostra ou oculta a fila de prompts.\nA fila permite encadear prompts de seguimento enquanto um turno executa; cada um é enviado automaticamente quando o agente termina.\nFamília VS Code local no macOS: Ctrl+4 principal (Ctrl+; / Ctrl+' como alternativas). Nos demais, Ctrl+; com Ctrl+' como alternativa."
actions.open_sessions.label: "sessões"
actions.open_sessions.description: "Abrir sessões"
actions.open_sessions.long_help: "Abre o navegador de sessões para retomar ou alternar entre conversas anteriores.\nSelecione uma para se reconectar ao seu histórico completo.\nDiferente do Painel de Agentes (Ctrl+\\), que gerencia vários agentes ativos ao mesmo tempo."
actions.open_extensions.label: "extensões"
actions.open_extensions.description: "Abrir extensões"
actions.open_extensions.long_help: "Abre o gerenciador de extensões para servidores MCP e plugins: veja o que está conectado e as ferramentas que eles adicionam.\nUse para confirmar se uma integração carregou ou navegar pelas ferramentas disponíveis.\nDistinto das configurações, que guardam opções gerais do app."
actions.send_to_background.label: "2º plano"
actions.send_to_background.description: "Enviar tarefa em execução ao segundo plano"
actions.send_to_background.long_help: "Desanexa o Execute em primeiro plano para que continue em segundo plano enquanto você lê, enfileira prompts ou inicia outra coisa.\nAcompanhe e retome-o pelo painel de tarefas (Ctrl+G).\nSó faz sentido enquanto um Execute em primeiro plano está de fato em execução."
actions.interject_prompt.label: "enviar agora"
actions.interject_prompt.description: "Enviar agora durante a execução (cancela o turno atual)"
actions.interject_prompt.long_help: "Envia uma mensagem ao agente no meio do turno sem cancelá-lo (interject), para que você possa orientar ou adicionar contexto enquanto ele continua trabalhando.\nEnter comum durante um turno enfileira um seguimento para depois; esta tecla mescla o texto do compositor no turno atual.\nCom o compositor vazio, Enter puro (ou esta tecla) envia à força o seguimento no topo da fila do prompt — sem precisar focar o painel da fila. No painel da fila, esta tecla envia à força a linha selecionada.\nUse para corrigir o rumo sem perder o progresso do turno."
actions.enable_voice_mode.label: "modo voz"
actions.enable_voice_mode.description: "Iniciar ditado por voz (Ctrl+Space / F8)"
actions.voice_toggle.label: "microfone"
actions.voice_toggle.description: "Ditado por voz (Ctrl+Space / F8)"
actions.voice_toggle.long_help: "Captura de microfone para ditado, vinculada a Ctrl+Space (ou F8 — útil onde Ctrl+Space está ocupado, ex.: alternância de idioma no macOS; use Fn+F8 no notebook).\nO comportamento segue a configuração de Captura de voz: alternar (pressione para iniciar, pressione novamente para parar) ou pressionar para falar (segure para gravar, solte para parar), onde segurar requer um terminal com protocolo Kitty e recai para alternar nos demais. `/voice` alterna em qualquer lugar.\nA fala é transcrita direto no prompt."
actions.toggle_multiline.label: "multilinha"
actions.toggle_multiline.description: "Alternar multilinha"
actions.toggle_multiline.long_help: "Alterna um prompt multilinha persistente para que o editor fique expandido para compor mensagens mais longas.\nInsira novas linhas com Shift+Enter ou Alt+Enter (ou uma barra invertida ao final); Enter puro continua enviando.\nCtrl+M alterna multilinha no prompt; fora do prompt, abre o seletor de modelo."
actions.bash_mode.label: "shell"
actions.bash_mode.description: "Modo shell (digite ! no prompt vazio)"
actions.bash_mode.long_help: "Executa um comando shell sem sair do chat: digite ! no início de um prompt vazio, depois o comando.\nA saída do comando é capturada no histórico.\nApague o ! inicial para voltar a um prompt normal."
actions.toggle_yolo.label: "yolo"
actions.toggle_yolo.description: "Alternar sempre aprovar"
actions.toggle_yolo.long_help: "Liga ou desliga a aprovação automática (YOLO) para esta sessão.\nLigado, o agente executa toda chamada de ferramenta (edições, shell, exclusões) sem confirmação por ação.\nMesmo estado do ciclo Shift+Tab \"Sempre aprovar\"; use com cuidado."
actions.new_session.label: "nova"
actions.new_session.description: "Nova sessão"
actions.new_session.long_help: "Inicia uma sessão nova com histórico e contexto vazios.\nRequer confirmação: pressione duas vezes (a primeira arma, a segunda inicia)\npara não descartar a conversa atual por acidente."
actions.quit.label: "sair"
actions.quit.description: "Sair"
actions.quit.long_help: "Encerra o app. Requer confirmação: pressione duas vezes em sucessão rápida;\numa pressão isolada é tratada como toque errado e ignorada.\nVinculado a Ctrl+Q, com Ctrl+D como alias (Ctrl+D é principal no terminal do VS Code)."
actions.command_palette.label: "comandos"
actions.command_palette.description: "Paleta de comandos"
actions.command_palette.long_help: "Busca fuzzy por toda ação e comando com barra, depois executa por nome.\nÚtil quando você não lembra de um atalho de teclado.\nTambém abre com ? quando o histórico está focado."
actions.shortcuts_help.label: "atalhos"
actions.shortcuts_help.description: "Atalhos de teclado"
actions.shortcuts_help.long_help: "Abre esta tabela de atalhos de teclado.\nNavegue com j/k, expanda a ajuda inline de uma linha com e, ou pressione Enter para a página de detalhes completa de um atalho.\nVinculado tanto a Ctrl+. quanto a Ctrl+X; a barra indica aquele que seu terminal envia de forma confiável."
actions.model_picker.label: "modelo"
actions.model_picker.description: "Escolher modelo"
actions.model_picker.long_help: "Abre o seletor de modelo para trocar o modelo desta sessão; a escolha se aplica aos turnos seguintes.\nVinculado a Ctrl+M, mas quando o prompt está focado essa tecla alterna a multilinha.\nAcesse-o pelo histórico ou pela paleta de comandos."
actions.open_settings.label: "configurações"
actions.open_settings.description: "Abrir o painel de configurações"
actions.toggle_mouse_capture.label: "relato de mouse"
actions.toggle_mouse_capture.description: "Alternar relato de mouse (copiar/colar nativo)"
actions.open_dashboard.label: "painel"
actions.open_dashboard.description: "Abrir o Painel de Agentes"
actions.open_dashboard.long_help: "Abre o Painel de Agentes: uma lista de todos os seus agentes em execução e recentes para monitorar e alternar.\nFunciona de qualquer lugar, incluindo a tela de boas-vindas e dentro de uma sessão.\nDe lá você pode despachar, anexar, parar, agrupar e reordenar agentes."
actions.dashboard_select_next.label: "próximo"
actions.dashboard_select_next.description: "Selecionar a próxima linha"
actions.dashboard_select_prev.label: "anterior"
actions.dashboard_select_prev.description: "Selecionar a linha anterior"
actions.dashboard_toggle_pin.label: "fixar"
actions.dashboard_toggle_pin.description: "Fixar / desfixar agente"
actions.dashboard_toggle_pin.long_help: "Fixa ou desfixa o agente selecionado para que ele permaneça no topo da lista independentemente da ordenação ou agrupamento.\nMantenha os agentes que você se importa à vista enquanto outros vão e vêm.\nFixações persistem entre sessões do painel."
actions.dashboard_begin_rename.label: "renomear"
actions.dashboard_begin_rename.description: "Renomear agente"
actions.dashboard_stop.label: "parar"
actions.dashboard_stop.description: "Parar / fechar agente"
actions.dashboard_stop.long_help: "Para o agente selecionado e remove sua linha do painel; um turno em execução é interrompido primeiro.\nUse para limpar agentes concluídos ou indesejados sem se anexar a eles.\nO equivalente na sobreposição (Ctrl+X) confirma antes de parar."
actions.dashboard_cycle_mode.label: "modo"
actions.dashboard_cycle_mode.description: "Alternar modo de despacho"
actions.dashboard_cycle_mode.long_help: "Percorre o modo de despacho para agentes que você lança pelo painel: Normal, Plano, depois Sempre aprovar.\nPlano faz novos agentes planejarem antes de alterar arquivos; Sempre aprovar executa suas ferramentas sem perguntar.\nEspelha o ciclo Shift+Tab dentro da sessão, aplicado a novos despachos."
actions.dashboard_toggle_grouping.label: "agrupar"
actions.dashboard_toggle_grouping.description: "Alternar agrupamento de linhas"
actions.dashboard_toggle_grouping.long_help: "Alterna o painel entre uma lista plana e linhas agrupadas por estado, como em execução versus ocioso.\nAgrupamento evidencia os agentes que precisam de atenção; a lista plana mantém uma ordem estável.\nSua escolha persiste entre sessões."
actions.dashboard_reorder_up.label: "mover acima"
actions.dashboard_reorder_up.description: "Reordenar agente para cima"
actions.dashboard_reorder_down.label: "mover abaixo"
actions.dashboard_reorder_down.description: "Reordenar agente para baixo"
actions.dashboard_shortcuts_help.label: "atalhos"
actions.dashboard_shortcuts_help.description: "Mostrar sobreposição de atalhos"
actions.dashboard_exit.label: "sair"
actions.dashboard_exit.description: "Fechar painel"
actions.dashboard_exit.long_help: "Fecha o painel e retorna de onde você estava.\nEsc é em cascata: primeiro descarta uma pré-visualização aberta ou limpa um filtro ativo, e só sai quando nada mais está pendente.\nReatribua esta ação a outra tecla para sair diretamente."
actions.dashboard_toggle_auto_approve.label: "sempre aprovar"
actions.dashboard_toggle_auto_approve.description: "Alternar sempre aprovar"
actions.dashboard_toggle_auto_approve.long_help: "Alterna a aprovação automática (YOLO) do agente selecionado direto no painel, sem se anexar a ele.\nLigado, esse agente executa toda chamada de ferramenta sem confirmação por ação.\nO equivalente por sessão é Ctrl+O dentro de uma sessão."
actions.dashboard_open_location_picker.label: "local"
actions.dashboard_open_location_picker.description: "Alterar diretório de trabalho para novos agentes"
actions.dashboard_open_location_picker.long_help: "Abre um seletor para definir o diretório de trabalho em que agentes despachados recentemente do painel executam.\nLance agentes contra outro repositório ou pasta sem sair do painel.\nAfeta apenas novos despachos, não agentes já em execução."
actions.dashboard_toggle_worktree.label: "worktree"
actions.dashboard_toggle_worktree.description: "Alternar modo worktree para novos agentes"
actions.dashboard_toggle_worktree.long_help: "Faz o próximo agente despachado pelo painel nascer em um novo git worktree, isolando seu trabalho em um checkout separado.\nSó se aplica quando o diretório de trabalho é um repositório git.\nAfeta agentes recém-despachados, não os já em execução."
actions.dashboard_overlay_exit.label: "fechar sobreposição"
actions.dashboard_overlay_exit.description: "Voltar ao painel"
actions.dashboard_overlay_exit.long_help: "Sai da sobreposição de sessão anexada e retorna à lista do painel, sem parar o agente.\nTambém acessível via q no histórico, um Esc neutro ou o botão fechar.\nPara parar o agente em vez de apenas desanexar, use Ctrl+X."
actions.dashboard_overlay_prev.label: "sessão anterior"
actions.dashboard_overlay_prev.description: "Sessão anterior"
actions.dashboard_overlay_next.label: "próx sessão"
actions.dashboard_overlay_next.description: "Próxima sessão"
actions.dashboard_overlay_stop.label: "parar"
actions.dashboard_overlay_stop.description: "Parar agente, fechar sessão (voltar ao painel)"
actions.dashboard_overlay_stop.long_help: "Dentro de uma sobreposição de sessão, para o agente anexado e o fecha, retornando à lista do painel.\nRequer confirmação: pressione Ctrl+X duas vezes.\nCtrl+. ainda abre a tabela de atalhos aqui; apenas Ctrl+X é ocupado por parar."
actions.edit_prompt_external.label: "editar prompt"
actions.edit_prompt_external.description: "Editar prompt no editor externo"
actions.edit_prompt_external.long_help: "Abre o rascunho do prompt atual em $VISUAL ou $EDITOR, recaindo para vi quando nenhum dos dois está definido.\nSalvar e fechar o editor retorna o texto atualizado ao compositor; não envia o prompt.\nDisponível no modo minimal para rascunhos comuns sem anexos."
