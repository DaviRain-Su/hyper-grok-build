settings.contextual_hints.undo.label: "Desfazer"
settings.contextual_hints.undo.description: "Lembra você de que Ctrl+Z restaura o prompt depois de você limpá-lo."
settings.contextual_hints.plan_mode.label: "Modo de planejamento"
settings.contextual_hints.plan_mode.description: "Sugere o modo de planejamento (Shift+Tab) quando seu prompt parece um pedido de planejamento."
settings.contextual_hints.image_input.label: "Entrada de imagem"
settings.contextual_hints.image_input.description: "Oferece colar uma imagem quando há uma na área de transferência e o modelo aceita imagens."
settings.contextual_hints.send_now.label: "Enviar agora"
settings.contextual_hints.send_now.description: "Depois de enfileirar um seguimento durante o turno, lembra você de que Enter em um prompt vazio envia o item no topo da fila agora."
settings.contextual_hints.small_screen.label: "Tela pequena"
settings.contextual_hints.small_screen.description: "Sugere /compact-mode uma vez por execução quando o terminal tem poucas linhas."
settings.contextual_hints.word_select.label: "Selecionar palavra"
settings.contextual_hints.word_select.description: "Ao dar duplo clique no texto da conversa com a seleção de texto em modo recolher/navegar, lembra você de que \"Selecionar palavra\" está nas Configurações."
settings.contextual_hints.ssh_wrap.label: "Envolver SSH"
settings.contextual_hints.ssh_wrap.description: "Ao carregar uma sessão via SSH, recomenda `grok wrap ssh` para encaminhamento da área de transferência e restauração do terminal."
settings.fork_secondary_model.label: "Bifurcar modelo secundário"
settings.fork_secondary_model.description: "Modelo usado pelo agente secundário ao bifurcar. Escolha `(não sobrescrito)` para limpar."

