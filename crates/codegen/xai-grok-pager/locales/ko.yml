settings.permission_mode.choice.auto.display: "자동"
settings.permission_mode.choice.auto.description: "LLM 분류기가 안전한 도구를 승인하고, 위험한 작업은 여전히 묻거나 거절할 수 있습니다."
settings.permission_mode.choice.always-approve.display: "항상 승인"
settings.permission_mode.choice.always-approve.description: "모든 도구 작업을 자동 승인합니다. 모든 권한 프롬프트를 건너뜁니다."
settings.remember_tool_approvals.label: "도구 승인 기억"
settings.remember_tool_approvals.description: "권한 프롬프트에 \"항상 허용\" 옵션을 표시하여 특정 명령이나 도구에 대해 반복적으로 묻지 않도록 합니다. ask 및 auto 모드에서 적용되며, Always-approve는 여전히 모든 프롬프트를 건너뜁니다. 재시작이 필요합니다."
settings.multiline_mode.label: "여러 줄 입력"
settings.multiline_mode.description: "켜면 Enter는 줄바꿈을 삽입하고 Shift+Enter는 전송합니다. 각 세션마다 재설정됩니다."
settings.default_model.label: "기본 모델"
settings.default_model.description: "새 세션에 사용되는 모델입니다. 변경하면 현재 세션도 전환됩니다. \"(미설정)\"을 선택하여清除할 수 있습니다."
settings.max_thoughts_width.label: "思考 패널 최대 너비"
settings.max_thoughts_width.description: "에이전트思考 패널의 열 너비 예산(40-500, 기본값 120)."
settings.show_thinking_blocks.label: "思考 블록 표시"
settings.show_thinking_blocks.description: "스트리밍 중 스크롤백에 에이전트의思考/추론 블록을 표시합니다."
settings.prompt_suggestions.label: "프롬프트 제안"
settings.prompt_suggestions.description: "각 턴 후, 다음 프롬프트를 예측하여 입력框에 고스트 텍스트로 표시합니다(Tab으로 수락). 턴당 한 번의 소형 모델 호출을 사용합니다."
settings.respect_manual_folds.label: "수동 접기 유지"
settings.respect_manual_folds.description: "스트리밍 중 수동으로 접은 블록을 그대로 유지하고, 블록을 펼칠 때 자동 스크롤을 중지합니다. 실험적 기능입니다."
settings.group_tool_verbs.label: "도구 호출 그룹화"
settings.group_tool_verbs.description: "연속된 읽기/검색/나열 도구 호출과 하위 에이전트 행을 하나의 요약 행으로 접고, 완료된思考도 그룹에 접어 넣습니다."
settings.collapsed_edit_blocks.label: "편집 블록 접기"
settings.collapsed_edit_blocks.description: "편집을 한 줄 +N/-M diffstat 요약으로 표시하고, 같은 파일의 연속된 편집을 하나의 블록으로 병합합니다; 행을 펼치면 diff를 볼 수 있습니다."
settings.display_refresh_auto_cadence.label: "디스플레이 주사율에 맞춤"
settings.display_refresh_auto_cadence.description: "고주사율 디스플레이에서 TUI가 디스플레이에 맞춰 더 빠르게 스트리밍/스크롤합니다. 끄면 클래식 ~60 Hz 케이던스를 유지합니다. 재시작이 필요합니다."
settings.scroll_speed.label: "스크롤 속도"
settings.scroll_speed.description: "마우스 휠 및 트랙패드 스크롤 속도 배수(1-100). 클수록 빠릅니다."
settings.scroll_mode.label: "스크롤 입력"
settings.scroll_mode.description: "자동 감지가 기기를 잘못 인식할 때 휠 또는 트랙패드 스크롤 동작을 강제합니다."
settings.scroll_mode.choice.auto.display: "자동 감지"
settings.scroll_mode.choice.auto.description: "이벤트 타이밍으로 제스처별 휠과 트랙패드를 감지합니다. 기본값입니다."
settings.scroll_mode.choice.wheel.display: "마우스 휠"
settings.scroll_mode.choice.wheel.description: "항상 스크롤을 휠 노치로 처리합니다(틱당 고정 행 수)."
settings.scroll_mode.choice.trackpad.display: "트랙패드"
settings.scroll_mode.choice.trackpad.description: "항상 스크롤을 트랙패드로 처리합니다(소수 누적)."
settings.scroll_lines.label: "스크롤 행 수"
settings.scroll_lines.description: "휠과 트랙패드의 스크롤 틱당 행 수(1-10). 설정 전까지는 각 터미널의 자체 프로필이 적용됩니다."
settings.invert_scroll.label: "스크롤 반전"
settings.invert_scroll.description: "수직 스크롤 방향을 반전합니다(자연 스크롤)."
settings.keep_text_selection.label: "텍스트 선택"
settings.keep_text_selection.description: "앱 내 선택이 화면에 유지되는 시간과 더블클릭 동작(접기 vs. 단어 선택 및 복사)을 설정합니다. 터미널이나 멀티플렉서 자체 선택을 사용하려면 드래그 중 Shift를 누르세요(네이티브 복사)."
settings.keep_text_selection.choice.flash.display: "복사 후 플래시"
settings.keep_text_selection.choice.flash.description: "마우스를 놓을 때 잠시 강조 후 지웁니다. 더블클릭은 접기를 토글합니다. 기본값입니다."
settings.keep_text_selection.choice.hold.display: "취소까지 유지"
settings.keep_text_selection.choice.hold.description: "Esc, 클릭 또는 스크롤할 때까지 선택을 표시합니다. 더블클릭은 접기를 토글합니다."
settings.keep_text_selection.choice.word_select.display: "단어 선택(터미널 방식)"
