settings.permission_mode.label: "권한 모드"
settings.permission_mode.description: "Default는 에이전트의 내장 동작을 사용하고, Ask는 각 도구 작업마다 묻고, Auto는 위험한 도구에 LLM 분류기를 사용하며, Always approve는 모든 권한을 자동으로 부여합니다."
settings.permission_mode.choice.default.display: "기본"
settings.permission_mode.choice.default.description: "에이전트의 기본 권한 동작을 사용합니다(현재 Ask와 동일)."
