settings.scroll_mode.choice.auto.display: "Auto-Erkennung"
settings.scroll_mode.choice.auto.description: "Erkennt Rad vs. Trackpad pro Geste anhand des Event-Timings. Standard."
settings.scroll_mode.choice.wheel.display: "Mausrad"
settings.scroll_mode.choice.wheel.description: "Scrollen immer als Rad-Raster behandeln (feste Zeilen pro Tick)."
settings.scroll_mode.choice.trackpad.display: "Trackpad"
settings.scroll_mode.choice.trackpad.description: "Scrollen immer als Trackpad behandeln (fraktionale Akkumulation)."
settings.scroll_lines.label: "Scroll-Zeilen"
settings.scroll_lines.description: "Zeilen pro Scroll-Tick für Rad und Trackpad (1-10). Bis zur Einstellung gilt das Profil des jeweiligen Terminals."
settings.invert_scroll.label: "Scrollen invertieren"
settings.invert_scroll.description: "Kehrt die vertikale Scroll-Richtung um (natürliches Scrollen)."
settings.keep_text_selection.label: "Textauswahl"
settings.keep_text_selection.description: "Wie lange eine in-App-Auswahl auf dem Bildschirm bleibt und was Doppelklick macht (Einklappen vs. Wort auswählen & kopieren). Für die Auswahl Ihres Terminals oder Multiplexers Shift beim Ziehen gedrückt halten (natives Kopieren)."
settings.keep_text_selection.choice.flash.display: "Nach Kopie aufblinken"
settings.keep_text_selection.choice.flash.description: "Kurzes Hervorheben beim Loslassen der Maus, dann löschen. Doppelklick klappt ein/aus. Standard."
settings.keep_text_selection.choice.hold.display: "Bis Zurücksetzen halten"
settings.keep_text_selection.choice.hold.description: "Auswahl sichtbar halten bis Esc, Klick oder Scroll. Doppelklick klappt ein/aus."
settings.keep_text_selection.choice.word_select.display: "Wortauswahl (terminalartig)"
settings.keep_text_selection.choice.word_select.description: "Doppelklick wählt & kopiert ein Wort, Dreifachklick eine Zeile; Auswahl bleibt bis zum Zurücksetzen."
settings.coding_data_sharing.label: "Teilen von Codierdaten"
settings.coding_data_sharing.description: "Steuert, ob SpaceXAI Codier-Sitzungsdaten speichern und zum Training verwenden darf. Betrifft keine Produkt-Analytik; siehe Konfigurations- und Monitoring-Dokumentation."
settings.coding_data_sharing.choice.opt-in.display: "Teilnehmen"
settings.coding_data_sharing.choice.opt-in.description: "SpaceXAI erlauben, Codier-Sitzungsdaten für Modelltraining und Produktverbesserung zu speichern."
settings.coding_data_sharing.choice.opt-out.display: "Abmelden"
settings.coding_data_sharing.choice.opt-out.description: "Codier-Sitzungsdaten nicht für Training speichern. Deaktiviert keine Produkt-Analytik."
settings.default_selected_permission.label: "Vorausgewählte Berechtigung"
settings.default_selected_permission.description: "Welche Zeile der Cursor in Berechtigungsabfragen vorauswählt."
settings.default_selected_permission.choice.always_allow_all_sessions.display: "In allen Sitzungen immer erlauben"
settings.default_selected_permission.choice.allow_command_always.display: "Diesen Befehl immer erlauben"
settings.default_selected_permission.choice.allow_once.display: "Einmal erlauben"
settings.default_selected_permission.choice.reject.display: "Ablehnen"
settings.toolset.ask_user_question.timeout_enabled.label: "Zeitlimit für Fragen"
settings.toolset.ask_user_question.timeout_enabled.description: "Wenn aktiv, läuft das ask_user_question-Werkzeug nach einer festgelegten Zeit ab, statt endlos zu blockieren."
settings.plan_mode.label: "Planmodus"
settings.plan_mode.description: "Wenn aktiv, fasst der Agent zuerst einen Plan zusammen, bevor er Werkzeuge ausführt oder Bearbeitungen vornimmt."
settings.plan_mode.choice.off.display: "Aus"
settings.plan_mode.choice.off.description: "Agent führt Werkzeuge aus und bearbeitet Dateien direkt (Standard)."
settings.plan_mode.choice.on.display: "An"
settings.plan_mode.choice.on.description: "Agent fasst einen Plan zusammen und fragt nach Genehmigung, bevor er Werkzeuge ausführt."
settings.show_tips.label: "Tipps anzeigen"
settings.show_tips.description: "Zeigt beim Start den Tipp-des-Tages-Banner an. Neustart erforderlich."
settings.contextual_hints.label: "Kontext-Hinweise anzeigen"
settings.contextual_hints.description: "Zeigt kurze, kontextbezogene Tastatur-Hinweise während der Arbeit an; jeden einzeln umschalten."
settings.auto_update.label: "Auto-Update"
settings.auto_update.description: "Lädt Pager-Updates beim Start automatisch herunter und installiert sie. Neustart erforderlich."
settings.hunk_tracker_mode.label: "Hunk-Tracking"
settings.hunk_tracker_mode.description: "Welche Dateiänderungen der Agent als Hunks verfolgt. Aus deaktiviert das Tracking (und LOC-Statistiken) vollständig. Neustart erforderlich."
settings.hunk_tracker_mode.choice.agent_only.display: "Nur Agent"
settings.hunk_tracker_mode.choice.agent_only.description: "Nur Dateien verfolgen, die der Agent bearbeitet (Standard)."
settings.hunk_tracker_mode.choice.all_dirty.display: "Alle geänderten"
settings.hunk_tracker_mode.choice.all_dirty.description: "Jede geänderte git-Datei verfolgen, einschliesslich externer Bearbeitungen."
settings.hunk_tracker_mode.choice.off.display: "Aus"
settings.hunk_tracker_mode.choice.off.description: "Hunk-Tracking vollständig deaktivieren. Deaktiviert auch LOC-Tracking."
settings.voice_capture_mode.label: "Spracherfassung"
settings.voice_capture_mode.description: "Verhalten der Sprachtaste (Ctrl+Space / F8): Umschalten (Drücken zum Starten/Stoppen) oder Gedrückthalten zum Sprechen (gedrückt halten zum Aufnehmen, loslassen zum Stoppen; erfordert ein Kitty-Protokoll-Terminal)."
settings.voice_capture_mode.choice.toggle.display: "Umschalten"
settings.voice_capture_mode.choice.toggle.description: "Ctrl+Space / F8 startet die Diktierung; erneut drücken (oder Esc/Enter) zum Stoppen."
settings.voice_capture_mode.choice.hold.display: "Gedrückt halten zum Sprechen"
settings.voice_capture_mode.choice.hold.description: "Ctrl+Space / F8 gedrückt halten zum Aufnehmen, loslassen zum Stoppen. Erfordert ein Kitty-Protokoll-Terminal."
settings.voice_stt_language.label: "Sprachsprache"
settings.voice_stt_language.description: "Sprach-zu-Text-Sprache für die Sprachdiktierung (Grok STT). Standardmäßig Englisch; System verwendet Ihre Systemsprache, wenn unterstützt. Legt auch die Formatierungssprache für Zahlen und Währungen fest."
settings.voice_stt_language.choice.auto.display: "System"
settings.voice_stt_language.choice.auto.description: "Systemsprache verwenden, wenn sie eine unterstützte STT-Sprache ist; sonst Englisch."
