settings.multiline_mode.label: "Mehrzeilig"
settings.multiline_mode.description: "Wenn aktiv, fügt Enter einen Zeilenumbruch ein und Shift+Enter sendet. Setzt sich jede Sitzung zurück."
settings.default_model.label: "Standardmodell"
