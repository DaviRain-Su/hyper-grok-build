settings.collapsed_edit_blocks.label: "Eingeklappte Bearbeitungsblöcke"
settings.collapsed_edit_blocks.description: "Zeigt Bearbeitungen als einzeilige +N/-M Diffstat-Zusammenfassung und fasst aufeinanderfolgende Bearbeitungen derselben Datei zu einem Block zusammen; eine Zeile ausklappen, um die Diffs zu sehen."
settings.display_refresh_auto_cadence.label: "Bildwiederholrate des Monitors anpassen"
settings.display_refresh_auto_cadence.description: "Auf hochtaktenden Displays streamt/scrollt die TUI schneller, um das Display anzupassen. Aus behält die klassische ~60-Hz-Taktung. Neustart erforderlich."
settings.scroll_speed.label: "Scroll-Geschwindigkeit"
settings.scroll_speed.description: "Geschwindigkeits-Multiplikator für Mausrad und Trackpad (1-100). Höher = schneller."
settings.scroll_mode.label: "Scroll-Eingabe"
