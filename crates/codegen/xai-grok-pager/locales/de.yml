actions.page_down.label: "Seite runter"
actions.page_down.description: "Eine Seite nach unten scrollen"
actions.collapse.label: "Einklappen"
actions.collapse.description: "Ausgewählten Eintrag einklappen"
actions.expand.label: "Ausklappen"
actions.expand.description: "Ausgewählten Eintrag ausklappen"
actions.toggle_fold.label: "Einklappen"
actions.toggle_fold.description: "Ausklappen / Einklappen"
actions.toggle_fold.long_help: "Klappt den ausgewählten Scrollback-Eintrag ein oder aus, um seinen vollständigen Inhalt zu verbergen oder anzuzeigen.\nPraktisch zum Überfliegen langer Werkzeugausgaben oder Reasoning-Inhalte.\nVerwandt: E klappt jeden Eintrag ein/aus, Ctrl+E schaltet alle Gedanken-Blöcke um."
actions.toggle_expand_all.label: "Alle"
actions.toggle_expand_all.description: "Alle ausklappen / alle einklappen"
actions.toggle_expand_all.long_help: "Klappt jeden Scrollback-Eintrag zugleich ein oder aus, während e nur die ausgewählte Zeile umschaltet.\nKlappen Sie ein langes Transkript ein, um die Überschriften zu überfliegen, dann alles wieder ausklappen.\nGedanken-Blöcke haben einen eigenen Schalter: Ctrl+E."
actions.expand_all_thinking.label: "Aus-/Einklappen"
actions.expand_all_thinking.description: "Alle Gedanken-Blöcke umschalten"
actions.expand_all_thinking.long_help: "Zeigt oder verbirgt die Reasoning-(Gedanken-)Blöcke des Agenten im gesamten Transkript mit einem Tastendruck.\nEnthüllen Sie, wie der Agent zu einer Antwort kam, oder verbergen Sie das Reasoning, um sich auf die Ergebnisse zu konzentrieren.\nGetrennt von E, das jeden Eintrag unabhängig vom Typ einklappt."
actions.toggle_raw.label: "Roh"
actions.toggle_raw.description: "Rohes Markdown umschalten"
actions.toggle_raw.long_help: "Schaltet den ausgewählten Eintrag zwischen gerendertem Markdown und seinem Roh-Quelltext um.\nNutzen Sie es, um exaktes Markdown zu kopieren, ein Link-Ziel zu prüfen oder vom Renderer verborgene Formatierung zu sehen.\nErneut drücken, um zur gerenderten Ansicht zurückzukehren."
actions.copy_block_content.label: "Kopieren"
actions.copy_block_content.description: "Inhalt kopieren"
actions.copy_block_content.long_help: "Kopiert den Inhalt des ausgewählten Blocks in die Zwischenablage: Nachrichtentext, vollständige Werkzeugausgabe oder den Inhalt eines Codeblocks.\nNur bei Blöcken angeboten, die Kopieren unterstützen.\nFür nur den Befehl oder Dateipfad verwenden Sie stattdessen Y."
actions.copy_block_meta.label: "Befehl kopieren"
actions.copy_block_meta.description: "Befehl / Pfad kopieren"
actions.copy_block_meta.long_help: "Kopiert nur die Kennung des Blocks: die Befehlszeile eines Werkzeugaufrufs oder den Pfad eines Dateiblocks, nicht den Inhalt.\nPraktisch, um einen Befehl erneut auszuführen oder einen Pfad woanders einzufügen.\nVerwenden Sie kleines y, um den vollständigen Inhalt zu kopieren."
actions.open_block_viewer.label: "Anzeigen"
actions.open_block_viewer.description: "Im Viewer öffnen"
actions.open_block_viewer.long_help: "Öffnet den ausgewählten Block in einem fokussierten, scrollbaren Vollbild-Viewer.\nAm besten für lange Werkzeugausgaben, grosse Dateien oder Code, den Sie abseits des umgebenden Transkripts lesen wollen.\nEsc kehrt zur Konversation zurück."
actions.open_next_link.label: "Link"
actions.open_next_link.description: "Nächster Link"
actions.open_prev_link.label: "Link"
actions.open_prev_link.description: "Vorheriger Link"
actions.rewind.label: "Zurückspulen"
actions.rewind.description: "Zur ausgewählten Runde zurückspulen"
actions.rewind.long_help: "Spult die Konversation zu einer früheren Runde zurück, stellt die damals erstellte Datei-Momentaufnahme wieder her und verwirft spätere Änderungen.\nWählen Sie eine Runde aus der Liste und was wiederhergestellt werden soll (alles, nur Konversation oder nur Dateien); eine laufende Runde wird zuerst zum Abbrechen angeboten, und Konflikte oder Fehler werden nach dem Ablauf gemeldet.\nDestruktiv: spätere Runden werden verworfen.\nIm Leerlauf auch mit leerem Prompt über Esc Esc (innerhalb 800 ms) erreichbar, gleich `/rewind`."
actions.kill_bg_task.label: "Erzwingen"
actions.kill_bg_task.description: "Hintergrund-Task abbrechen"
actions.kill_bg_task.long_help: "Bricht die Hintergrund-Task ab, die zum ausgewählten Task-Block gehört (z. B. ein langer Shell-Befehl, der in den Hintergrund gesendet wurde).\nGreifen Sie darauf zu, um einen entgleisten oder nicht mehr benötigten Prozess zu stoppen.\nWirkt nur auf eine lebende Task; fertige sind unbetroffen."
actions.send_prompt.label: "Senden"
actions.send_prompt.description: "Senden"
actions.focus_prompt.label: "Eingabe"
actions.focus_prompt.description: "Eingabe fokussieren"
actions.focus_scrollback.label: "Scrollback"
actions.focus_scrollback.description: "Scrollback fokussieren"
actions.focus_scrollback.long_help: "Verschiebt den Fokus von der Eingabe zum Scrollback, damit Sie das Transkript navigieren können.\nTab funktioniert im einfachen und im Vim-Scrollback-Modus.\nEsc ist für die Lösch-/Zurückspul-(Leerlauf-)Richtlinie reserviert, nicht für den Fokus."
actions.cancel_turn.label: "Abbrechen"
actions.cancel_turn.description: "Runde abbrechen"
actions.cancel_turn.long_help: "Bricht die aktuelle Runde des Agenten ab und stoppt die Generierung, wobei die Sitzung offen bleibt.\nCtrl+C bricht ab, wenn die Eingabe leer ist; mit einem nicht-leeren Entwurf wird die Eingabe zuerst geleert und die Runde läuft weiter.\nEs stoppt die Runde, nicht die App; zum Beenden das Beenden-Kürzel verwenden."
actions.cycle_mode.label: "Modus"
actions.cycle_mode.description: "Modus durchschalten (Normal / Plan / Immer genehmigen)"
actions.cycle_mode.long_help: "Schaltet den Sitzungsmodus weiter: Normal -> Plan -> Immer-Genehmigen -> Normal.\nPlanmodus lässt den Agenten zuerst planen und schreibt keine Dateien; Immer-Genehmigen führt jeden Werkzeugaufruf ohne Nachfrage aus.\nCtrl+O schaltet Auto-Genehmigung direkt um."
actions.toggle_tasks.label: "Tasks"
actions.toggle_tasks.description: "Task-Panel umschalten"
actions.toggle_tasks.long_help: "Zeigt oder verbirgt das Task-Panel, das Hintergrund-Tasks und deren Status auflistet.\nNutzen Sie es zum Überwachen oder Zurückkehren zu Arbeit, die Sie mit Ctrl+B in den Hintergrund gesendet haben.\nEin Seitenpanel; ausschalten, um Breite zurückzugewinnen."
actions.toggle_todos.label: "Todos"
actions.toggle_todos.description: "Todo-Panel umschalten"
actions.toggle_todos.long_help: "Zeigt oder verbirgt das Todo-Panel: die Live-Aufgabenliste des Agenten für die aktuelle Arbeit.\nBeobachten Sie, was er plant und was noch bleibt, während die Runde läuft.\nEin Seitenpanel; ausschalten, um Breite zurückzugewinnen."
actions.toggle_queue.label: "Warteschlange"
actions.toggle_queue.description: "Prompt-Warteschlange umschalten"
actions.toggle_queue.long_help: "Zeigt oder verbirgt die Prompt-Warteschlange.\nDie Warteschlange lässt Sie Rückfragen aufreihen, während eine Runde läuft; jede wird automatisch gesendet, wenn der Agent fertig ist.\nLokale macOS VS Code-Familie: Ctrl+4 primär (Ctrl+; / Ctrl+' als Alternative). Sonst Ctrl+; mit Ctrl+' als Alternative."
actions.open_sessions.label: "Sitzungen"
actions.open_sessions.description: "Sitzungen öffnen"
actions.open_sessions.long_help: "Öffnet den Sitzungs-Browser, um vergangene Konversationen fortzusetzen oder zwischen ihnen zu wechseln.\nWählen Sie eine, um ihre vollständige Historie wieder anzuschließen.\nGetrennt vom Agenten-Dashboard (Ctrl+\\), das viele lebende Agenten zugleich verwaltet."
actions.open_extensions.label: "Erweiterungen"
actions.open_extensions.description: "Erweiterungen öffnen"
actions.open_extensions.long_help: "Öffnet den Erweiterungs-Manager für MCP-Server und Plugins: sehen Sie, was verbunden ist und welche Werkzeuge sie hinzufügen.\nNutzen Sie es, um zu bestätigen, dass eine Integration geladen ist, oder verfügbare Werkzeuge zu durchstöbern.\nGetrennt von den Einstellungen, die allgemeine App-Optionen enthalten."
actions.send_to_background.label: "In Hintergrund"
actions.send_to_background.description: "Laufende Task in den Hintergrund senden"
actions.send_to_background.long_help: "Koppelt das laufende Vordergrund-Execute ab, sodass es im Hintergrund weiterarbeitet, während Sie lesen, Prompts einreihen oder etwas anderes beginnen.\nVerfolgen und fortsetzen Sie es aus dem Task-Panel (Ctrl+G).\nNur sinnvoll, während ein Vordergrund-Execute tatsächlich läuft."
actions.interject_prompt.label: "Sofort senden"
actions.interject_prompt.description: "Sofort senden während Lauf (bricht aktuelle Runde ab)"
actions.interject_prompt.long_help: "Sendet eine Nachricht an den Agenten mitten in der Runde, ohne sie abzubrechen (einschieben), sodass Sie lenken oder Kontext hinzufügen können, während er weiterarbeitet.\nNormales Enter reiht während einer laufenden Runde eine Rückfrage für später ein; diese Tastenkombination führt den Eingabetext stattdessen in die aktuelle Runde zusammen.\nBei leerer Eingabe senden Enter (oder diese Kombination) die oberste eingereihte Rückfrage sofort — ohne das Warteschlangen-Panel fokussieren zu müssen. Im Warteschlangen-Panel sendet diese Kombination die ausgewählte Zeile sofort.\nGreifen Sie darauf zu, um den Kurs zu korrigieren, ohne den Fortschritt der Runde zu verlieren."
actions.enable_voice_mode.label: "Sprachmodus"
actions.enable_voice_mode.description: "Sprachdiktierung starten (Ctrl+Space / F8)"
actions.voice_toggle.label: "Mikrofon"
actions.voice_toggle.description: "Sprachdiktierung (Ctrl+Space / F8)"
actions.voice_toggle.long_help: "Mikrofonaufnahme für die Diktierung, gebunden auf Ctrl+Space (oder F8 — praktisch, wo Ctrl+Space belegt ist, z. B. macOS-Eingabequellen-Umschaltung; am Laptop Fn+F8).\nDas Verhalten folgt der Spracherfassungs-Einstellung: Umschalten (Drücken zum Starten, erneut zum Stoppen) oder Gedrückt-halten-zum-Sprechen (gedrückt halten zum Aufnehmen, loslassen zum Stoppen), wobei Halten ein Kitty-Protokoll-Terminal erfordert und anderswo auf Umschalten zurückfällt. `/voice` schaltet überall um.\nSprache wird direkt in die Eingabe transkribiert."
actions.toggle_multiline.label: "Mehrzeilig"
actions.toggle_multiline.description: "Mehrzeilige Eingabe umschalten"
actions.toggle_multiline.long_help: "Schaltet eine dauerhafte mehrzeilige Eingabe um, sodass der Editor zum Verfassen längerer Nachrichten ausgeklappt bleibt.\nZeilenumbrüche mit Shift+Enter oder Alt+Enter einfügen (oder einem abschließenden Backslash); bloßes Enter sendet weiterhin.\nCtrl+M schaltet Mehrzeilig in der Eingabe um; außerhalb der Eingabe öffnet es die Modellauswahl."
actions.bash_mode.label: "shell"
actions.bash_mode.description: "Shell-Modus (! in leerer Eingabe eingeben)"
actions.bash_mode.long_help: "Führt einen Shell-Befehl aus, ohne den Chat zu verlassen: Geben Sie ! am Anfang einer leeren Eingabe ein, dann den Befehl.\nDie Befehlsausgabe wird ins Scrollback aufgenommen.\nLöschen Sie das führende !, um zur normalen Eingabe zurückzukehren."
actions.toggle_yolo.label: "yolo"
actions.toggle_yolo.description: "Immer-genehmigen umschalten"
actions.toggle_yolo.long_help: "Schaltet Auto-Genehmigung (YOLO) für diese Sitzung an oder aus.\nWenn an, führt der Agent jeden Werkzeugaufruf (Bearbeitungen, Shell, Löschungen) ohne pro-Aktion-Bestätigung aus.\nGleicher Zustand wie Immer-Genehmigen im Shift+Tab-Zyklus; mit Vorsicht verwenden."
actions.new_session.label: "Neu"
actions.new_session.description: "Neue Sitzung"
actions.new_session.long_help: "Beginnt eine neue Sitzung mit leerem Scrollback und Kontext.\nErfordert Bestätigung: zweimal drücken (erstes Drücken schärft, das zweite startet)\n damit Sie die aktuelle Konversation nicht versehentlich verwerfen."
actions.quit.label: "Beenden"
actions.quit.description: "Beenden"
actions.quit.long_help: "Beendet die App. Erfordert Bestätigung: zweimal schnell hintereinander drücken;\nein einzelner Druck wird als verirrte Taste behandelt und ignoriert.\nGebunden auf Ctrl+Q, mit Ctrl+D als Alias (Ctrl+D ist primär im VS Code-Terminal)."
actions.command_palette.label: "Befehle"
actions.command_palette.description: "Befehls-Palette"
actions.command_palette.long_help: "Fuzzy-Suche über jede Aktion und jeden Slash-Befehl, dann nach Name ausführen.\nNützlich, wenn Sie sich an eine Tastenbindung nicht erinnern.\nÖffnet sich auch mit ? während das Scrollback fokussiert ist."
actions.shortcuts_help.label: "Kürzel"
actions.shortcuts_help.description: "Tastenkürzel"
actions.shortcuts_help.long_help: "Öffnet diesen Tastatur-Spickzettel.\nMit j/k blättern, mit e die Inline-Hilfe einer Zeile ausklappen oder Enter für die vollständige Detailseite eines Kürzels drücken.\nGebunden auf Ctrl+. und Ctrl+X; die Leiste zeigt, welches Ihr Terminal zuverlässig sendet."
actions.model_picker.label: "Modell"
actions.model_picker.description: "Modell wählen"
actions.model_picker.long_help: "Öffnet die Modellauswahl, um das Modell für diese Sitzung zu wechseln; die Wahl gilt für spätere Runden.\nGebunden auf Ctrl+M, aber während die Eingabe fokussiert ist, schaltet diese Kombination Mehrzeilig um.\nAus dem Scrollback oder der Befehls-Palette erreichbar."
actions.open_settings.label: "Einstellungen"
actions.open_settings.description: "Einstellungs-Panel öffnen"
actions.open_dashboard.label: "Dashboard"
actions.open_dashboard.description: "Agenten-Dashboard öffnen"
actions.open_dashboard.long_help: "Öffnet das Agenten-Dashboard: eine Liste all Ihrer laufenden und letzten Agenten zum Überwachen und Wechseln.\nFunktioniert von überall, einschliesslich Willkommensbildschirm und innerhalb einer Sitzung.\nVon dort können Sie Agenten dispatchen, anschließen, stoppen, gruppieren und umsortieren."
actions.dashboard_select_next.label: "Weiter"
actions.dashboard_select_next.description: "Nächste Zeile auswählen"
actions.dashboard_select_prev.label: "Zurück"
actions.dashboard_select_prev.description: "Vorherige Zeile auswählen"
actions.dashboard_toggle_pin.label: "Anheften"
actions.dashboard_toggle_pin.description: "Agenten anheften / lösen"
actions.dashboard_toggle_pin.long_help: "Heftet den ausgewählten Agenten an oder löst ihn, sodass er unabhängig von Sortierung oder Gruppierung oben in der Liste bleibt.\nBehalten Sie die Agenten, die Sie interessieren, im Blick, während andere kommen und gehen.\nAnheften bleibt über Dashboard-Sitzungen hinweg bestehen."
actions.dashboard_begin_rename.label: "Umbenennen"
actions.dashboard_begin_rename.description: "Agenten umbenennen"
actions.dashboard_stop.label: "Stopp"
actions.dashboard_stop.description: "Agenten stoppen / schließen"
actions.dashboard_stop.long_help: "Stoppt den ausgewählten Agenten und entfernt seine Zeile aus dem Dashboard; eine laufende Runde wird zuerst abgebrochen.\nNutzen Sie es, um fertige oder unerwünschte Agenten zu entfernen, ohne sie anzuschließen.\nDas Äquivalent im Overlay (Ctrl+X) bestätigt vor dem Stoppen."
actions.dashboard_cycle_mode.label: "Modus"
actions.dashboard_cycle_mode.description: "Dispatch-Modus durchschalten"
actions.dashboard_cycle_mode.long_help: "Schaltet den Dispatch-Modus für Agenten weiter, die Sie vom Dashboard starten: Normal, Plan, dann Immer-Genehmigen.\nPlan lässt neue Agenten zuerst planen, bevor Dateien geändert werden; Immer-Genehmigen führt deren Werkzeuge ohne Nachfrage aus.\nSpiegelt den Shift+Tab-Zyklus innerhalb der Sitzung, angewandt auf neue Dispatches."
actions.dashboard_toggle_grouping.label: "Gruppieren"
actions.dashboard_toggle_grouping.description: "Zeilengruppierung umschalten"
actions.dashboard_toggle_grouping.long_help: "Schaltet das Dashboard zwischen einer flachen Liste und nach Status gruppierten Zeilen um, z. B. arbeitend versus Leerlauf.\nGruppierung hebt die Agenten hervor, die Aufmerksamkeit brauchen; die flache Liste behält eine stabile Reihenfolge.\nIhre Wahl bleibt über Sitzungen hinweg bestehen."
actions.dashboard_reorder_up.label: "Hoch"
actions.dashboard_reorder_up.description: "Agenten nach oben"
actions.dashboard_reorder_down.label: "Runter"
actions.dashboard_reorder_down.description: "Agenten nach unten"
actions.dashboard_shortcuts_help.label: "Kürzel"
actions.dashboard_shortcuts_help.description: "Kürzel-Overlay anzeigen"
actions.dashboard_exit.label: "Beenden"
actions.dashboard_exit.description: "Dashboard schließen"
actions.dashboard_exit.long_help: "Schließt das Dashboard und kehrt dorthin zurück, wo Sie waren.\nEsc ist kaskadierend: Es schließt zuerst eine offene Vorschau oder löscht einen aktiven Filter und beendet erst, wenn nichts anderes aussteht.\nBinden Sie diese Aktion auf eine andere Taste, um direkt zu beenden."
actions.dashboard_toggle_auto_approve.label: "Immer genehmigen"
actions.dashboard_toggle_auto_approve.description: "Immer-genehmigen umschalten"
actions.dashboard_toggle_auto_approve.long_help: "Schaltet Auto-Genehmigung (YOLO) für den ausgewählten Agenten direkt vom Dashboard um, ohne ihn anzuschließen.\nWenn an, führt dieser Agent jeden Werkzeugaufruf ohne pro-Aktion-Bestätigung aus.\nDas Sitzungs-Äquivalent ist Ctrl+O innerhalb einer Sitzung."
actions.dashboard_open_location_picker.label: "Ort"
actions.dashboard_open_location_picker.description: "Arbeitsverzeichnis für neue Agenten ändern"
actions.dashboard_open_location_picker.long_help: "Öffnet eine Auswahl, um das Arbeitsverzeichnis zu setzen, in dem neu dispatchte Dashboard-Agenten laufen.\nStarten Sie Agenten gegen ein anderes Repo oder einen anderen Ordner, ohne das Dashboard zu verlassen.\nBetrifft nur neue Dispatches, nicht bereits laufende Agenten."
actions.dashboard_toggle_worktree.label: "worktree"
actions.dashboard_toggle_worktree.description: "worktree-Modus für neue Agenten umschalten"
actions.dashboard_toggle_worktree.long_help: "Bewaffnet den nächsten vom Dashboard dispatchten Agenten, in einem frischen git worktree zu starten, und isoliert seine Arbeit in einem separaten Checkout.\nGilt nur, wenn das Arbeitsverzeichnis ein git-Repo ist.\nBetrifft neu dispatchte Agenten, nicht bereits laufende."
actions.dashboard_overlay_exit.label: "Overlay schließen"
actions.dashboard_overlay_exit.description: "Zurück zum Dashboard"
actions.dashboard_overlay_exit.long_help: "Verlässt das angeschlossene Sitzungs-Overlay und kehrt zur Dashboard-Liste zurück, ohne den Agenten zu stoppen.\nAuch erreichbar über q im Scrollback, ein neutrales Esc oder die Schließen-Schaltfläche.\nUm den Agenten zu stoppen statt nur abzukoppeln, verwenden Sie Ctrl+X."
actions.dashboard_overlay_prev.label: "Vorherige Sitzung"
actions.dashboard_overlay_prev.description: "Vorherige Sitzung"
actions.dashboard_overlay_next.label: "Nächste Sitzung"
actions.dashboard_overlay_next.description: "Nächste Sitzung"
actions.dashboard_overlay_stop.label: "Stopp"
actions.dashboard_overlay_stop.description: "Agenten stoppen, Sitzung schließen (zurück zum Dashboard)"
actions.dashboard_overlay_stop.long_help: "Stoppt innerhalb eines Sitzungs-Overlays den angeschlossenen Agenten und schließt ihn, und kehrt Sie zur Dashboard-Liste zurück.\nErfordert Bestätigung: Ctrl+X zweimal drücken.\nCtrl+. öffnet hier weiterhin die Übersicht; nur Ctrl+X wird von Stopp übernommen."
actions.edit_prompt_external.label: "Prompt bearbeiten"
actions.edit_prompt_external.description: "Prompt in externem Editor bearbeiten"
actions.edit_prompt_external.long_help: "Öffnet den aktuellen Prompt-Entwurf in $VISUAL oder $EDITOR, mit Fallback auf vi, wenn keines gesetzt ist.\nSpeichern und Schließen des Editors gibt den aktualisierten Text in die Eingabe zurück; es sendet den Prompt nicht.\nIm Minimalmodus für gewöhnliche anhangsfreie Entwürfe verfügbar."
actions.toggle_mouse_capture.label: "Maus-Reporting"
actions.toggle_mouse_capture.description: "Maus-Reporting umschalten (natives Kopieren/Einfügen)"


