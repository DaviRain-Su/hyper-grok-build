settings.contextual_hints.undo.label: "Rückgängig"
settings.contextual_hints.undo.description: "Erinnert Sie daran, dass Ctrl+Z den Prompt wiederherstellt, nachdem Sie ihn geleert haben."
settings.contextual_hints.plan_mode.label: "Planmodus"
settings.contextual_hints.plan_mode.description: "Schlägt den Planmodus (Shift+Tab) vor, wenn Ihr Prompt wie eine Planungsanfrage aussieht."
settings.contextual_hints.image_input.label: "Bildeingabe"
settings.contextual_hints.image_input.description: "Bietet an, ein Bild einzufügen, wenn sich eines in der Zwischenablage befindet und das Modell Bilder akzeptiert."
settings.contextual_hints.send_now.label: "Sofort senden"
settings.contextual_hints.send_now.description: "Erinnert Sie nach dem Einreihen einer Rückfrage mitten in einer Runde, dass Enter in einer leeren Eingabe das oberste eingereihte Element sofort sendet."
settings.contextual_hints.small_screen.label: "Kleiner Bildschirm"
settings.contextual_hints.small_screen.description: "Schlägt /compact-mode einmal pro Lauf vor, wenn das Terminal wenig Zeilen hat."
settings.contextual_hints.word_select.label: "Wortauswahl"
settings.contextual_hints.word_select.description: "Erinnert Sie nach einem Doppelklick auf Konversationstext, während Textauswahl auf Ein-/Ausklappen steht, dass Wortauswahl in den Einstellungen zu finden ist."
settings.contextual_hints.ssh_wrap.label: "SSH-Wrap"
settings.contextual_hints.ssh_wrap.description: "Empfiehlt beim Sitzungsstart über SSH `grok wrap ssh` für Zwischenablage-Weiterleitung und Terminal-Wiederherstellung."
settings.fork_secondary_model.label: "Sekundäres Modell abzweigen"
settings.fork_secondary_model.description: "Modell für den sekundären Agenten beim Abzweigen. „(keine Überschreibung)“ wählen, um zu löschen."

