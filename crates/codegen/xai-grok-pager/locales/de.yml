settings.show_thinking_blocks.description: "Gedanken-/Reasoning-Blöcke des Agenten während des Streamings im Scrollback anzeigen."
settings.prompt_suggestions.label: "Prompt-Vorschläge"
settings.prompt_suggestions.description: "Sagt nach jeder Runde Ihren wahrscheinlichen nächsten Prompt voraus und zeigt ihn als Geist-Text in der Eingabe an (Tab zum Annehmen). Nutzt einen kleinen Modellaufruf pro Runde."
settings.respect_manual_folds.label: "Manuelle Faltungen respektieren"
