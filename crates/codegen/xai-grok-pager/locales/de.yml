settings.screen_mode.description: "Wie grok beim nächsten normalen Start geöffnet wird: Vollbild (Standard, wenn nicht gesetzt) oder Minimal. Schreibt [ui] screen_mode in config.toml. Neustart erforderlich. Diese Sitzung nur mit /minimal oder /fullscreen wechseln."
