settings.display_refresh_auto_cadence.label: "匹配顯示器更新率"
settings.display_refresh_auto_cadence.description: "在高更新率顯示器上,TUI 會更快地串流輸出/捲動以匹配顯示器。關閉則保持經典的 ~60 Hz 節奏。需要重啟。"
settings.scroll_speed.label: "捲動速度"
settings.scroll_speed.description: "滑鼠滾輪和觸控板的捲動速度倍數(1-100)。越大越快。"
settings.scroll_mode.label: "捲動輸入"
settings.scroll_mode.description: "當自動偵測誤判你的裝置時,強制使用滾輪或觸控板捲動行為。"
settings.scroll_mode.choice.auto.display: "自動偵測"
settings.scroll_mode.choice.auto.description: "根據事件時間逐次手勢判斷滾輪或觸控板。預設。"
settings.scroll_mode.choice.wheel.display: "滑鼠滾輪"
settings.scroll_mode.choice.wheel.description: "始終按滾輪刻度處理捲動(每格固定行數)。"
settings.scroll_mode.choice.trackpad.display: "觸控板"
settings.scroll_mode.choice.trackpad.description: "始終按觸控板處理捲動(小數累積)。"
settings.scroll_lines.label: "捲動行數"
settings.scroll_lines.description: "滾輪和觸控板每格捲動的行數(1-10)。未設定時使用各終端自己的設定。"
settings.invert_scroll.label: "反轉捲動"
settings.invert_scroll.description: "反轉垂直捲動方向(自然捲動)。"
settings.keep_text_selection.label: "文字選擇"
settings.keep_text_selection.description: "應用內選擇在螢幕上保留的時長,以及雙擊的行為(摺疊 vs 選擇並複製單詞)。使用終端或多工器自己的選擇時,拖動時按住 Shift(原生複製)。"
settings.keep_text_selection.choice.flash.display: "複製後閃現"
settings.keep_text_selection.choice.flash.description: "滑鼠鬆開時短暫高亮,然後清除。雙擊切換摺疊。預設。"
settings.keep_text_selection.choice.hold.display: "保持到取消"
settings.keep_text_selection.choice.hold.description: "保持選擇可見,直到 Esc、點擊或捲動。雙擊切換摺疊。"
settings.keep_text_selection.choice.word_select.display: "詞語選擇(類終端)"
settings.keep_text_selection.choice.word_select.description: "雙擊選擇並複製單詞,三擊選擇一列;選擇保持到取消。"
settings.coding_data_sharing.label: "編碼資料共享"
settings.coding_data_sharing.description: "控制 SpaceXAI 是否可保留編碼工作階段資料並用於訓練。不影響產品分析;詳見設定與監控文件。"
settings.coding_data_sharing.choice.opt-in.display: "加入"
settings.coding_data_sharing.choice.opt-in.description: "允許 SpaceXAI 保留編碼工作階段資料,用於模型訓練和產品改進。"
settings.coding_data_sharing.choice.opt-out.display: "退出"
settings.coding_data_sharing.choice.opt-out.description: "不保留編碼工作階段資料用於訓練。不會停用產品分析。"
settings.default_selected_permission.label: "預設選中權限項"
settings.default_selected_permission.description: "權限提示中游標預先選中的列。"
settings.default_selected_permission.choice.always_allow_all_sessions.display: "在所有工作階段中總是允許"
settings.default_selected_permission.choice.allow_command_always.display: "總是允許此命令"
settings.default_selected_permission.choice.allow_once.display: "允許一次"
settings.default_selected_permission.choice.reject.display: "拒絕"
settings.toolset.ask_user_question.timeout_enabled.label: "提問逾時"
settings.toolset.ask_user_question.timeout_enabled.description: "開啟後,ask_user_question 工具會在設定時間後逾時,而不是無限期阻塞。"
settings.plan_mode.label: "計劃模式"
settings.plan_mode.description: "開啟後,代理先總結計劃,再執行工具或編輯。"
settings.plan_mode.choice.off.display: "關"
settings.plan_mode.choice.off.description: "代理直接執行工具和編輯檔案(預設)。"
settings.plan_mode.choice.on.display: "開"
settings.plan_mode.choice.on.description: "代理先總結計劃並請求批准,再執行工具。"
settings.show_tips.label: "顯示提示"
settings.show_tips.description: "啟動時顯示每日提示橫幅。需要重啟。"
settings.contextual_hints.label: "顯示情境提示"
settings.contextual_hints.description: "在你工作時顯示簡短的情境鍵盤提示;可逐條開關。"
settings.auto_update.label: "自動更新"
settings.auto_update.description: "啟動時自動下載並安裝 pager 更新。需要重啟。"
settings.hunk_tracker_mode.label: "Hunk 追蹤"
settings.hunk_tracker_mode.description: "代理將哪些檔案變更追蹤為 hunk。關閉則完全停用追蹤(及 LOC 統計)。需要重啟。"
settings.hunk_tracker_mode.choice.agent_only.display: "僅代理"
settings.hunk_tracker_mode.choice.agent_only.description: "只追蹤代理編輯的檔案(預設)。"
settings.hunk_tracker_mode.choice.all_dirty.display: "全部髒檔案"
settings.hunk_tracker_mode.choice.all_dirty.description: "追蹤所有 git 髒檔案,包括外部編輯。"
settings.hunk_tracker_mode.choice.off.display: "關"
settings.hunk_tracker_mode.choice.off.description: "完全停用 hunk 追蹤,同時停用 LOC 追蹤。"
settings.voice_capture_mode.label: "語音捕獲"
settings.voice_capture_mode.description: "語音組合鍵(Ctrl+Space / F8)的行為:切換(按一下開始/停止)或按住說話(按住錄音,鬆開停止;需要 Kitty 協定終端)。"
settings.voice_capture_mode.choice.toggle.display: "切換"
settings.voice_capture_mode.choice.toggle.description: "Ctrl+Space / F8 開始聽寫;再按一次(或 Esc/Enter)停止。"
settings.voice_capture_mode.choice.hold.display: "按住說話"
settings.voice_capture_mode.choice.hold.description: "按住 Ctrl+Space / F8 錄音,鬆開停止。需要 Kitty 協定終端。"
settings.voice_stt_language.label: "語音語言"
settings.voice_stt_language.description: "語音聽寫的語音辨識語言(Grok STT)。預設英文;System 在支援時使用你的系統語言。同時設定數字和貨幣的格式化語言。"
settings.voice_stt_language.choice.auto.display: "系統"
settings.voice_stt_language.choice.auto.description: "系統語言是受支援的 STT 語言時使用系統語言;否則用英文。"
