settings.contextual_hints.undo.label: "復原"
settings.contextual_hints.undo.description: "在你清空輸入框後,提醒你 Ctrl+Z 可以恢復內容。"
settings.contextual_hints.plan_mode.label: "計劃模式"
settings.contextual_hints.plan_mode.description: "當你的輸入看起來像規劃請求時,建議使用計劃模式(Shift+Tab)。"
settings.contextual_hints.image_input.label: "圖片輸入"
settings.contextual_hints.image_input.description: "當剪貼簿有圖片且模型支援圖片時,提示你可以貼上。"
settings.contextual_hints.send_now.label: "立即傳送"
settings.contextual_hints.send_now.description: "當你在回合中排隊了追問後,提醒你在空輸入框按 Enter 可立即傳送佇列首項。"
settings.contextual_hints.small_screen.label: "小螢幕"
settings.contextual_hints.small_screen.description: "終端列數不足時,每次執行建議一次 /compact-mode。"
settings.contextual_hints.word_select.label: "詞語選擇"
settings.contextual_hints.word_select.description: "當「文字選擇」處於摺疊/導覽模式時雙擊對話文字,提醒你「詞語選擇」在設定中。"
settings.contextual_hints.ssh_wrap.label: "SSH 包裝"
settings.contextual_hints.ssh_wrap.description: "SSH 工作階段載入時,推薦使用 `grok wrap ssh` 以獲得剪貼簿轉發和終端恢復。"
settings.fork_secondary_model.label: "分叉次要模型"
settings.fork_secondary_model.description: "分叉時次要代理使用的模型。選擇「(未覆蓋)」可清除。"

