actions.collapse.description: "摺疊選中項"
actions.expand.label: "摺疊"
actions.expand.description: "展開選中項"
actions.toggle_fold.label: "摺疊"
actions.toggle_fold.description: "展開 / 摺疊"
actions.toggle_fold.long_help: "摺疊或展開選中的捲動記錄條目,隱藏或顯示其完整內容。\n瀏覽冗長的工具輸出或推理內容時很好用。\n相關:E 摺疊/展開所有條目,Ctrl+E 切換所有思考塊。"
actions.toggle_expand_all.label: "全部"
actions.toggle_expand_all.description: "全部展開 / 全部摺疊"
actions.toggle_expand_all.long_help: "一次性摺疊或展開所有捲動記錄條目,而 e 只切換選中的列。\n先把長記錄摺疊起來掃一遍標題,再全部展開恢復。\n思考塊有單獨的開關 Ctrl+E。"
actions.expand_all_thinking.label: "展開/摺疊思考"
actions.expand_all_thinking.description: "切換所有思考塊"
actions.expand_all_thinking.long_help: "一鍵顯示或隱藏整個記錄中代理的推理(思考)塊。\n查看代理如何得出結論,或隱藏推理以專注於結果。\n與 E 不同,E 摺疊所有類型的條目。"
actions.toggle_raw.label: "原文"
actions.toggle_raw.description: "切換原始 markdown"
actions.toggle_raw.long_help: "在渲染後的 markdown 和原始源文字之間切換選中條目。\n用於複製精確的 markdown、查看連結目標,或查看渲染器隱藏的格式。\n再按一次返回渲染檢視。"
actions.copy_block_content.label: "複製"
actions.copy_block_content.description: "複製內容"
actions.copy_block_content.long_help: "將選中塊的內容複製到剪貼簿:訊息文字、完整工具輸出或程式碼區塊內容。\n只在支援複製的塊上提供。\n只想複製命令或檔案路徑時,用 Y。"
actions.copy_block_meta.label: "複製命令"
actions.copy_block_meta.description: "複製命令 / 路徑"
actions.copy_block_meta.long_help: "只複製塊的識別碼:工具呼叫的命令列或檔案塊的路徑,不含內容。\n方便重新執行命令或在別處貼上路徑。\n複製完整內容請用小寫 y。"
actions.open_block_viewer.label: "檢視"
actions.open_block_viewer.description: "在檢視器中開啟"
actions.open_block_viewer.long_help: "在專注的全螢幕可捲動檢視器中開啟選中塊。\n適合閱讀長工具輸出、大檔案,或想離開對話流細看的程式碼。\nEsc 返回對話。"
actions.open_next_link.label: "連結"
actions.open_next_link.description: "下一個連結"
actions.open_prev_link.label: "連結"
actions.open_prev_link.description: "上一個連結"
actions.rewind.label: "回退"
actions.rewind.description: "回退到選中回合"
actions.rewind.long_help: "將對話回退到更早的回合,恢復當時的檔案快照並丟棄之後的變更。\n從列表中選擇一個回合並選擇要恢復的內容(全部、僅對話或僅檔案);進行中的回合會先提示取消,衝突或錯誤會在執行後報告。\n破壞性操作:之後的回合會被丟棄。\n空閒時輸入框為空也可透過 Esc Esc(800ms 內)觸發,同 `/rewind`。"
actions.kill_bg_task.label: "終止"
actions.kill_bg_task.description: "終止背景任務"
actions.kill_bg_task.long_help: "終止選中任務塊所屬的背景任務(例如傳送到背景的長時 shell 命令)。\n用於停止失控或不再需要的程序。\n只對存活的任務有效;已完成的任務不受影響。"
actions.send_prompt.label: "傳送"
actions.send_prompt.description: "傳送"
actions.focus_prompt.label: "輸入框"
actions.focus_prompt.description: "聚焦輸入框"
actions.focus_scrollback.label: "捲動記錄"
actions.focus_scrollback.description: "聚焦捲動記錄"
actions.focus_scrollback.long_help: "將焦點從輸入框移到捲動記錄,以便瀏覽對話記錄。\nTab 在簡單和 vim 捲動模式下都可用。\nEsc 保留給清除/回退(空閒)策略,不用於焦點切換。"
actions.cancel_turn.label: "取消"
actions.cancel_turn.description: "取消回合"
actions.cancel_turn.long_help: "中斷代理的當前回合並停止生成,工作階段保持開啟。\n輸入框為空時 Ctrl+C 取消;有未傳送草稿時先清空輸入框,回合繼續執行。\n它停止的是回合而不是應用;結束請用結束快捷鍵。"
actions.cycle_mode.label: "模式"
actions.cycle_mode.description: "循環模式(普通 / 計劃 / 總是批准)"
actions.cycle_mode.long_help: "循環工作階段模式:普通 -> 計劃 -> 總是批准 -> 普通。\n計劃模式讓代理先規劃且不寫檔案;總是批准不詢問直接執行所有工具呼叫。\nCtrl+O 直接切換自動批准。"
actions.toggle_tasks.label: "任務"
actions.toggle_tasks.description: "切換任務面板"
actions.toggle_tasks.long_help: "顯示或隱藏任務面板,列出背景任務及其狀態。\n用於監控或回到你用 Ctrl+B 傳送到背景的工作。\n側面板;關閉以騰出寬度。"
actions.toggle_todos.label: "待辦"
actions.toggle_todos.description: "切換待辦面板"
actions.toggle_todos.long_help: "顯示或隱藏待辦面板:代理當前工作的即時任務清單。\n回合進行中查看它計劃做什麼以及還剩什麼。\n側面板;關閉以騰出寬度。"
actions.toggle_queue.label: "佇列"
actions.toggle_queue.description: "切換提示詞佇列"
actions.toggle_queue.long_help: "顯示或隱藏提示詞佇列。\n佇列讓你在回合進行中排隊後續提示詞,代理完成後會自動傳送。\n本機 macOS VS Code 系:Ctrl+4 主鍵(Ctrl+; / Ctrl+' 備選)。其他終端:Ctrl+;,備選 Ctrl+'。"
actions.open_sessions.label: "工作階段"
actions.open_sessions.description: "開啟工作階段"
actions.open_sessions.long_help: "開啟工作階段瀏覽器,恢復或切換歷史對話。\n選擇一個即可重新接入其完整歷史。\n不同於代理儀表板(Ctrl+\\),後者同時管理多個存活代理。"
actions.open_extensions.label: "擴充"
actions.open_extensions.description: "開啟擴充"
actions.open_extensions.long_help: "開啟 MCP 伺服器和外掛的擴充管理器:查看已連接的內容和它們新增的工具。\n用於確認整合是否載入,或瀏覽可用工具。\n與設定不同,設定存放的是通用應用選項。"
actions.send_to_background.label: "移到背景"
actions.send_to_background.description: "將執行中的任務移到背景"
actions.send_to_background.long_help: "將前景執行中的 Execute 分離,讓它在背景繼續工作,你可以繼續閱讀、排隊提示詞或開始其他工作。\n在任務面板(Ctrl+G)中追蹤和恢復它。\n只有前景 Execute 真的在執行時才有意義。"
actions.interject_prompt.label: "立即傳送"
actions.interject_prompt.description: "執行中立即傳送(取消當前回合)"
actions.interject_prompt.long_help: "在回合中向代理傳送訊息而不取消它(插話),讓它繼續工作的同時你可以引導或補充情境。\n回合執行時按普通 Enter 會排隊追問;此組合鍵則把輸入框內容合併進當前回合。\n輸入框為空時,裸 Enter(或此組合鍵)會強制立即傳送佇列首的追問 —— 無需聚焦佇列面板。在佇列面板上,此組合鍵強制傳送選中列。\n用於在不丟失回合進度的情況下糾正方向。"
actions.enable_voice_mode.label: "語音模式"
actions.enable_voice_mode.description: "開始語音聽寫(Ctrl+Space / F8)"
actions.voice_toggle.label: "麥克風"
actions.voice_toggle.description: "語音聽寫(Ctrl+Space / F8)"
actions.voice_toggle.long_help: "聽寫的麥克風捕獲,綁定到 Ctrl+Space(或 F8 —— 在 Ctrl+Space 被佔用的地方很方便,比如 macOS 輸入法切換;筆電上用 Fn+F8)。\n行為跟隨「語音捕獲」設定:切換(按一下開始,再按一下停止)或按住說話(按住錄音,鬆開停止),按住說話需要 Kitty 協定終端,其他地方回退為切換。`/voice` 在任何地方都可切換。\n語音會直接轉寫進輸入框。"
actions.toggle_multiline.label: "多行"
actions.toggle_multiline.description: "切換多行輸入"
actions.toggle_multiline.long_help: "切換持久多行輸入框,讓編輯器保持展開以編寫更長的訊息。\n用 Shift+Enter 或 Alt+Enter 插入換行(或列尾反斜線);裸 Enter 仍然傳送。\nCtrl+M 在輸入框中切換多行;不在輸入框時開啟模型選擇器。"
actions.bash_mode.label: "shell"
actions.bash_mode.description: "Shell 模式(空輸入框輸入 !)"
actions.bash_mode.long_help: "不離開聊天就執行 shell 命令:在空輸入框開頭輸入 !,然後輸入命令。\n命令輸出會擷取到捲動記錄中。\n刪除開頭的 ! 回到普通輸入框。"
actions.toggle_yolo.label: "yolo"
actions.toggle_yolo.description: "切換總是批准"
actions.toggle_yolo.long_help: "為本工作階段開關自動批准(YOLO)。\n開啟時,代理執行每個工具呼叫(編輯、shell、刪除)都無需逐條確認。\n與 Shift+Tab 循環中的「總是批准」是同一狀態;請謹慎使用。"
actions.new_session.label: "新建"
actions.new_session.description: "新工作階段"
actions.new_session.long_help: "以空的捲動記錄和情境開始全新工作階段。\n需要確認:連按兩次(第一次預備,第二次開始),\n以免誤刪當前對話。"
actions.quit.label: "結束"
actions.quit.description: "結束"
actions.quit.long_help: "結束應用。需要確認:快速連按兩次;\n單獨按一次會被視為誤觸而忽略。\n綁定到 Ctrl+Q,別名為 Ctrl+D(Ctrl+D 在 VS Code 終端中是主鍵)。"
actions.command_palette.label: "命令"
actions.command_palette.description: "命令面板"
actions.command_palette.long_help: "模糊搜尋每個動作和斜線命令,然後按名稱執行。\n不記得鍵位綁定時很好用。\n捲動記錄聚焦時按 ? 也可開啟。"
actions.shortcuts_help.label: "快捷鍵"
actions.shortcuts_help.description: "鍵盤快捷鍵"
actions.shortcuts_help.long_help: "開啟本鍵盤速查表。\n用 j/k 瀏覽,按 e 展開列內說明,或按 Enter 查看快捷鍵的完整詳情頁。\n同時綁定到 Ctrl+. 和 Ctrl+X;底部列會顯示你終端 reliably 傳送的那個。"
actions.model_picker.label: "模型"
actions.model_picker.description: "選擇模型"
actions.model_picker.long_help: "開啟模型選擇器,切換本工作階段使用的模型;選擇對之後的回合生效。\n綁定到 Ctrl+M,但當輸入框聚焦時該組合鍵會切換多行輸入。\n可從捲動記錄或命令面板進入。"
actions.open_settings.label: "設定"
actions.open_settings.description: "開啟設定面板"
actions.open_dashboard.label: "儀表板"
actions.open_dashboard.description: "開啟代理儀表板"
actions.open_dashboard.long_help: "開啟代理儀表板:列出你所有執行中和最近的代理,便於監控和切換。\n從任何地方都可開啟,包括歡迎畫面和工作階段內部。\n在那裡你可以派發、接入、停止、分組和排序代理。"
actions.dashboard_select_next.label: "下一個"
actions.dashboard_select_next.description: "選擇下一列"
actions.dashboard_select_prev.label: "上一個"
actions.dashboard_select_prev.description: "選擇上一列"
actions.dashboard_toggle_pin.label: "置頂"
actions.dashboard_toggle_pin.description: "置頂 / 取消置頂代理"
actions.dashboard_toggle_pin.long_help: "置頂或取消置頂選中的代理,使其無論排序或分組都保持在列表頂部。\n在其他代理來來往往時,讓你關心的代理保持在視野內。\n置頂狀態會跨儀表板工作階段保留。"
actions.dashboard_begin_rename.label: "重新命名"
actions.dashboard_begin_rename.description: "重新命名代理"
actions.dashboard_stop.label: "停止"
actions.dashboard_stop.description: "停止 / 關閉代理"
actions.dashboard_stop.long_help: "停止選中的代理並將其從儀表板移除;執行中的回合會先被中斷。\n用於清理已完成或不需要的代理,無需接入它們。\n覆蓋層中的等價操作(Ctrl+X)會在停止前確認。"
actions.dashboard_cycle_mode.label: "模式"
actions.dashboard_cycle_mode.description: "循環派發模式"
actions.dashboard_cycle_mode.long_help: "循環你從儀表板啟動代理的派發模式:普通、計劃,然後總是批准。\n計劃模式讓新代理先規劃再改檔案;總是批准不提示直接執行其工具。\n與工作階段內 Shift+Tab 循環對應,應用於新的派發。"
actions.dashboard_toggle_grouping.label: "分組"
actions.dashboard_toggle_grouping.description: "切換列分組"
actions.dashboard_toggle_grouping.long_help: "在扁平列表和依狀態分組(如工作中與空閒)之間切換儀表板。\n分組讓需要關注的代理浮現出來;扁平列表保持穩定順序。\n你的選擇會跨工作階段保留。"
actions.dashboard_reorder_up.label: "上移"
actions.dashboard_reorder_up.description: "將代理上移"
actions.dashboard_reorder_down.label: "下移"
actions.dashboard_reorder_down.description: "將代理下移"
actions.dashboard_shortcuts_help.label: "快捷鍵"
actions.dashboard_shortcuts_help.description: "顯示快捷鍵覆蓋層"
actions.dashboard_exit.label: "結束"
actions.dashboard_exit.description: "關閉儀表板"
actions.dashboard_exit.long_help: "關閉儀表板並回到你之前的位置。\nEsc 是級聯的:先關閉開啟的預覽或清除啟用的過濾器,沒有待處理項時才結束。\n將此動作重綁到其他鍵可直接結束。"
actions.dashboard_toggle_auto_approve.label: "總是批准"
actions.dashboard_toggle_auto_approve.description: "切換總是批准"
actions.dashboard_toggle_auto_approve.long_help: "在儀表板上直接切換選中代理的自動批准(YOLO),無需接入它。\n開啟時,該代理執行每個工具呼叫都無需逐條確認。\n工作階段內的等價操作是 Ctrl+O。"
actions.dashboard_open_location_picker.label: "位置"
actions.dashboard_open_location_picker.description: "更改新代理的工作目錄"
actions.dashboard_open_location_picker.long_help: "開啟選擇器,設定新派發的儀表板代理的工作目錄。\n不離開儀表板即可對不同的儲存庫或資料夾啟動代理。\n只影響新派發,不影響已在執行的代理。"
actions.dashboard_toggle_worktree.label: "worktree"
actions.dashboard_toggle_worktree.description: "為新代理切換 worktree 模式"
actions.dashboard_toggle_worktree.long_help: "讓下一個儀表板派發的代理在新的 git worktree 中產生,將其工作隔離在單獨的檢出中。\n僅當工作目錄是 git 儲存庫時適用。\n只影響新派發的代理,不影響已在執行的代理。"
actions.dashboard_overlay_exit.label: "關閉覆蓋層"
actions.dashboard_overlay_exit.description: "返回儀表板"
actions.dashboard_overlay_exit.long_help: "離開接入的工作階段覆蓋層並返回儀表板列表,不停止代理。\n也可透過捲動記錄上的 q、中性 Esc 或關閉按鈕觸發。\n要停止代理而不僅是斷開,請用 Ctrl+X。"
actions.dashboard_overlay_prev.label: "上個工作階段"
actions.dashboard_overlay_prev.description: "上一個工作階段"
actions.dashboard_overlay_next.label: "下個工作階段"
actions.dashboard_overlay_next.description: "下一個工作階段"
actions.dashboard_overlay_stop.label: "停止"
actions.dashboard_overlay_stop.description: "停止代理,關閉工作階段(返回儀表板)"
actions.dashboard_overlay_stop.long_help: "在工作階段覆蓋層內,停止接入的代理並關閉它,返回到儀表板列表。\n需要確認:連按兩次 Ctrl+X。\nCtrl+. 在這裡仍可開啟速查表;只有 Ctrl+X 被停止佔用。"
actions.edit_prompt_external.label: "編輯提示詞"
actions.edit_prompt_external.description: "在外部編輯器中編輯提示詞"
actions.edit_prompt_external.long_help: "在 $VISUAL 或 $EDITOR 中開啟當前提示詞草稿,兩者都未設定時回退到 vi。\n儲存並關閉編輯器會把更新後的文字帶回輸入框;不會傳送提示詞。\n在極簡模式下可用於普通無附件草稿。"
actions.toggle_mouse_capture.label: "滑鼠上報"
actions.toggle_mouse_capture.description: "切換滑鼠上報(原生複製/貼上)"
