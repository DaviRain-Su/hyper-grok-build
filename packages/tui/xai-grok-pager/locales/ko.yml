actions.half_page_up.description: "반 페이지 위로 스크롤"
actions.half_page_down.label: "반 페이지 아래"
actions.half_page_down.description: "반 페이지 아래로 스크롤"
actions.page_up.label: "페이지 위"
actions.page_up.description: "한 페이지 위로 스크롤"
actions.page_down.label: "페이지 아래"
actions.page_down.description: "한 페이지 아래로 스크롤"
actions.collapse.label: "접기"
actions.collapse.description: "선택한 항목 접기"
actions.expand.label: "접기"
actions.expand.description: "선택한 항목 펼치기"
actions.toggle_fold.label: "접기"
actions.toggle_fold.description: "펼치기 / 접기"
actions.toggle_fold.long_help: "선택한 스크롤백 항목을 접거나 펼쳐 전체 내용을 숨기거나 표시합니다.\n긴 도구 출력이나 추론을 빠르게 훑어볼 때 유용합니다.\n관련: E는 모든 항목을 접거나 펼치고, Ctrl+E는 모든思考 블록을 토글합니다."
actions.toggle_expand_all.label: "전체"
actions.toggle_expand_all.description: "전체 펼치기 / 전체 접기"
actions.toggle_expand_all.long_help: "e가 선택한 행만 토글하는 것과 달리, 모든 스크롤백 항목을 한 번에 접거나 펼칩니다.\n긴 기록을 접어서 제목을 훑어본 후, 다시 전체 펼칠 수 있습니다.\n思考 블록은 별도의 토글 Ctrl+E가 있습니다."
actions.expand_all_thinking.label: "思考 펼치기/접기"
actions.expand_all_thinking.description: "모든思考 블록 토글"
actions.expand_all_thinking.long_help: "전체 기록에서 에이전트의 추론(思考) 블록을 한 번의 키 입력으로 표시하거나 숨깁니다.\n에이전트가 답에 도달한 과정을 확인하거나, 결과에 집중하기 위해 추론을 숨길 수 있습니다.\nE와 별개이며, E는 유형에 관계없이 모든 항목을 접습니다."
actions.toggle_raw.label: "원문"
actions.toggle_raw.description: "원본 markdown 토글"
actions.toggle_raw.long_help: "선택한 항목을 렌더링된 markdown과 원본 소스 텍스트 사이에서 전환합니다.\n정확한 markdown을 복사하거나, 링크 대상을 확인하거나, 렌더러가 숨긴 형식을 볼 때 사용합니다.\n다시 누르면 렌더링된 보기로 돌아갑니다."
actions.copy_block_content.label: "복사"
actions.copy_block_content.description: "내용 복사"
actions.copy_block_content.long_help: "선택한 블록의 내용을 클립보드에 복사합니다: 메시지 텍스트, 전체 도구 출력 또는 코드 블록의 내용.\n복사를 지원하는 블록에서만 제공됩니다.\n명령이나 파일 경로만 복사하려면 Y를 사용하세요."
actions.copy_block_meta.label: "명령 복사"
actions.copy_block_meta.description: "명령 / 경로 복사"
actions.copy_block_meta.long_help: "블록의 식별자만 복사합니다: 도구 호출의 명령줄이나 파일 블록의 경로이며, 내용은 포함하지 않습니다.\n명령을 다시 실행하거나 경로를 다른 곳에 붙여넣을 때 편리합니다.\n전체 내용을 복사하려면 소문자 y를 사용하세요."
actions.open_block_viewer.label: "보기"
actions.open_block_viewer.description: "뷰어에서 열기"
actions.open_block_viewer.long_help: "선택한 블록을 집중 가능한 전체 화면 스크롤 가능한 뷰어에서 엽니다.\n긴 도구 출력, 큰 파일 또는 주변 기록에서 벗어나 읽고 싶은 코드에 적합합니다.\nEsc로 대화로 돌아갑니다."
actions.open_next_link.label: "링크"
actions.open_next_link.description: "다음 링크"
actions.open_prev_link.label: "링크"
actions.open_prev_link.description: "이전 링크"
actions.rewind.label: "되감기"
actions.rewind.description: "선택한 턴으로 되감기"
actions.rewind.long_help: "대화를 이전 턴으로 되감아 당시의 파일 스냅샷을 복원하고 이후 변경사항을 폐기합니다.\n목록에서 턴을 선택하고 복원할 내용(전체, 대화만 또는 파일만)을 선택하세요; 실행 중인 턴은 먼저 취소 여부를 묻고, 충돌이나 오류는 실행 후 보고됩니다.\n파괴적 작업: 이후 턴은 폐기됩니다.\n유휴 상태에서 빈 입력框으로도 Esc Esc(800ms 이내)로 실행할 수 있으며, `/rewind`와 동일합니다."
actions.kill_bg_task.label: "강제 종료"
actions.kill_bg_task.description: "백그라운드 작업 강제 종료"
actions.kill_bg_task.long_help: "선택한 작업 블록이 소유한 백그라운드 작업을 종료합니다(예: 백그라운드로 보낸 긴 shell 명령).\n통제 불능이거나 더 이상 필요 없는 프로세스를 정지할 때 사용하세요.\n실행 중인 작업에만 적용되며, 완료된 작업은 영향을 받지 않습니다."
actions.send_prompt.label: "전송"
actions.send_prompt.description: "전송"
actions.focus_prompt.label: "입력框"
actions.focus_prompt.description: "입력框에 포커스"
actions.focus_scrollback.label: "스크롤백"
actions.focus_scrollback.description: "스크롤백에 포커스"
actions.focus_scrollback.long_help: "포커스를 입력框에서 스크롤백으로 이동하여 대화 기록을 탐색할 수 있게 합니다.\nTab은 단순 및 vim 스크롤백 모드 모두에서 작동합니다.\nEsc는 지우기/되감기(유휴) 정책에 예약되어 있으며 포커스 전환에 사용되지 않습니다."
actions.cancel_turn.label: "취소"
actions.cancel_turn.description: "턴 취소"
actions.cancel_turn.long_help: "에이전트의 현재 턴을 중단하고 생성을 중지하며, 세션은 열어 둡니다.\n입력框이 비어 있을 때 Ctrl+C로 취소합니다; 내용이 있는 임시 저장은 먼저 입력框을 비우고 턴은 계속 실행됩니다.\n턴을 중지할 뿐 앱을 중지하지 않습니다; 종료하려면 종료 단축키를 사용하세요."
actions.cycle_mode.label: "모드"
actions.cycle_mode.description: "모드 전환(일반 / 계획 / 항상 승인)"
actions.cycle_mode.long_help: "세션 모드를 전환합니다: 일반 -> 계획 -> 항상 승인 -> 일반.\n계획 모드는 에이전트가 먼저 계획하고 파일을 쓰지 않으며; 항상 승인은 모든 도구 호출을 묻지 않고 실행합니다.\nCtrl+O로 자동 승인을 직접 토글할 수 있습니다."
actions.toggle_tasks.label: "작업"
actions.toggle_tasks.description: "작업 패널 토글"
actions.toggle_tasks.long_help: "백그라운드 작업과 그 상태를 나열하는 작업 패널을 표시하거나 숨깁니다.\nCtrl+B로 백그라운드로 보낸 작업을 모니터링하거나 돌아갈 때 사용하세요.\n사이드 패널입니다; 너비를 확보하려면 끄세요."
actions.toggle_todos.label: "할 일"
actions.toggle_todos.description: "할 일 패널 토글"
actions.toggle_todos.long_help: "할 일 패널을 표시하거나 숨깁니다: 에이전트의 현재 작업에 대한 실시간 작업 체크리스트입니다.\n턴이 실행되는 동안 계획된 작업과 남은 작업을 확인하세요.\n사이드 패널입니다; 너비를 확보하려면 끄세요."
actions.toggle_queue.label: "대기열"
actions.toggle_queue.description: "프롬프트 대기열 토글"
actions.toggle_queue.long_help: "프롬프트 대기열을 표시하거나 숨깁니다.\n대기열을 사용하면 턴이 실행 중일 때 후속 프롬프트를 줄 세울 수 있으며, 에이전트가 완료되면 각각 자동으로 전송됩니다.\n로컬 macOS VS Code 계열: Ctrl+4 주키(Ctrl+; / Ctrl+' 대체). 그 외: Ctrl+; 주키, Ctrl+' 대체."
actions.open_sessions.label: "세션"
actions.open_sessions.description: "세션 열기"
actions.open_sessions.long_help: "세션 브라우저를 열어 과거 대화를 재개하거나 전환합니다.\n하나를 선택하면 전체 기록에 다시 연결됩니다.\n여러 실행 중인 에이전트를 한 번에 관리하는 에이전트 대시보드(Ctrl+\\)와는 다릅니다."
actions.open_extensions.label: "확장"
actions.open_extensions.description: "확장 열기"
actions.open_extensions.long_help: "MCP 서버 및 플러그인의 확장 관리자를 엽니다: 연결된 항목과 추가된 도구를 확인합니다.\n통합이 로드되었는지 확인하거나 사용 가능한 도구를 탐색할 때 사용하세요.\n일반 앱 옵션을 저장하는 설정과는 다릅니다."
actions.send_to_background.label: "백그라운드로"
actions.send_to_background.description: "실행 중인 작업을 백그라운드로 전송"
actions.send_to_background.long_help: "실행 중인 포어그라운드 Execute를 분리하여 백그라운드에서 계속 작업하게 하며, 그동안 읽거나 프롬프트를 대기열에 넣거나 다른 작업을 시작할 수 있습니다.\n작업 패널(Ctrl+G)에서 추적하고 재개할 수 있습니다.\n포어그라운드 Execute가 실제로 실행 중일 때만 의미가 있습니다."
actions.interject_prompt.label: "지금 전송"
actions.interject_prompt.description: "실행 중에 즉시 전송(현재 턴 취소)"
actions.interject_prompt.long_help: "턴을 취소하지 않고 에이전트에게 메시지를 전송하여(끼어들기), 작업을 계속하는 동안 방향을 잡거나 컨텍스트를 추가할 수 있습니다.\n턴 실행 중 일반 Enter는 후속 질문을 대기열에 넣지만, 이 코드는 입력框 텍스트를 현재 턴에 병합합니다.\n빈 입력框에서는 일반 Enter(또는 이 코드)가 대기열 맨 앞의 후속 질문을 강제 전송합니다 —— 대기열 패널에 포커스를 둘 필요가 없습니다. 대기열 패널에서는 이 코드가 선택한 행을 강제 전송합니다.\n턴의 진행 상황을 잃지 않고 방향을 수정할 때 사용하세요."
actions.enable_voice_mode.label: "음성 모드"
actions.enable_voice_mode.description: "음성 받아쓰기 시작(Ctrl+Space / F8)"
actions.voice_toggle.label: "마이크"
actions.voice_toggle.description: "음성 받아쓰기(Ctrl+Space / F8)"
actions.voice_toggle.long_help: "받아쓰기를 위한 마이크 캡처로, Ctrl+Space(또는 F8 —— Ctrl+Space가 점유된 경우 편리함, 예: macOS 입력 소스 전환; 노트북에서는 Fn+F8 사용)에 바인딩됩니다.\n동작은 음성 캡처 설정을 따릅니다: 토글(눌러서 시작, 다시 눌러서 정지) 또는 눌러서 말하기(누르고 있으면 녹음, 놓으면 정지), 눌러서 말하기는 Kitty 프로토콜 터미널이 필요하며 그 외에서는 토글로 폴백됩니다. `/voice`는 어디서나 토글할 수 있습니다.\n음성은 입력框에 직접 전사됩니다."
actions.toggle_multiline.label: "여러 줄"
actions.toggle_multiline.description: "여러 줄 입력 토글"
actions.toggle_multiline.long_help: "지속적인 여러 줄 입력框을 토글하여 더 긴 메시지를 작성할 때 에디터를 펼쳐 둡니다.\nShift+Enter 또는 Alt+Enter(또는 끝에 백슬래시)로 줄바꿈을 삽입하고, 일반 Enter는 여전히 전송합니다.\nCtrl+M은 입력框에서 여러 줄을 토글하고, 입력框 외부에서는 모델 선택기를 엽니다."
actions.bash_mode.label: "shell"
actions.bash_mode.description: "Shell 모드(빈 입력框에서 ! 입력)"
actions.bash_mode.long_help: "채팅을 떠나지 않고 shell 명령을 실행합니다: 빈 입력框의 시작에 !를 입력한 후 명령을 입력하세요.\n명령 출력은 스크롤백에 캡처됩니다.\n시작의 !를 삭제하면 일반 입력框으로 돌아갑니다."
actions.toggle_yolo.label: "yolo"
actions.toggle_yolo.description: "항상 승인 토글"
actions.toggle_yolo.long_help: "이 세션에 대해 자동 승인(YOLO)을 켜거나 끕니다.\n켜져 있을 때, 에이전트는 모든 도구 호출(편집, shell, 삭제)을 작업별 확인 없이 실행합니다.\nShift+Tab 전환의 \"항상 승인\"과 동일한 상태입니다; 주의해서 사용하세요."
actions.new_session.label: "새로 만들기"
actions.new_session.description: "새 세션"
actions.new_session.long_help: "빈 스크롤백과 컨텍스트로 새 세션을 시작합니다.\n확인이 필요합니다: 두 번 누르세요(첫 번째는 준비, 두 번째는 시작),\n실수로 현재 대화를 폐기하지 않도록 합니다."
actions.quit.label: "종료"
actions.quit.description: "종료"
actions.quit.long_help: "앱을 종료합니다. 확인이 필요합니다: 빠르게 두 번 누르세요;\n한 번만 누르면 잘못된 키 입력으로 간주하여 무시됩니다.\nCtrl+Q에 바인딩되며, Ctrl+D가 별칭입니다(Ctrl+D는 VS Code 터미널에서 주키)."
actions.command_palette.label: "명령"
actions.command_palette.description: "명령 팔레트"
actions.command_palette.long_help: "모든 액션과 슬래시 명령을 퍼지 검색한 후 이름으로 실행합니다.\n키 바인딩이 기억나지 않을 때 유용합니다.\n스크롤백에 포커스가 있을 때 ?로도 열 수 있습니다."
actions.shortcuts_help.label: "단축키"
actions.shortcuts_help.description: "키보드 단축키"
actions.shortcuts_help.long_help: "이 키보드 빠른 참조를 엽니다.\nj/k로 탐색하고, e로 행의 인라인 도움말을 펼치거나, Enter로 단축키의 전체 세부 페이지를 확인하세요.\nCtrl+. 및 Ctrl+X에 모두 바인딩되며; 하단 표시줄은 터미널이 안정적으로 전송하는 쪽을 표시합니다."
actions.model_picker.label: "모델"
actions.model_picker.description: "모델 선택"
actions.model_picker.long_help: "모델 선택기를 열어 이 세션의 모델을 전환합니다; 선택은 이후 턴에 적용됩니다.\nCtrl+M에 바인딩되지만, 입력框에 포커스가 있을 때는 이 코드가 여러 줄 입력을 토글합니다.\n스크롤백이나 명령 팔레트에서 접근할 수 있습니다."
actions.next_model.label: "다음 모델"
actions.next_model.description: "다음 범위 지정 모델"
actions.next_model.long_help: "범위 지정 모델 후보 목록([models].enabled_models)을 앞으로 순환합니다.\n후보 목록이 비어 있으면 사용 가능한 모든 모델을 순환합니다.\n후보 목록은 /scoped-models 로 편집합니다. 전체 선택기는 Ctrl+M / /model 그대로입니다.\nAlt+]에 바인딩되어 있습니다(이전은 Alt+[)."
actions.prev_model.label: "이전 모델"
actions.prev_model.description: "이전 범위 지정 모델"
actions.prev_model.long_help: "범위 지정 모델 후보 목록([models].enabled_models)을 뒤로 순환합니다.\n후보 목록이 비어 있으면 사용 가능한 모든 모델을 순환합니다.\nAlt+[에 바인딩되어 있습니다(다음은 Alt+])."
actions.open_settings.label: "설정"
actions.open_settings.description: "설정 패널 열기"
actions.open_dashboard.label: "대시보드"
actions.open_dashboard.description: "에이전트 대시보드 열기"
actions.open_dashboard.long_help: "에이전트 대시보드를 엽니다: 실행 중이고 최근인 모든 에이전트 목록으로 모니터링하고 전환할 수 있습니다.\n환영 화면 및 세션 내부를 포함 어디서나 작동합니다.\n거기서 에이전트를 파견, 연결, 정지, 그룹화 및 재정렬할 수 있습니다."
actions.dashboard_select_next.label: "다음"
actions.dashboard_select_next.description: "다음 행 선택"
actions.dashboard_select_prev.label: "이전"
actions.dashboard_select_prev.description: "이전 행 선택"
actions.dashboard_toggle_pin.label: "고정"
actions.dashboard_toggle_pin.description: "에이전트 고정 / 고정 해제"
actions.dashboard_toggle_pin.long_help: "선택한 에이전트를 고정하거나 해제하여 정렬이나 그룹화와 관계없이 목록 상단에 유지합니다.\n다른 에이전트가 오갈 때 관심 있는 에이전트를 계속 볼 수 있습니다.\n고정은 대시보드 세션 간에 유지됩니다."
actions.dashboard_begin_rename.label: "이름 변경"
actions.dashboard_begin_rename.description: "에이전트 이름 변경"
actions.dashboard_stop.label: "정지"
actions.dashboard_stop.description: "에이전트 정지 / 닫기"
actions.dashboard_stop.long_help: "선택한 에이전트를 정지하고 대시보드에서 행을 제거합니다; 실행 중인 턴은 먼저 중단됩니다.\n연결하지 않고 완료되거나 불필요한 에이전트를 정리할 때 사용하세요.\n오버레이 내의 등가 작업(Ctrl+X)은 정지 전에 확인합니다."
actions.dashboard_cycle_mode.label: "모드"
actions.dashboard_cycle_mode.description: "파견 모드 전환"
actions.dashboard_cycle_mode.long_help: "대시보드에서 시작하는 에이전트의 파견 모드를 전환합니다: 일반, 계획, 그 다음 항상 승인.\n계획은 새 에이전트가 파일을 변경하기 전에 먼저 계획하게 하고; 항상 승인은 도구를 묻지 않고 실행합니다.\n세션 내 Shift+Tab 전환과 대응되며, 새 파견에 적용됩니다."
actions.dashboard_toggle_grouping.label: "그룹"
actions.dashboard_toggle_grouping.description: "행 그룹화 토글"
actions.dashboard_toggle_grouping.long_help: "대시보드를 평면 목록과 상태별 그룹화(예: 작업 중 vs 유휴) 사이에서 전환합니다.\n그룹화는 주의가 필요한 에이전트를 부각시키고; 평면 목록은 안정적인 순서를 유지합니다.\n선택은 세션 간에 유지됩니다."
actions.dashboard_reorder_up.label: "위로 이동"
actions.dashboard_reorder_up.description: "에이전트를 위로 이동"
actions.dashboard_reorder_down.label: "아래로 이동"
actions.dashboard_reorder_down.description: "에이전트를 아래로 이동"
actions.dashboard_shortcuts_help.label: "단축키"
actions.dashboard_shortcuts_help.description: "단축키 오버레이 표시"
actions.dashboard_exit.label: "종료"
actions.dashboard_exit.description: "대시보드 닫기"
actions.dashboard_exit.long_help: "대시보드를 닫고 이전 위치로 돌아갑니다.\nEsc는 단계적입니다: 먼저 열린 미리보기를 닫거나 활성 필터를 지우고, 보류 중인 항목이 없을 때만 종료합니다.\n이 액션을 다른 키에 재바인딩하면 직접 종료할 수 있습니다."
actions.dashboard_toggle_auto_approve.label: "항상 승인"
actions.dashboard_toggle_auto_approve.description: "항상 승인 토글"
actions.dashboard_toggle_auto_approve.long_help: "대시보드에서 직접 선택한 에이전트의 자동 승인(YOLO)을 연결 없이 토글합니다.\n켜져 있을 때, 해당 에이전트는 모든 도구 호출을 작업별 확인 없이 실행합니다.\n세션 내 등가 작업은 Ctrl+O입니다."
actions.dashboard_open_location_picker.label: "위치"
actions.dashboard_open_location_picker.description: "새 에이전트의 작업 디렉터리 변경"
actions.dashboard_open_location_picker.long_help: "새로 파견되는 대시보드 에이전트가 실행될 작업 디렉터리를 설정하는 선택기를 엽니다.\n대시보드를 떠나지 않고 다른 저장소나 폴더에 대해 에이전트를 시작할 수 있습니다.\n새 파견에만 영향을 미치며, 이미 실행 중인 에이전트에는 영향을 주지 않습니다."
actions.dashboard_toggle_worktree.label: "worktree"
actions.dashboard_toggle_worktree.description: "새 에이전트의 worktree 모드 토글"
actions.dashboard_toggle_worktree.long_help: "다음 대시보드 파견 에이전트가 새 git worktree에서 생성되도록 하여, 작업을 별도의 체크아웃으로 격리합니다.\n작업 디렉터리가 git 저장소일 때만 적용됩니다.\n새로 파견되는 에이전트에만 영향을 미치며, 이미 실행 중인 에이전트에는 영향을 주지 않습니다."
actions.dashboard_overlay_exit.label: "오버레이 닫기"
actions.dashboard_overlay_exit.description: "대시보드로 돌아가기"
actions.dashboard_overlay_exit.long_help: "연결된 세션 오버레이를 떠나 에이전트를 정지하지 않고 대시보드 목록으로 돌아갑니다.\n스크롤백의 q, 중립 Esc 또는 닫기 버튼으로도 가능합니다.\n분리가 아닌 에이전트 정지를 원하면 Ctrl+X를 사용하세요."
actions.dashboard_overlay_prev.label: "이전 세션"
actions.dashboard_overlay_prev.description: "이전 세션"
actions.dashboard_overlay_next.label: "다음 세션"
actions.dashboard_overlay_next.description: "다음 세션"
actions.dashboard_overlay_stop.label: "정지"
actions.dashboard_overlay_stop.description: "에이전트 정지, 세션 닫기(대시보드로 복귀)"
actions.dashboard_overlay_stop.long_help: "세션 오버레이 내에서, 연결된 에이전트를 정지하고 닫아 대시보드 목록으로 돌아갑니다.\n확인이 필요합니다: Ctrl+X를 두 번 누르세요.\nCtrl+.는 여기서 여전히 빠른 참조를 열 수 있습니다; Ctrl+X만 정지에 사용됩니다."
actions.edit_prompt_external.label: "프롬프트 편집"
actions.edit_prompt_external.description: "외부 에디터에서 프롬프트 편집"
actions.edit_prompt_external.long_help: "현재 프롬프트 임시 저장을 $VISUAL 또는 $EDITOR에서 열고, 둘 다 설정되지 않았을 때는 vi로 폴백합니다.\n에디터를 저장하고 닫으면 업데이트된 텍스트가 입력框으로 반환됩니다; 프롬프트는 전송되지 않습니다.\n최소 모드에서 일반 첨부 파일 없는 임시 저장에 사용할 수 있습니다."
actions.toggle_mouse_capture.label: "마우스 리포팅"
actions.toggle_mouse_capture.description: "마우스 리포팅 토글(네이티브 복사/붙여넣기)"
