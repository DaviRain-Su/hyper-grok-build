settings.contextual_hints.ssh_wrap.description: "SSH로 세션을 로드할 때 클립보드 전달 및 터미널 복원을 위해 `grok wrap ssh`를 추천합니다."
settings.fork_secondary_model.label: "포크 보조 모델"
settings.fork_secondary_model.description: "포크할 때 보조 에이전트가 사용하는 모델입니다. \"(미설정)\"을 선택하여清除할 수 있습니다."

