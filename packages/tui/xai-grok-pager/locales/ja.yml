settings.contextual_hints.undo.label: "元に戻す"
settings.contextual_hints.undo.description: "入力を消去した後、Ctrl+Z で内容を復元できることをリマインドします。"
settings.contextual_hints.plan_mode.label: "プランモード"
settings.contextual_hints.plan_mode.description: "プロンプトが計画依頼に見えるとき、プランモード(Shift+Tab)を提案します。"
settings.contextual_hints.image_input.label: "画像入力"
settings.contextual_hints.image_input.description: "クリップボードに画像がありモデルが画像を受け付ける場合、貼り付けを提案します。"
settings.contextual_hints.send_now.label: "今すぐ送信"
settings.contextual_hints.send_now.description: "ターン中にフォローアップをキューに追加した後、空のプロンプトで Enter を押すとキュー先頭の項目を即時送信できることをリマインドします。"
settings.contextual_hints.small_screen.label: "小さい画面"
settings.contextual_hints.small_screen.description: "ターミナルの行数が少ないとき、実行ごとに 1 回 /compact-mode を提案します。"
settings.contextual_hints.word_select.label: "単語選択"
settings.contextual_hints.word_select.description: "テキスト選択が折りたたみ/ナビゲーションモードのときに会話テキストをダブルクリックした場合、単語選択が設定にあることをリマインドします。"
settings.contextual_hints.ssh_wrap.label: "SSH ラップ"
settings.contextual_hints.ssh_wrap.description: "SSH セッションのロード時、クリップボード転送とターミナル復元のために `grok wrap ssh` を推奨します。"
settings.fork_secondary_model.label: "フォーク時のセカンダリモデル"
settings.fork_secondary_model.description: "フォーク時にセカンダリエージェントが使用するモデル。「(上書きなし)」を選択するとクリアします。"

