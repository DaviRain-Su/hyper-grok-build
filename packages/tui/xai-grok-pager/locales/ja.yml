shortcuts_help.redo_desc: "元に戻したプロンプトの編集をやり直す"
shortcuts_help.undo_long_help: "プロンプトエディタの直前の変更を元に戻します。\n入力、削除、行/単語キル、ドラフトのクリアをカバーします。"
shortcuts_help.redo_long_help: "プロンプトエディタで元に戻した変更をやり直します。\nCtrl+Shift+Z がプライマリ、Ctrl+R が代替です。"
settings.voice_keybind_enabled.label: "音声ショートカット"
settings.voice_keybind_enabled.description: "Ctrl+Space / F8 の音声入力ショートカットを有効にします。オフの場合、キーは無視されますが、/voice は引き続き入力を開始できます。"
