settings.prompt_suggestions.description: "各ターンの後、次に入力しそうなプロンプトを予測し、入力欄にゴーストテキストとして表示します(Tab で採用)。ターンごとに小さなモデル呼び出しを 1 回使用します。"
settings.respect_manual_folds.label: "手動折りたたみを保持"
settings.respect_manual_folds.description: "ストリーミング中に手動で折りたたんだブロックをそのまま維持し、ブロックを展開したときに自動スクロールを停止します。実験的。"
settings.group_tool_verbs.label: "ツール呼び出しをグループ化"
settings.group_tool_verbs.description: "連続する読み取り/検索/リストのツール呼び出しとサブエージェント行を 1 つの要約行に折りたたみます。完了した思考もグループに折りたたまれます。"
settings.collapsed_edit_blocks.label: "編集ブロックを折りたたむ"
settings.collapsed_edit_blocks.description: "編集を 1 行の +N/-M 差分統計サマリーとして表示し、同じファイルへの編集が連続する場合は 1 つのブロックにマージします。行を展開すると差分を確認できます。"
settings.display_refresh_auto_cadence.label: "ディスプレイのリフレッシュレートに合わせる"
settings.display_refresh_auto_cadence.description: "高リフレッシュレートのディスプレイでは、TUI がディスプレイに合わせてより速くストリーミング/スクロールします。オフの場合は従来の ~60 Hz のペースを維持します。再起動が必要です。"
settings.scroll_speed.label: "スクロール速度"
settings.scroll_speed.description: "マウスホイールとトラックパッドのスクロール速度の倍率(1-100)。大きいほど速くなります。"
settings.scroll_mode.label: "スクロール入力"
settings.scroll_mode.description: "自動検出がデバイスを誤認したとき、ホイールまたはトラックパッドのスクロール挙動を強制します。"
settings.scroll_mode.choice.auto.display: "自動検出"
settings.scroll_mode.choice.auto.description: "イベントのタイミングからジェスチャごとにホイールかトラックパッドかを判定します。デフォルト。"
settings.scroll_mode.choice.wheel.display: "マウスホイール"
settings.scroll_mode.choice.wheel.description: "スクロールを常にホイールのノッチとして扱います(ティックごとに固定行数)。"
settings.scroll_mode.choice.trackpad.display: "トラックパッド"
settings.scroll_mode.choice.trackpad.description: "スクロールを常にトラックパッドとして扱います(小数の累積)。"
settings.scroll_lines.label: "スクロール行数"
settings.scroll_lines.description: "ホイールとトラックパッドの各ティックのスクロール行数(1-10)。未設定時は各ターミナル自身のプロファイルが適用されます。"
settings.invert_scroll.label: "スクロールを反転"
settings.invert_scroll.description: "垂直スクロールの方向を反転します(ナチュラルスクロール)。"
settings.keep_text_selection.label: "テキスト選択"
settings.keep_text_selection.description: "アプリ内の選択が画面に残る時間と、ダブルクリックの挙動(折りたたみか、単語の選択とコピーか)。ターミナルやマルチプレクサ自身の選択には、ドラッグ中に Shift を押したままにします(ネイティブコピー)。"
settings.keep_text_selection.choice.flash.display: "コピー後にフラッシュ"
settings.keep_text_selection.choice.flash.description: "マウスアップ時に短くハイライトし、消去します。ダブルクリックで折りたたみを切り替えます。デフォルト。"
settings.keep_text_selection.choice.hold.display: "解除まで保持"
settings.keep_text_selection.choice.hold.description: "Esc、クリック、またはスクロールまで選択を表示し続けます。ダブルクリックで折りたたみを切り替えます。"
settings.keep_text_selection.choice.word_select.display: "単語選択(ターミナル風)"
settings.keep_text_selection.choice.word_select.description: "ダブルクリックで単語を選択してコピー、トリプルクリックで行を選択します。選択は解除まで保持されます。"
settings.coding_data_sharing.label: "コーディングデータの共有"
settings.coding_data_sharing.description: "SpaceXAI がコーディングセッションデータを保持しトレーニングに使用できるかを制御します。プロダクト分析には影響しません。設定と監視のドキュメントを参照してください。"
settings.coding_data_sharing.choice.opt-in.display: "オプトイン"
settings.coding_data_sharing.choice.opt-out.display: "オプトアウト"
settings.default_selected_permission.label: "デフォルト選択権限項目"
settings.default_selected_permission.description: "権限プロンプトでカーソルがあらかじめ選択する行。"
settings.default_selected_permission.choice.always_allow_all_sessions.display: "すべてのセッションで常に許可"
settings.default_selected_permission.choice.allow_command_always.display: "このコマンドを常に許可"
settings.default_selected_permission.choice.allow_once.display: "一度だけ許可"
settings.default_selected_permission.choice.reject.display: "拒否"
settings.toolset.ask_user_question.timeout_enabled.label: "質問タイムアウト"
settings.toolset.ask_user_question.timeout_enabled.description: "オンのとき、ask_user_question ツールは設定時間後にタイムアウトし、無限にブロックしません。"
settings.plan_mode.label: "プランモード"
settings.plan_mode.description: "オンのとき、エージェントはツールを実行したり編集したりする前に計画を要約します。"
settings.plan_mode.choice.off.display: "オフ"
settings.plan_mode.choice.off.description: "エージェントがツールを実行しファイルを直接編集します(デフォルト)。"
settings.plan_mode.choice.on.display: "オン"
settings.plan_mode.choice.on.description: "エージェントが計画を要約し、ツールを実行する前に承認を求めます。"
settings.show_tips.label: "ヒントを表示"
settings.show_tips.description: "起動時に今日のヒントバナーを表示します。再起動が必要です。"
settings.contextual_hints.label: "コンテキストヒントを表示"
settings.contextual_hints.description: "作業中に短いコンテキスト別のキーボードヒントを表示します。各ヒントは個別に切り替えられます。"
settings.auto_update.label: "自動更新"
settings.auto_update.description: "起動時に pager の更新を自動的にダウンロードしてインストールします。再起動が必要です。"
settings.hunk_tracker_mode.label: "Hunk トラッカー"
settings.hunk_tracker_mode.description: "エージェントがどのファイル変更を hunk として追跡するか。オフにすると追跡(および LOC 統計)を完全に無効化します。再起動が必要です。"
settings.hunk_tracker_mode.choice.agent_only.display: "エージェントのみ"
settings.hunk_tracker_mode.choice.agent_only.description: "エージェントが編集したファイルのみ追跡します(デフォルト)。"
settings.hunk_tracker_mode.choice.all_dirty.display: "すべてのダーティファイル"
settings.hunk_tracker_mode.choice.all_dirty.description: "外部編集を含むすべての git ダーティファイルを追跡します。"
settings.hunk_tracker_mode.choice.off.display: "オフ"
settings.hunk_tracker_mode.choice.off.description: "hunk トラッキングを完全に無効化します。LOC トラッキングも無効になります。"
settings.voice_capture_mode.label: "音声キャプチャ"
settings.voice_capture_mode.description: "音声コード(Ctrl+Space / F8)の挙動:トグル(押して開始/停止)またはホールド(押している間録音、離すと停止。Kitty プロトコルターミナルが必要)。"
settings.voice_capture_mode.choice.toggle.display: "トグル"
settings.voice_capture_mode.choice.toggle.description: "Ctrl+Space / F8 でディクテーションを開始。もう一度押す(または Esc/Enter)で停止します。"
settings.voice_capture_mode.choice.hold.display: "ホールド"
settings.voice_capture_mode.choice.hold.description: "Ctrl+Space / F8 を押している間録音し、離すと停止します。Kitty プロトコルターミナルが必要です。"
settings.voice_stt_language.label: "音声言語"
settings.voice_stt_language.description: "音声ディクテーションの音声認識言語(Grok STT)。デフォルトは英語。System はサポートされている場合システムのロケールを使用します。数字と通貨のフォーマット言語も設定します。"
settings.voice_stt_language.choice.auto.display: "システム"
settings.voice_stt_language.choice.auto.description: "システムロケールがサポート対象の STT 言語であればそれを使用し、それ以外は英語を使用します。"
