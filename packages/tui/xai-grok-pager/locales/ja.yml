actions.collapse.label: "折りたたむ"
actions.collapse.description: "選択エントリを折りたたむ"
actions.expand.label: "折りたたむ"
actions.expand.description: "選択エントリを展開"
actions.toggle_fold.label: "折りたたむ"
actions.toggle_fold.description: "展開 / 折りたたみ"
actions.toggle_fold.long_help: "選択したスクロールバックエントリを折りたたむ、または展開し、本文の表示/非表示を切り替えます。\n長いツール出力や推論を読み流すのに便利です。\n関連:E ですべてのエントリを折りたたみ/展開、Ctrl+E ですべての思考ブロックを切り替え。"
actions.toggle_expand_all.label: "すべて"
actions.toggle_expand_all.description: "すべて展開 / すべて折りたたむ"
actions.toggle_expand_all.long_help: "すべてのスクロールバックエントリを一度に折りたたむ、または展開します。e は選択行のみを切り替えます。\n長いトランスクリプトを折りたたんでヘッダーを眺め、再度すべて展開して戻せます。\n思考ブロックには独自の切り替え Ctrl+E があります。"
actions.expand_all_thinking.label: "思考の展開/折りたたみ"
actions.expand_all_thinking.description: "すべての思考ブロックを切り替え"
actions.expand_all_thinking.long_help: "トランスクリプト全体のエージェントの推論(思考)ブロックを 1 キーで表示または非表示にします。\nエージェントがどう結論に至ったかを確認したり、結果に集中するために推論を隠したりできます。\nE とは別で、E は種類に関わらずすべてのエントリを折りたたみます。"
actions.toggle_raw.label: "生形式"
actions.toggle_raw.description: "生の markdown を切り替え"
actions.toggle_raw.long_help: "選択エントリをレンダリング済みの markdown と生のソーステキストの間で切り替えます。\n正確な markdown のコピー、リンク先の確認、レンダラーが隠す書式の確認に使用します。\nもう一度押すとレンダリング表示に戻ります。"
actions.copy_block_content.label: "コピー"
actions.copy_block_content.description: "内容をコピー"
actions.copy_block_content.long_help: "選択ブロックの本文をクリップボードにコピーします:メッセージテキスト、完全なツール出力、コードブロックの内容。\nコピー対応のブロックでのみ提供されます。\nコマンドやファイルパスだけをコピーする場合は Y を使用してください。"
actions.copy_block_meta.label: "コマンドコピー"
actions.copy_block_meta.description: "コマンド / パスをコピー"
actions.copy_block_meta.long_help: "ブロックの識別子のみをコピーします:ツール呼び出しのコマンドライン、またはファイルブロックのパス(本文を含まない)。\nコマンドの再実行やパスの別場所への貼り付けに便利です。\n完全な内容をコピーするには小文字の y を使用してください。"
actions.open_block_viewer.label: "表示"
actions.open_block_viewer.description: "ビューアーで開く"
actions.open_block_viewer.long_help: "選択ブロックを集中したスクロール可能な全画面ビューアーで開きます。\n長いツール出力、大きなファイル、周囲のトランスクリプトから離れて読みたいコードに最適です。\nEsc で会話に戻ります。"
actions.open_next_link.label: "リンク"
actions.open_next_link.description: "次のリンク"
actions.open_prev_link.label: "リンク"
actions.open_prev_link.description: "前のリンク"
actions.rewind.label: "巻き戻し"
actions.rewind.description: "選択ターンまで巻き戻し"
actions.rewind.long_help: "会話を以前のターンまで巻き戻し、当時のファイルスナップショットを復元して以降の変更を破棄します。\nリストからターンを選び、復元対象(すべて、会話のみ、またはファイルのみ)を選択します。実行中のターンはまずキャンセルの提案があり、競合やエラーは実行後に報告されます。\n破壊的:以降のターンは破棄されます。\n入力が空のアイドル時に Esc Esc(800ms 以内)でも起動でき、`/rewind` と同じです。"
actions.kill_bg_task.label: "強制終了"
actions.kill_bg_task.description: "バックグラウンドタスクを強制終了"
actions.kill_bg_task.long_help: "選択タスクブロックが所有するバックグラウンドタスクを終了します(例: バックグラウンドに送った長時間のシェルコマンド)。\n暴走した、または不要になったプロセスを止めるために使用します。\n生存中のタスクにのみ有効です。完了済みのタスクには影響しません。"
actions.send_prompt.label: "送信"
actions.send_prompt.description: "送信"
actions.focus_prompt.label: "プロンプト"
actions.focus_prompt.description: "プロンプトにフォーカス"
actions.focus_scrollback.label: "スクロールバック"
actions.focus_scrollback.description: "スクロールバックにフォーカス"
actions.focus_scrollback.long_help: "フォーカスをプロンプトからスクロールバックに移し、トランスクリプトをナビゲートできるようにします。\nTab は simple と vim の両スクロールバックモードで機能します。\nEsc はクリア/巻き戻し(アイドル)ポリシーに予約されており、フォーカス切り替えには使用されません。"
actions.cancel_turn.label: "キャンセル"
actions.cancel_turn.description: "ターンをキャンセル"
actions.cancel_turn.long_help: "エージェントの現在のターンを中断し生成を停止します。セッションは開いたままです。\nプロンプトが空のとき Ctrl+C でキャンセルします。未送信のドラフトがある場合はまずプロンプトを消去し、ターンは実行を続けます。\n停止するのはターンであってアプリではありません。終了するには終了ショートカットを使用してください。"
actions.cycle_mode.label: "モード"
actions.cycle_mode.description: "モードを切り替え(通常 / プラン / 常に承認)"
actions.cycle_mode.long_help: "セッションモードを切り替えます:通常 -> プラン -> 常に承認 -> 通常。\nプランモードではエージェントがまず計画し、ファイルは書き込みません。常に承認はすべてのツール呼び出しを確認なしで実行します。\nCtrl+O で自動承認を直接切り替えられます。"
actions.toggle_tasks.label: "タスク"
actions.toggle_tasks.description: "タスクペインの切り替え"
actions.toggle_tasks.long_help: "タスクペインを表示または非表示にし、バックグラウンドタスクとその状態を一覧します。\nCtrl+B でバックグラウンドに送った作業の監視や復帰に使用します。\nサイドペインです。幅を広げるにはオフにしてください。"
actions.toggle_todos.label: "TODO"
actions.toggle_todos.description: "TODO ペインの切り替え"
actions.toggle_todos.long_help: "TODO ペインを表示または非表示にします:エージェントの現在の作業に対するライブタスクリストです。\nターンの実行中に計画と残り作業を確認できます。\nサイドペインです。幅を広げるにはオフにしてください。"
actions.toggle_queue.label: "キュー"
actions.toggle_queue.description: "プロンプトキューの切り替え"
actions.toggle_queue.long_help: "プロンプトキューを表示または非表示にします。\nキューを使うとターン実行中にフォローアッププロンプトを並べられ、エージェントの完了後にそれぞれ自動的に送信されます。\nローカル macOS VS Code 系:Ctrl+4 が主キー(Ctrl+; / Ctrl+' は代替)。その他のターミナル:Ctrl+; が主で Ctrl+' が代替。"
actions.open_sessions.label: "セッション"
actions.open_sessions.description: "セッションを開く"
actions.open_sessions.long_help: "セッションブラウザーを開き、過去の会話を再開または切り替えます。\n1 つ選ぶとその完全な履歴に再接続します。\nエージェントダッシュボード(Ctrl+\\)とは別で、ダッシュボードは複数のライブエージェントを一度に管理します。"
actions.open_extensions.label: "拡張"
actions.open_extensions.description: "拡張を開く"
actions.open_extensions.long_help: "MCP サーバーとプラグインの拡張マネージャーを開きます:接続中の内容と追加されたツールを確認できます。\n統合が読み込まれたかの確認や、利用可能なツールの閲覧に使用します。\n一般的なアプリオプションを保持する設定とは別です。"
actions.send_to_background.label: "バックグラウンドへ"
actions.send_to_background.description: "実行中のタスクをバックグラウンドへ送る"
actions.send_to_background.long_help: "実行中のフォアグラウンドの Execute を切り離し、バックグラウンドで動作を続けさせます。読み続けたり、プロンプトをキューに追加したり、別の作業を始めたりできます。\nタスクペイン(Ctrl+G)から追跡および復帰できます。\nフォアグラウンドの Execute が実際に実行中のときにのみ意味があります。"
actions.interject_prompt.label: "今すぐ送信"
actions.interject_prompt.description: "実行中に即時送信(現在のターンはキャンセル)"
actions.interject_prompt.long_help: "ターン中にエージェントへメッセージを送信し、キャンセルせずに割り込みます。エージェントが動作を続ける間に方向の修正やコンテキストの追加ができます。\nターン実行中の通常の Enter はフォローアップを後で送るためキューに追加しますが、このコードはコンポーザーのテキストを現在のターンにマージします。\n空のコンポーザーでは、素の Enter(またはこのコード)がキューの先頭のフォローアップを強制送信します — キューペインにフォーカスする必要はありません。キューペインでは、このコードが選択行を強制送信します。\nターンの進行を失わずに方向を修正するために使用してください。"
actions.enable_voice_mode.label: "音声モード"
actions.enable_voice_mode.description: "音声ディクテーションを開始(Ctrl+Space / F8)"
actions.voice_toggle.label: "マイク"
actions.voice_toggle.description: "音声ディクテーション(Ctrl+Space / F8)"
actions.voice_toggle.long_help: "ディクテーション用のマイクキャプチャ。Ctrl+Space(または F8 — Ctrl+Space が占有されている場所、例えば macOS の入力ソース切替で便利。ノート PC では Fn+F8)に割り当て。\n挙動は音声キャプチャ設定に従います:トグル(押して開始、もう一度押して停止)またはホールド(押している間録音、離すと停止)。ホールドには Kitty プロトコルターミナルが必要で、その他ではトグルにフォールバックします。`/voice` はどこでもトグルできます。\n音声は直接プロンプトに文字起こしされます。"
actions.toggle_multiline.label: "複数行"
actions.toggle_multiline.description: "複数行を切り替え"
actions.toggle_multiline.long_help: "永続的な複数行プロンプトを切り替え、長いメッセージを書くためにエディタを展開したままにします。\nShift+Enter または Alt+Enter(または末尾のバックスラッシュ)で改行を挿入します。素の Enter は引き続き送信します。\nCtrl+M はプロンプト内で複数行を切り替えます。プロンプト外ではモデルピッカーを開きます。"
actions.bash_mode.label: "shell"
actions.bash_mode.description: "シェルモード(空のプロンプトで ! を入力)"
actions.bash_mode.long_help: "チャットから離れずにシェルコマンドを実行します:空のプロンプトの先頭で ! を入力し、続けてコマンドを入力します。\nコマンドの出力はスクロールバックに取り込まれます。\n先頭の ! を削除すると通常のプロンプトに戻ります。"
actions.toggle_yolo.label: "yolo"
actions.toggle_yolo.description: "常に承認を切り替え"
actions.toggle_yolo.long_help: "このセッションの自動承認(YOLO)をオン/オフします。\nオンのとき、エージェントはすべてのツール呼び出し(編集、シェル、削除)を個別の確認なしで実行します。\nShift+Tab のサイクルの「常に承認」と同じ状態です。慎重に使用してください。"
actions.new_session.label: "新規"
actions.new_session.description: "新規セッション"
actions.new_session.long_help: "空のスクロールバックとコンテキストで新規セッションを開始します。\n確認が必要です:2 回連続で押してください(1 回目で準備、2 回目で開始)\n— 現在の会話を誤って破棄しないように。"
actions.quit.label: "終了"
actions.quit.description: "終了"
actions.quit.long_help: "アプリを終了します。確認が必要です:素早く 2 回連続で押してください。\n1 回だけの押下は誤操作とみなされ無視されます。\nCtrl+Q に割り当て、Ctrl+D をエイリアスとします(Ctrl+D は VS Code のターミナルで主キー)。"
actions.command_palette.label: "コマンド"
actions.command_palette.description: "コマンドパレット"
actions.command_palette.long_help: "すべてのアクションとスラッシュコマンドをあいまい検索し、名前で実行します。\nキーバインドを思い出せないときに便利です。\nスクロールバックにフォーカスがあるとき ? でも開けます。"
actions.shortcuts_help.label: "ショートカット"
actions.shortcuts_help.description: "キーボードショートカット"
actions.shortcuts_help.long_help: "このキーボード早見表を開きます。\nj/k でブラウズ、e で行のインラインヘルプを展開、Enter でショートカットの完全な詳細ページを表示します。\nCtrl+. と Ctrl+X の両方に割り当てられており、バーはターミナルが確実に送信する方を表示します。"
actions.model_picker.label: "モデル"
actions.model_picker.description: "モデルを選択"
actions.model_picker.long_help: "モデルピッカーを開き、このセッションのモデルを切り替えます。選択は以降のターンに適用されます。\nCtrl+M に割り当てられていますが、プロンプトにフォーカスがあるときはそのコードが複数行を切り替えます。\nスクロールバックまたはコマンドパレットから開けます。"
actions.next_model.label: "次のモデル"
actions.next_model.description: "次のスコープ付きモデル"
actions.next_model.long_help: "スコープ付きモデルの短いリスト（[models].enabled_models）を順方向に切り替えます。\n短いリストが空の場合は、使用可能なすべてのモデルを切り替えます。\n短いリストは /scoped-models で編集します。完全なピッカーは Ctrl+M / /model のままです。\nAlt+] に割り当てられています（前へは Alt+[）。"
actions.prev_model.label: "前のモデル"
actions.prev_model.description: "前のスコープ付きモデル"
actions.prev_model.long_help: "スコープ付きモデルの短いリスト（[models].enabled_models）を逆方向に切り替えます。\n短いリストが空の場合は、使用可能なすべてのモデルを切り替えます。\nAlt+[ に割り当てられています（次へは Alt+]）。"
actions.open_settings.label: "設定"
actions.open_settings.description: "設定モーダルを開く"
actions.open_dashboard.label: "ダッシュボード"
actions.open_dashboard.description: "エージェントダッシュボードを開く"
actions.open_dashboard.long_help: "エージェントダッシュボードを開きます:実行中および最近のすべてのエージェントのリストで、監視と切り替えができます。\nウェルカム画面やセッション内を含め、どこからでも開けます。\nそこからエージェントのディスパッチ、アタッチ、停止、グループ化、並べ替えができます。"
actions.dashboard_select_next.label: "次へ"
actions.dashboard_select_next.description: "次の行を選択"
actions.dashboard_select_prev.label: "前へ"
actions.dashboard_select_prev.description: "前の行を選択"
actions.dashboard_toggle_pin.label: "ピン留め"
actions.dashboard_toggle_pin.description: "エージェントをピン留め / 解除"
actions.dashboard_toggle_pin.long_help: "選択したエージェントをピン留めまたは解除し、並べ替えやグループ化に関わらずリストの先頭に維持します。\n他のエージェントが出入りする中で、関心のあるエージェントを視野に保てます。\nピン留めはダッシュボードセッションをまたいで保持されます。"
actions.dashboard_begin_rename.label: "名前変更"
actions.dashboard_begin_rename.description: "エージェントの名前を変更"
actions.dashboard_stop.label: "停止"
actions.dashboard_stop.description: "エージェントを停止 / 閉じる"
actions.dashboard_stop.long_help: "選択したエージェントを停止し、ダッシュボードからその行を削除します。実行中のターンはまず中断されます。\nアタッチせずに完了済みや不要なエージェントを消すために使用します。\nオーバーレイ内の同等操作(Ctrl+X)は停止前に確認します。"
actions.dashboard_cycle_mode.label: "モード"
actions.dashboard_cycle_mode.description: "ディスパッチモードを切り替え"
actions.dashboard_cycle_mode.long_help: "ダッシュボードから起動するエージェントのディスパッチモードを切り替えます:通常、プラン、常に承認の順。\nプランでは新しいエージェントがファイル変更前に計画します。常に承認はツールを確認なしで実行します。\nセッション内の Shift+Tab サイクルと対応し、新規ディスパッチに適用されます。"
actions.dashboard_toggle_grouping.label: "グループ化"
actions.dashboard_toggle_grouping.description: "行のグループ化を切り替え"
actions.dashboard_toggle_grouping.long_help: "ダッシュボードをフラットリストと状態別のグループ(作業中とアイドルなど)の間で切り替えます。\nグループ化は注意が必要なエージェントを浮き彫りにします。フラットリストは安定した順序を保ちます。\n選択はセッションをまたいで保持されます。"
actions.dashboard_reorder_up.label: "上へ"
actions.dashboard_reorder_up.description: "エージェントを上へ移動"
actions.dashboard_reorder_down.label: "下へ"
actions.dashboard_reorder_down.description: "エージェントを下へ移動"
actions.dashboard_shortcuts_help.label: "ショートカット"
actions.dashboard_shortcuts_help.description: "ショートカットオーバーレイを表示"
actions.dashboard_exit.label: "終了"
actions.dashboard_exit.description: "ダッシュボードを閉じる"
actions.dashboard_exit.long_help: "ダッシュボードを閉じ、元の場所に戻ります。\nEsc はカスケードします:開いているプレビューを閉じるかアクティブなフィルターをクリアし、保留中のものがなくなってから終了します。\nこのアクションを別のキーに再割り当てすると直接終了できます。"
actions.dashboard_toggle_auto_approve.label: "常に承認"
actions.dashboard_toggle_auto_approve.description: "常に承認を切り替え"
actions.dashboard_toggle_auto_approve.long_help: "ダッシュボードから選択したエージェントの自動承認(YOLO)を、アタッチせずに直接切り替えます。\nオンのとき、そのエージェントはすべてのツール呼び出しを個別の確認なしで実行します。\nセッションごとの同等操作はセッション内の Ctrl+O です。"
actions.dashboard_open_location_picker.label: "場所"
actions.dashboard_open_location_picker.description: "新規エージェントの作業ディレクトリを変更"
actions.dashboard_open_location_picker.long_help: "ピッカーを開き、新しくディスパッチされるダッシュボードエージェントが実行される作業ディレクトリを設定します。\nダッシュボードから離れずに別のリポジトリやフォルダーへエージェントを起動できます。\n新規ディスパッチにのみ影響し、実行中のエージェントには影響しません。"
actions.dashboard_toggle_worktree.label: "worktree"
actions.dashboard_toggle_worktree.description: "新規エージェントの worktree モードを切り替え"
actions.dashboard_toggle_worktree.long_help: "次にダッシュボードからディスパッチされるエージェントを新しい git worktree で生成し、作業を別のチェックアウトに隔離します。\n作業ディレクトリが git リポジトリのときにのみ適用されます。\n新しくディスパッチされるエージェントにのみ影響し、実行中のエージェントには影響しません。"
actions.dashboard_overlay_exit.label: "オーバーレイを閉じる"
actions.dashboard_overlay_exit.description: "ダッシュボードに戻る"
actions.dashboard_overlay_exit.long_help: "アタッチしたセッションオーバーレイから離れ、エージェントを停止せずにダッシュボードリストに戻ります。\nスクロールバック上の q、ニュートラルな Esc、または閉じるボタンからもアクセスできます。\nエージェントの単なるデタッチではなく停止するには Ctrl+X を使用してください。"
actions.dashboard_overlay_prev.label: "前のセッション"
actions.dashboard_overlay_prev.description: "前のセッション"
actions.dashboard_overlay_next.label: "次のセッション"
actions.dashboard_overlay_next.description: "次のセッション"
actions.dashboard_overlay_stop.label: "停止"
actions.dashboard_overlay_stop.description: "エージェントを停止、セッションを閉じる(ダッシュボードに戻る)"
actions.dashboard_overlay_stop.long_help: "セッションオーバーレイ内で、アタッチしたエージェントを停止して閉じ、ダッシュボードリストに戻ります。\n確認が必要です:Ctrl+X を 2 回押してください。\nCtrl+. はここでも早見表を開けます。停止に占有されるのは Ctrl+X のみです。"
actions.edit_prompt_external.label: "プロンプト編集"
actions.edit_prompt_external.description: "外部エディタでプロンプトを編集"
actions.edit_prompt_external.long_help: "現在のプロンプトドラフトを $VISUAL または $EDITOR で開き、どちらも未設定の場合は vi にフォールバックします。\nエディタを保存して閉じると更新されたテキストがコンポーザーに戻ります。プロンプトは送信されません。\n最小モードで通常の添付なしドラフトに使用できます。"
actions.toggle_mouse_capture.label: "マウス報告"
actions.toggle_mouse_capture.description: "マウス報告を切り替え(ネイティブコピー/貼り付け)"
