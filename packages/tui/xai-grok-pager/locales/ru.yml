actions.half_page_down.label: "полстраницы вниз"
actions.half_page_down.description: "Прокрутить на полстраницы вниз"
actions.page_up.label: "страница вверх"
actions.page_up.description: "Прокрутить на страницу вверх"
actions.page_down.label: "страница вниз"
actions.page_down.description: "Прокрутить на страницу вниз"
actions.collapse.label: "свернуть"
actions.collapse.description: "Свернуть выбранную запись"
actions.expand.label: "развернуть"
actions.expand.description: "Развернуть выбранную запись"
actions.toggle_fold.label: "свернуть"
actions.toggle_fold.description: "Развернуть / свернуть"
actions.toggle_fold.long_help: "Сворачивает или разворачивает выбранную запись ленты, скрывая или показывая её полное содержимое.\nУдобно для беглого просмотра длинных выводов инструментов или размышлений.\nСвязанное: E сворачивает/разворачивает каждую запись, Ctrl+E переключает все блоки размышлений."
actions.toggle_expand_all.label: "все"
actions.toggle_expand_all.description: "Развернуть все / свернуть все"
actions.toggle_expand_all.long_help: "Сворачивает или разворачивает все записи ленты сразу, в отличие от e, который переключает только выбранную строку.\nСверните длинную ленту, чтобы просмотреть заголовки, затем разверните всё обратно.\nУ блоков размышлений есть свой переключатель: Ctrl+E."
actions.expand_all_thinking.label: "развернуть/свернуть"
actions.expand_all_thinking.description: "Переключить все блоки размышлений"
actions.expand_all_thinking.long_help: "Показывает или скрывает блоки размышлений (reasoning) агента по всей ленте одним нажатием.\nРаскройте, как агент пришёл к ответу, или скройте размышления, чтобы сосредоточиться на результате.\nОтдельно от E, который сворачивает все записи независимо от типа."
actions.toggle_raw.label: "сырой"
actions.toggle_raw.description: "Переключить сырой markdown"
actions.toggle_raw.long_help: "Переключает выбранную запись между рендеренным markdown и его исходным текстом.\nИспользуйте, чтобы скопировать точный markdown, проверить цель ссылки или увидеть форматирование, скрытое рендерером.\nНажмите снова, чтобы вернуться к рендеренному виду."
actions.copy_block_content.label: "копировать"
actions.copy_block_content.description: "Копировать содержимое"
actions.copy_block_content.long_help: "Копирует содержимое выбранного блока в буфер обмена: текст сообщения, полный вывод инструмента или содержимое блока кода.\nПредлагается только для блоков, поддерживающих копирование.\nДля копирования только команды или пути к файлу используйте Y."
actions.copy_block_meta.label: "копировать команду"
actions.copy_block_meta.description: "Копировать команду / путь"
actions.copy_block_meta.long_help: "Копирует только идентификатор блока: командную строку вызова инструмента или путь файлового блока, не содержимое.\nУдобно, чтобы перезапустить команду или вставить путь в другом месте.\nИспользуйте строчное y для копирования полного содержимого."
actions.open_block_viewer.label: "смотреть"
actions.open_block_viewer.description: "Открыть в просмотрщике"
actions.open_block_viewer.long_help: "Открывает выбранный блок в сфокусированном, прокручиваемом полноэкранном просмотрщике.\nЛучше всего для длинных выводов инструментов, больших файлов или кода, который вы хотите прочитать вдали от окружающей ленты.\nEsc возвращает к диалогу."
actions.open_next_link.label: "ссылка"
actions.open_next_link.description: "Следующая ссылка"
actions.open_prev_link.label: "ссылка"
actions.open_prev_link.description: "Предыдущая ссылка"
actions.rewind.label: "откат"
actions.rewind.description: "Откатить к выбранному ходу"
actions.rewind.long_help: "Откатывает диалог к более раннему ходу, восстанавливая сделанный тогда снимок файлов и отбрасывая последующие изменения.\nВыберите ход из списка и что восстановить (всё, только диалог или только файлы); для выполняющегося хода сначала предлагается отмена, а любые конфликты или ошибки сообщаются после выполнения.\nДеструктивно: последующие ходы отбрасываются.\nВ простое также доступно с пустым промптом через Esc Esc (в течение 800 мс), как `/rewind`."
actions.kill_bg_task.label: "прервать"
actions.kill_bg_task.description: "Прервать фоновую задачу"
actions.kill_bg_task.long_help: "Прерывает фоновую задачу, принадлежащую выбранному блоку задачи (например, длинную shell-команду, отправленную в фон).\nИспользуйте, чтобы остановить runaway или больше не нужный процесс.\nПрименяется только к живой задаче; завершённые не затрагиваются."
actions.send_prompt.label: "отправить"
actions.send_prompt.description: "Отправить"
actions.focus_prompt.label: "промпт"
actions.focus_prompt.description: "Фокус на промпт"
actions.focus_scrollback.label: "лента"
actions.focus_scrollback.description: "Фокус на ленту"
actions.focus_scrollback.long_help: "Перемещает фокус с промпта на ленту, чтобы вы могли навигировать по диалогу.\nTab работает и в простом, и в vim-режиме ленты.\nEsc зарезервирован для политики очистки / отката (в простое), не для переключения фокуса."
actions.cancel_turn.label: "отмена"
actions.cancel_turn.description: "Отменить ход"
actions.cancel_turn.long_help: "Прерывает текущий ход агента и останавливает генерацию, оставляя сессию открытой.\nCtrl+C отменяет, когда промпт пуст; с непустым черновиком он сначала очищает промпт, а ход продолжается.\nЭто останавливает ход, а не приложение; для выхода используйте горячую клавишу выхода."
actions.cycle_mode.label: "режим"
actions.cycle_mode.description: "Цикл режимов (Нормальный / План / Всегда одобрять)"
actions.cycle_mode.long_help: "Переключает режим сессии: Нормальный -> План -> Всегда-одобрять -> Нормальный.\nРежим плана заставляет агента сначала планировать и не пишет файлы; Всегда-одобрять запускает каждый вызов инструмента без вопросов.\nCtrl+O напрямую переключает авто-одобрение."
actions.toggle_tasks.label: "задачи"
actions.toggle_tasks.description: "Переключить панель задач"
actions.toggle_tasks.long_help: "Показывает или скрывает панель задач, перечисляющую фоновые задачи и их статус.\nИспользуйте для мониторинга или возврата к работе, отправленной в фон через Ctrl+B.\nБоковая панель; выключите, чтобы освободить ширину."
actions.toggle_todos.label: "todo"
actions.toggle_todos.description: "Переключить панель todo"
actions.toggle_todos.long_help: "Показывает или скрывает панель todo: живой чек-лист задач агента для текущей работы.\nСмотрите, что он планирует сделать и что осталось, пока ход выполняется.\nБоковая панель; выключите, чтобы освободить ширину."
actions.toggle_queue.label: "очередь"
actions.toggle_queue.description: "Переключить очередь промптов"
actions.toggle_queue.long_help: "Показывает или скрывает очередь промптов.\nОчередь позволяет выстраивать follow-up промпты во время выполнения хода; каждый отправляется автоматически, когда агент завершает.\nЛокальное семейство macOS VS Code: Ctrl+4 основной (Ctrl+; / Ctrl+' альтернативы). Иначе Ctrl+; с Ctrl+' как альтернатива."
actions.open_sessions.label: "сессии"
actions.open_sessions.description: "Открыть сессии"
actions.open_sessions.long_help: "Открывает браузер сессий для возобновления или переключения между прошлыми диалогами.\nВыберите одну, чтобы переподключиться к её полной истории.\nОтличается от Дашборда агентов (Ctrl+\\), который управляет множеством живых агентов сразу."
actions.open_extensions.label: "расширения"
actions.open_extensions.description: "Открыть расширения"
actions.open_extensions.long_help: "Открывает менеджер расширений для MCP-серверов и плагинов: смотрите, что подключено и какие инструменты они добавляют.\nИспользуйте, чтобы подтвердить загрузку интеграции или просмотреть доступные инструменты.\nОтличается от настроек, где хранятся общие опции приложения."
actions.send_to_background.label: "в фон"
actions.send_to_background.description: "Отправить выполняющуюся задачу в фон"
actions.send_to_background.long_help: "Отсоединяет выполняющийся foreground Execute, чтобы он продолжал работать в фоне, пока вы читаете, ставите промпты в очередь или начинаете другое.\nОтслеживайте и возобновляйте его из панели задач (Ctrl+G).\nИмеет смысл, только когда foreground Execute реально выполняется."
actions.interject_prompt.label: "сейчас"
actions.interject_prompt.description: "Отправить сейчас во время выполнения (отменяет текущий ход)"
actions.interject_prompt.long_help: "Отправляет сообщение агенту во время хода, не отменяя его (вмешательство), чтобы вы могли направлять или добавлять контекст, пока он продолжает работу.\nОбычный Enter во время выполнения хода ставит follow-up в очередь на потом; этот аккорд вместо этого вливает текст поля в текущий ход.\nПри пустом поле обычный Enter (или этот аккорд) принудительно отправляет верхний follow-up из очереди — без необходимости фокусировать панель очереди. На панели очереди этот аккорд принудительно отправляет выбранную строку.\nИспользуйте, чтобы скорректировать курс, не теряя прогресс хода."
actions.enable_voice_mode.label: "голосовой режим"
actions.enable_voice_mode.description: "Начать голосовую диктовку (Ctrl+Space / F8)"
actions.voice_toggle.label: "микрофон"
actions.voice_toggle.description: "Голосовая диктовка (Ctrl+Space / F8)"
actions.voice_toggle.long_help: "Захват микрофона для диктовки, привязан к Ctrl+Space (или F8 — удобно, где Ctrl+Space занят, например переключение раскладки в macOS; на ноутбуке Fn+F8).\nПоведение следует настройке Захват голоса: переключение (нажать для старта, снова для остановки) или удержание-для-речи (удерживать для записи, отпустить для остановки), где удержание требует терминал с протоколом Kitty и иначе fallback на переключение. `/voice` переключает везде.\nРечь транскрибируется прямо в поле ввода."
actions.toggle_multiline.label: "многострочный"
actions.toggle_multiline.description: "Переключить многострочный ввод"
actions.toggle_multiline.long_help: "Переключает постоянное многострочное поле ввода, чтобы редактор оставался развёрнутым для составления длинных сообщений.\nВставляйте новые строки через Shift+Enter или Alt+Enter (или замыкающий backslash); обычный Enter всё ещё отправляет.\nCtrl+M переключает многострочность в промпте; вне промпта открывает выбор модели."
actions.bash_mode.label: "shell"
actions.bash_mode.description: "Shell-режим (введите ! в пустом промпте)"
actions.bash_mode.long_help: "Выполняет shell-команду, не покидая чат: введите ! в начале пустого промпта, затем команду.\nВывод команды попадает в ленту.\nУдалите ведущий !, чтобы вернуться к обычному промпту."
actions.toggle_yolo.label: "yolo"
actions.toggle_yolo.description: "Переключить всегда-одобрять"
actions.toggle_yolo.long_help: "Включает или выключает авто-одобрение (YOLO) для этой сессии.\nПока включено, агент выполняет каждый вызов инструмента (правки, shell, удаления) без подтверждения каждого действия.\nТо же состояние, что Всегда-одобрять в цикле Shift+Tab; используйте с осторожностью."
actions.new_session.label: "новая"
actions.new_session.description: "Новая сессия"
actions.new_session.long_help: "Начинает новую сессию с пустой лентой и контекстом.\nТребует подтверждения: нажмите дважды (первое нажатие взводит, второе начинает)\n чтобы случайно не отбросить текущий диалог."
actions.quit.label: "выход"
actions.quit.description: "Выход"
actions.quit.long_help: "Выходит из приложения. Требует подтверждения: нажмите дважды быстро;\nодиночное нажатие считается случайным и игнорируется.\nПривязано к Ctrl+Q, с Ctrl+D как алиасом (Ctrl+D основной в терминале VS Code)."
actions.command_palette.label: "команды"
actions.command_palette.description: "Палитра команд"
actions.command_palette.long_help: "Нечёткий поиск по каждому действию и slash-команде, затем запуск по имени.\nПолезно, когда не помните горячую клавишу.\nТакже открывается по ? пока фокус на ленте."
actions.shortcuts_help.label: "горячие клавиши"
actions.shortcuts_help.description: "Горячие клавиши"
actions.shortcuts_help.long_help: "Открывает эту шпаргалку по клавишам.\nЛистайте с помощью j/k, разворачивайте встроенную помощь строки через e или нажмите Enter для полной страницы деталей горячей клавиши.\nПривязано к Ctrl+. и Ctrl+X; панель показывает, какой ваш терминал надёжно отправляет."
actions.model_picker.label: "модель"
actions.model_picker.description: "Выбрать модель"
actions.model_picker.long_help: "Открывает выбор модели для переключения модели этой сессии; выбор применяется к последующим ходам.\nПривязано к Ctrl+M, но пока промпт в фокусе, этот аккорд переключает многострочность.\nДоступно из ленты или палитры команд."
actions.next_model.label: "Следующая модель"
actions.next_model.description: "Следующая scoped-модель"
actions.next_model.long_help: "Переключает вперёд по короткому списку scoped-моделей ([models].enabled_models).\nЕсли список пуст, перебирает все доступные модели.\nРедактируйте список через /scoped-models. Полный выбор остаётся в Ctrl+M / /model.\nНазначено на Alt+] (Alt+[ для предыдущей)."
actions.prev_model.label: "Предыдущая модель"
actions.prev_model.description: "Предыдущая scoped-модель"
actions.prev_model.long_help: "Переключает назад по короткому списку scoped-моделей ([models].enabled_models).\nЕсли список пуст, перебирает все доступные модели.\nНазначено на Alt+[ (Alt+] для следующей)."
actions.open_settings.label: "настройки"
actions.open_settings.description: "Открыть панель настроек"
actions.open_dashboard.label: "дашборд"
actions.open_dashboard.description: "Открыть Дашборд агентов"
actions.open_dashboard.long_help: "Открывает Дашборд агентов: список всех ваших выполняющихся и недавних агентов для мониторинга и переключения.\nРаботает отовсюду, включая экран приветствия и внутри сессии.\nОттуда вы можете запускать, подключаться, останавливать, группировать и переупорядочивать агентов."
actions.dashboard_select_next.label: "следующий"
actions.dashboard_select_next.description: "Выбрать следующую строку"
actions.dashboard_select_prev.label: "предыдущий"
actions.dashboard_select_prev.description: "Выбрать предыдущую строку"
actions.dashboard_toggle_pin.label: "закрепить"
actions.dashboard_toggle_pin.description: "Закрепить / открепить агента"
actions.dashboard_toggle_pin.long_help: "Закрепляет или открепляет выбранного агента, чтобы он оставался вверху списка независимо от сортировки или группировки.\nДержите нужных вам агентов в поле зрения, пока другие появляются и исчезают.\nЗакрепления сохраняются между сессиями дашборда."
actions.dashboard_begin_rename.label: "переименовать"
actions.dashboard_begin_rename.description: "Переименовать агента"
actions.dashboard_stop.label: "стоп"
actions.dashboard_stop.description: "Остановить / Закрыть агента"
actions.dashboard_stop.long_help: "Останавливает выбранного агента и удаляет его строку из дашборда; выполняющийся ход сначала прерывается.\nИспользуйте, чтобы убрать завершённых или ненужных агентов, не подключаясь к ним.\nЭквивалент в overlay (Ctrl+X) подтверждает перед остановкой."
actions.dashboard_cycle_mode.label: "режим"
actions.dashboard_cycle_mode.description: "Цикл режимов запуска"
actions.dashboard_cycle_mode.long_help: "Переключает режим запуска для агентов, которых вы запускаете с дашборда: Нормальный, План, затем Всегда-одобрять.\nПлан заставляет новых агентов сначала планировать перед изменением файлов; Всегда-одобрять запускает их инструменты без запросов.\nЗеркалит внутри-сессионный цикл Shift+Tab, применённый к новым запускам."
actions.dashboard_toggle_grouping.label: "группа"
actions.dashboard_toggle_grouping.description: "Переключить группировку строк"
actions.dashboard_toggle_grouping.long_help: "Переключает дашборд между плоским списком и строками, сгруппированными по состоянию, например работающие versus простаивающие.\nГруппировка выводит на первый план агентов, требующих внимания; плоский список сохраняет стабильный порядок.\nВаш выбор сохраняется между сессиями."
actions.dashboard_reorder_up.label: "вверх"
actions.dashboard_reorder_up.description: "Поднять агента"
actions.dashboard_reorder_down.label: "вниз"
actions.dashboard_reorder_down.description: "Опустить агента"
actions.dashboard_shortcuts_help.label: "горячие клавиши"
actions.dashboard_shortcuts_help.description: "Показать overlay горячих клавиш"
actions.dashboard_exit.label: "выход"
actions.dashboard_exit.description: "Закрыть дашборд"
actions.dashboard_exit.long_help: "Закрывает дашборд и возвращает вас туда, где вы были.\nEsc каскадный: он сначала закрывает открытый peek или сбрасывает активный фильтр и выходит, только когда больше ничего не ожидает.\nПерепривяжите это действие на другую клавишу для прямого выхода."
actions.dashboard_toggle_auto_approve.label: "всегда-одобрять"
actions.dashboard_toggle_auto_approve.description: "Переключить всегда-одобрять"
actions.dashboard_toggle_auto_approve.long_help: "Переключает авто-одобрение (YOLO) для выбранного агента прямо с дашборда, не подключаясь к нему.\nПока включено, этот агент выполняет каждый вызов инструмента без подтверждения каждого действия.\nВнутрисессионный эквивалент — Ctrl+O внутри сессии."
actions.dashboard_open_location_picker.label: "расположение"
actions.dashboard_open_location_picker.description: "Сменить рабочий каталог для новых агентов"
actions.dashboard_open_location_picker.long_help: "Открывает выбор для задания рабочего каталога, в котором запускаются новые агенты с дашборда.\nЗапускайте агентов в другом репо или папке, не покидая дашборд.\nВлияет только на новые запуски, не на уже выполняющихся агентов."
actions.dashboard_toggle_worktree.label: "worktree"
actions.dashboard_toggle_worktree.description: "Переключить режим worktree для новых агентов"
actions.dashboard_toggle_worktree.long_help: "Взводит следующего запускаемого с дашборда агента на создание в свежем git worktree, изолируя его работу в отдельном checkout.\nПрименяется, только когда рабочий каталог — git-репо.\nВлияет на новых запускаемых агентов, не на уже выполняющихся."
actions.dashboard_overlay_exit.label: "закрыть overlay"
actions.dashboard_overlay_exit.description: "Назад к дашборду"
actions.dashboard_overlay_exit.long_help: "Покидает overlay подключённой сессии и возвращается к списку дашборда, не останавливая агента.\nТакже доступно через q на ленте, нейтральный Esc или кнопку закрытия.\nЧтобы остановить агента, а не просто отсоединиться, используйте Ctrl+X."
actions.dashboard_overlay_prev.label: "пред. сессия"
actions.dashboard_overlay_prev.description: "Предыдущая сессия"
actions.dashboard_overlay_next.label: "след. сессия"
actions.dashboard_overlay_next.description: "Следующая сессия"
actions.dashboard_overlay_stop.label: "стоп"
actions.dashboard_overlay_stop.description: "Остановить агента, закрыть сессию (назад к дашборду)"
actions.dashboard_overlay_stop.long_help: "Внутри overlay сессии останавливает подключённого агента и закрывает его, возвращая вас к списку дашборда.\nТребует подтверждения: нажмите Ctrl+X дважды.\nCtrl+. здесь по-прежнему открывает шпаргалку; только Ctrl+X занят остановкой."
actions.edit_prompt_external.label: "править промпт"
actions.edit_prompt_external.description: "Править промпт во внешнем редакторе"
actions.edit_prompt_external.long_help: "Открывает текущий черновик промпта в $VISUAL или $EDITOR с fallback на vi, если ни одно не задано.\nСохранение и закрытие редактора возвращает обновлённый текст в поле ввода; промпт не отправляется.\nДоступно в минимальном режиме для обычных черновиков без вложений."
actions.toggle_mouse_capture.label: "отчёт о мыши"
actions.toggle_mouse_capture.description: "Переключить отчёт о мыши (нативное копирование/вставка)"


