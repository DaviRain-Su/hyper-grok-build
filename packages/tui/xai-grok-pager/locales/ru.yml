shortcuts_help.undo_long_help: "Отменяет последнее изменение в редакторе промпта.\nВключает ввод, удаление, удаление строки/слова и очистку черновика."
shortcuts_help.redo_long_help: "Повторяет последнее отменённое изменение в редакторе промпта.\nCtrl+Shift+Z — основной; Ctrl+R — альтернативный."
