settings.voice_stt_language.choice.tr.display: "Турецкий"
settings.voice_stt_language.choice.vi.display: "Вьетнамский"
settings.contextual_hints.undo.label: "Отменить"
settings.contextual_hints.undo.description: "Напоминает, что Ctrl+Z восстанавливает промпт после его очистки."
settings.contextual_hints.plan_mode.label: "Режим планирования"
settings.contextual_hints.plan_mode.description: "Предлагает режим планирования (Shift+Tab), когда ваш промпт похож на запрос планирования."
settings.contextual_hints.image_input.label: "Ввод изображений"
settings.contextual_hints.image_input.description: "Предлагает вставить изображение, когда оно в буфере обмена и модель принимает изображения."
settings.contextual_hints.send_now.label: "Отправить сейчас"
settings.contextual_hints.send_now.description: "После постановки follow-up в очередь во время хода напоминает, что Enter на пустом промпте отправляет верхний элемент очереди сразу."
settings.contextual_hints.small_screen.label: "Маленький экран"
settings.contextual_hints.small_screen.description: "Предлагает /compact-mode один раз за запуск, когда терминалу не хватает строк."
settings.contextual_hints.word_select.label: "Выбор слова"
settings.contextual_hints.word_select.description: "После двойного клика по тексту диалога, когда Выделение текста в режиме сворачивания/навигации, напоминает, что Выбор слова находится в Настройках."
settings.contextual_hints.ssh_wrap.label: "SSH wrap"
settings.contextual_hints.ssh_wrap.description: "При загрузке сессии по SSH рекомендует `grok wrap ssh` для проброса буфера обмена и восстановления терминала."
settings.fork_secondary_model.label: "Вторичная модель при fork"
settings.fork_secondary_model.description: "Модель для вторичного агента при fork. Выберите «(без переопределения)», чтобы очистить."

