settings.remember_tool_approvals.description: "Показывать опцию «Всегда разрешать» в запросах разрешений, чтобы вас не переспрашивали о конкретной команде или инструменте. Применяется в ask и auto; Always-approve всё равно пропускает все запросы. Требует перезапуска."
settings.multiline_mode.label: "Многострочный ввод"
settings.multiline_mode.description: "Когда включено, Enter вставляет новую строку, а Shift+Enter отправляет. Сбрасывается каждую сессию."
settings.default_model.label: "Модель по умолчанию"
settings.default_model.description: "Модель для новых сессий. Изменение также переключает текущую сессию. Выберите «(без переопределения)», чтобы очистить."
settings.max_thoughts_width.label: "Макс. ширина размышлений"
settings.max_thoughts_width.description: "Бюджет ширины колонок для панели размышлений агента (40-500, по умолчанию 120)."
settings.show_thinking_blocks.label: "Показывать блоки размышлений"
settings.show_thinking_blocks.description: "Показывать блоки размышлений/рассуждений агента в ленте во время стриминга."
settings.prompt_suggestions.label: "Подсказки промптов"
settings.prompt_suggestions.description: "После каждого хода предсказывает ваш вероятный следующий промпт и показывает его как текст-призрак в поле ввода (Tab для принятия). Использует небольшой вызов модели на каждый ход."
settings.respect_manual_folds.label: "Уважать ручные сворачивания"
settings.respect_manual_folds.description: "Сохраняет вручную свёрнутые блоки при стриминге и останавливает автопрокрутку при разворачивании блока. Экспериментальное."
settings.group_tool_verbs.label: "Группировать вызовы инструментов"
settings.group_tool_verbs.description: "Сворачивает последовательные вызовы инструментов чтения/поиска/листинга и строки субагентов в одну строку-сводку; завершённые размышления тоже сворачиваются в группу."
settings.collapsed_edit_blocks.label: "Свёрнутые блоки правок"
settings.collapsed_edit_blocks.description: "Показывает правки как однострочные сводки +N/-M diffstat и объединяет подряд идущие правки одного файла в один блок; разверните строку, чтобы увидеть diff'ы."
settings.display_refresh_auto_cadence.label: "Под частоту обновления монитора"
settings.display_refresh_auto_cadence.description: "На дисплеях с высокой частотой TUI стримит/скроллит быстрее, соответствуя дисплею. Выкл сохраняет классический ~60 Гц темп. Требует перезапуска."
settings.scroll_speed.label: "Скорость прокрутки"
settings.scroll_speed.description: "Множитель скорости прокрутки колеса мыши и трекпада (1-100). Больше = быстрее."
settings.scroll_mode.label: "Ввод прокрутки"
settings.scroll_mode.description: "Принудительно использовать поведение колеса или трекпада, когда автоопределение неверно определяет ваше устройство."
settings.scroll_mode.choice.auto.display: "Автоопределение"
settings.scroll_mode.choice.auto.description: "Определяет колесо или трекпад по жестам исходя из тайминга событий. По умолчанию."
settings.scroll_mode.choice.wheel.display: "Колесо мыши"
settings.scroll_mode.choice.wheel.description: "Всегда считать прокрутку делениями колеса (фиксированные строки на щелчок)."
settings.scroll_mode.choice.trackpad.display: "Трекпад"
settings.scroll_mode.choice.trackpad.description: "Всегда считать прокрутку трекпадом (дробное накопление)."
settings.scroll_lines.label: "Строки прокрутки"
settings.scroll_lines.description: "Строк на щелчок прокрутки для колеса и трекпада (1-10). Пока не задано, применяется профиль терминала."
settings.invert_scroll.label: "Инвертировать прокрутку"
settings.invert_scroll.description: "Инвертирует вертикальное направление прокрутки (естественная прокрутка)."
settings.keep_text_selection.label: "Выделение текста"
settings.keep_text_selection.description: "Как долго выделение в приложении остаётся на экране и что делает двойной клик (сворачивание vs. выделение и копирование слова). Для собственного выделения терминала или мультиплексора удерживайте Shift при перетаскивании (нативное копирование)."
settings.keep_text_selection.choice.flash.display: "Вспышка после копирования"
settings.keep_text_selection.choice.flash.description: "Краткая подсветка при отпускании мыши, затем очистка. Двойной клик переключает сворачивание. По умолчанию."
settings.keep_text_selection.choice.hold.display: "Удерживать до отмены"
settings.keep_text_selection.choice.hold.description: "Держать выделение видимым до Esc, клика или прокрутки. Двойной клик переключает сворачивание."
settings.keep_text_selection.choice.word_select.display: "Выбор слова (как в терминале)"
settings.keep_text_selection.choice.word_select.description: "Двойной клик выделяет и копирует слово, тройной — строку; выделение держится до отмены."
settings.coding_data_sharing.label: "Передача данных кодирования"
settings.coding_data_sharing.description: "Контролирует, может ли SpaceXAI сохранять данные сессий кодирования и использовать для обучения. Не влияет на продуктовую аналитику; см. документацию по конфигурации и мониторингу."
settings.coding_data_sharing.choice.opt-in.display: "Участвовать"
settings.coding_data_sharing.choice.opt-out.display: "Отказаться"
settings.default_selected_permission.label: "Выбор разрешения по умолчанию"
settings.default_selected_permission.description: "Какую строку курсор предвыбирает в запросах разрешений."
settings.default_selected_permission.choice.always_allow_all_sessions.display: "Всегда разрешать во всех сессиях"
settings.default_selected_permission.choice.allow_command_always.display: "Всегда разрешать эту команду"
settings.default_selected_permission.choice.allow_once.display: "Разрешить один раз"
settings.default_selected_permission.choice.reject.display: "Отклонить"
settings.toolset.ask_user_question.timeout_enabled.label: "Тайм-аут вопросов"
settings.toolset.ask_user_question.timeout_enabled.description: "Когда включено, инструмент ask_user_question завершится по тайм-ауту через заданное время, а не блокирует бесконечно."
settings.plan_mode.label: "Режим планирования"
settings.plan_mode.description: "Когда включено, агент сначала формулирует план перед запуском инструментов или правками."
settings.plan_mode.choice.off.display: "Выкл"
settings.plan_mode.choice.off.description: "Агент запускает инструменты и редактирует файлы напрямую (по умолчанию)."
settings.plan_mode.choice.on.display: "Вкл"
settings.plan_mode.choice.on.description: "Агент формулирует план и запрашивает одобрение перед запуском инструментов."
settings.show_tips.label: "Показывать советы"
settings.show_tips.description: "Показывать баннер совета дня при запуске. Требует перезапуска."
settings.contextual_hints.label: "Показывать контекстные подсказки"
settings.contextual_hints.description: "Показывать краткие контекстные подсказки по клавишам во время работы; каждую можно переключить отдельно."
settings.auto_update.label: "Авто-обновление"
settings.auto_update.description: "Автоматически загружать и устанавливать обновления пейджера при запуске. Требует перезапуска."
settings.hunk_tracker_mode.label: "Отслеживание hunk'ов"
settings.hunk_tracker_mode.description: "Какие изменения файлов агент отслеживает как hunk'и. Выкл полностью отключает отслеживание (и статистику LOC). Требует перезапуска."
settings.hunk_tracker_mode.choice.agent_only.display: "Только агент"
settings.hunk_tracker_mode.choice.agent_only.description: "Отслеживать только файлы, редактируемые агентом (по умолчанию)."
settings.hunk_tracker_mode.choice.all_dirty.display: "Все изменённые"
settings.hunk_tracker_mode.choice.all_dirty.description: "Отслеживать каждый git-dirty файл, включая внешние правки."
settings.hunk_tracker_mode.choice.off.display: "Выкл"
settings.hunk_tracker_mode.choice.off.description: "Полностью отключить отслеживание hunk'ов. Также отключает LOC-отслеживание."
settings.voice_capture_mode.label: "Захват голоса"
settings.voice_capture_mode.description: "Как ведёт себя голосовой аккорд (Ctrl+Space / F8): Переключение (нажать для старта/остановки) или Удерживать для речи (удерживать для записи, отпустить для остановки; нужен терминал с протоколом Kitty)."
settings.voice_capture_mode.choice.toggle.display: "Переключение"
settings.voice_capture_mode.choice.toggle.description: "Ctrl+Space / F8 начинает диктовку; нажмите снова (или Esc/Enter) для остановки."
settings.voice_capture_mode.choice.hold.display: "Удерживать для речи"
settings.voice_capture_mode.choice.hold.description: "Удерживайте Ctrl+Space / F8 для записи, отпустите для остановки. Нужен терминал с протоколом Kitty."
settings.voice_stt_language.label: "Язык голоса"
settings.voice_stt_language.description: "Язык распознавания речи для голосовой диктовки (Grok STT). По умолчанию английский; System использует ваш язык системы при поддержке. Также задаёт язык форматирования чисел и валют."
settings.voice_stt_language.choice.auto.display: "Система"
settings.voice_stt_language.choice.auto.description: "Использовать язык системы, если он поддерживается STT; иначе английский."
settings.voice_stt_language.choice.en.display: "Английский"
settings.voice_stt_language.choice.ar.display: "Арабский"
settings.voice_stt_language.choice.cs.display: "Чешский"
settings.voice_stt_language.choice.da.display: "Датский"
settings.voice_stt_language.choice.nl.display: "Нидерландский"
