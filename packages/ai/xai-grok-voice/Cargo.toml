[package]
license = "Apache-2.0"
name = "xai-grok-voice"
version = "0.1.0"
edition.workspace = true
description = "Voice dictation (streaming STT) and Codex Live voice sessions for Grok Build CLI"

[dependencies]
anyhow = { workspace = true }
futures-util = { workspace = true }
# Used by the standalone `voice-probe` bin to install the process-level crypto
# provider (`ring`, matching the pager's choice in its own main). The lib itself
# only reaches rustls through tokio-tungstenite.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
xai-dirs = { workspace = true }
# Shared rustls ClientConfig (native + webpki + EXTRA_CA). Upstream 1.0.8 STT
# streaming and `voice-probe` call this instead of installing rustls locally.
xai-grok-extra-ca = { workspace = true }
# Sanctioned TTY detach for the capture/playback subprocesses (Linux system
# recorders/players, macOS `__mic-capture`/`__speaker-play` self-exec helpers)
# — workspace rule: never spawn a raw `std::process::Command`.
xai-tty-utils = { workspace = true }

# --- Codex Live subsystem (`live` feature) --------------------------------
# Pinned to match the OMP (oh-my-pi v17.1.1, commit e9c8a35) native media stack
# that the `live` module ports, so the WebRTC/Opus ABI stays compatible. All are
# optional and only pulled in by `live`, so `--no-default-features` and
# `--features audio` link none of them.
audiopus_sys = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
flume = { workspace = true, optional = true }
# Reqwest for the Codex realtime signaling POST. Honors `HTTP_PROXY`/`NO_PROXY`
# env proxies natively (reqwest reads them via its `reqwest::Proxy` machinery
# only when explicitly configured, so the live transport reads the same env
# vars itself — see `live::transport::proxy` — and passes the resolved proxy
# URL into the client builder).
reqwest = { workspace = true, optional = true, features = ["rustls-tls", "json"] }
opus = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
# TLS connector for the sideband WebSocket CONNECT proxy tunnel (rustls with
# webpki roots, matching tokio-tungstenite's TLS backend). Only pulled in by
# `live` so `--no-default-features` and `--features audio` link none of them.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "tls12",
], optional = true }
webpki-roots = { version = "1.0", optional = true }
uuid = { workspace = true, optional = true }
webrtc = { workspace = true, optional = true }

[features]
# `audio` = "microphone capture is compiled in". It's enabled on every OS for
# production builds: macOS/Windows link `cpal`; Linux shells out to a system
# recorder (see `src/audio/capture_linux.rs`) and links no audio library, so
# `cpal` -> `alsa-sys` never reaches the fully-static musl release binary.
# `cpal` is target-gated to non-Linux below, so enabling `audio` on Linux pulls
# no extra dependency — it only compiles the subprocess backend.
default = ["audio"]
# Alternate default feature set that opts out of audio. CI builds the voice
# crate WITHOUT `audio` so the pager binary has no mic capture in the test
# sandbox (it has no audio device), which is what the pager's local PTY e2e
# test needs.
default-bazel = []
audio = ["dep:cpal"]
# `live` = "Codex Live voice session support is compiled in". The pager enables
# this via its own `codex-live` feature so the `/live` command can drive a
# real-time bidirectional voice session (WebRTC/Opus) against the Codex
# sideband. `live` implies `audio` (a live session needs mic capture) and pins
# the WebRTC/Opus stack; `--no-default-features` and `--features audio` compile
# neither. When this feature is off the `live` module is absent and the pager's
# `codex-live` feature compiles to a no-op gate (see `cfg(feature = "codex-live")`
# in the pager).
live = ["audio", "dep:audiopus_sys", "dep:base64", "dep:bytes", "dep:flume", "dep:opus", "dep:parking_lot", "dep:reqwest", "dep:tokio-rustls", "dep:webpki-roots", "dep:uuid", "dep:webrtc"]

# cpal is only used by the non-Linux capture backend (and the Windows live
# speaker playback backend). Gating it to non-Linux keeps `alsa-sys` (a NEEDED
# `libasound.so.2`) out of the static musl build; on Linux the `audio` feature
# compiles the subprocess recorder backend instead, and the live speaker plays
# back through a system player subprocess too.
[target.'cfg(not(target_os = "linux"))'.dependencies.cpal]
version = "0.15"
optional = true

[[bin]]
name = "voice-probe"
path = "src/bin/voice_probe.rs"
required-features = ["audio"]

[lints]
workspace = true